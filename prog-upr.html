<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791525916"><script src="phases.js?v=1791525916"></script><script src="data.js?v=1791525916"></script><script src="ui.js?v=1791525916"></script><title>Упражнение</title></head><body>
<style>
.h{display:flex;gap:12px;align-items:center;margin-bottom:12px}.h .t b{display:block;font-size:17px;font-weight:800;line-height:1.2}.h .t span{font-size:12px;color:var(--muted)}
.hi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.day{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}.day .cap{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}.day .cap b{color:var(--text);font-size:13px;display:flex;align-items:center;gap:6px}.day .cap b svg{width:14px;height:14px;color:var(--acc2)}
.sets{display:flex;flex-wrap:wrap;gap:6px}.sets .chip{cursor:default}
</style>
<div class="phone"><div class="scroll" id="root"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2652A"/><stop offset="1" stop-color="#F6B343"/></linearGradient></defs></svg><nav class="nav"><a href="dom.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>Дом</a><a href="tren.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>Тренировки</a><a href="pit.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12zm0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3" /></svg>Питание</a><a class="on" href="prog.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>Прогресс</a><a href="otchet.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>Отчёт</a></nav></div>
<script>
const D=window.DATA,U=window.UI;const I={back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`,trophy:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 21l8 0" /><path d="M12 17l0 4" /><path d="M7 4l10 0" /><path d="M17 4v8a5 5 0 0 1 -10 0v-8" /><path d="M5 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M19 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /></svg>`,play:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg>`,notes:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 3m0 2a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z" /><path d="M9 7l6 0" /><path d="M9 11l6 0" /><path d="M9 15l4 0" /></svg>`,photo:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 8h.01" /><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z" /><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5" /><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3" /></svg>`};
const name=decodeURIComponent(new URLSearchParams(location.search).get('ex')||'');const x=D.EX_ALL.find(e=>D.normKey(e.name)===D.normKey(name))||D.EX_ALL[0];
const h=D.exHistory(x.name);const best=h.length?h.reduce((a,b)=>b.best>a.best?b:a):null;let bs=null,bd=null;h.forEach(y=>y.sets.forEach(st2=>{if(!bs||D.e1rm(st2.kg,st2.reps)>D.e1rm(bs.kg,bs.reps)){bs=st2;bd=y.date}}));const byReps={};h.forEach(y=>y.sets.forEach(st2=>{if(!byReps[st2.reps]||st2.kg>byReps[st2.reps].kg)byReps[st2.reps]={kg:st2.kg,date:y.date}}));const vol=h.length?h.reduce((a,b)=>b.vol>a.vol?b:a):null;const e1=h.length?h[h.length-1].e1:0,e10=h.length?h[0].e1:0;const pct=e10?((e1/e10-1)*100).toFixed(1):'0';
const r=document.getElementById('root');
r.innerHTML=`<div class="hdr"><a href="prog.html">${I.back}</a><b style="font-size:15px">История</b><span style="width:30px"></span></div>
<div class="h"><div class="thumb" data-v>${I.play}</div><div class="t"><b>${x.name}</b><span>${x.muscle} · ${h.length} тренировок с 17 авг</span></div></div>
<div class="hi"><div class="stat"><b>${bs?bs.kg+' × '+bs.reps:'—'}</b><span>лучший подход${bd?'<br>'+D.fmtD(bd):''}</span></div><div class="stat"><b>${best?best.best:'—'}</b><span>кг, самый тяжёлый</span></div><div class="stat"><b>${vol?vol.vol.toLocaleString('ru'):'—'}</b><span>кг, рекорд объёма</span></div></div>
<div class="card"><div class="row"><b>Рекорды по повторениям</b><span class="muted" style="font-size:12px">лучший вес на каждое число</span></div><div class="sets" style="margin-top:10px">${Object.keys(byReps).map(Number).sort((a,b)=>a-b).map(r=>`<span class="chip">${byReps[r].kg} кг × ${r}</span>`).join('')}</div></div>
${h.length>1?`<div class="chart"><div class="cap"><b>Сила</b><span>расчётный максимум, кг</span></div><div class="row"><div class="big">${Math.round(e1)} <small>кг</small></div><span class="delta ${pct<0?'down':''}">${pct>0?'+':''}${pct} % с первой недели</span></div>${U.line([{v:h.map(y=>Math.round(y.e1)),dots:true,area:true}],h.map((y,i)=>({i,t:D.fmtD(y.date)})).filter((_,i)=>i%Math.ceil(h.length/4)===0||i===h.length-1),{h:130})}</div>`:''}
<div class="row2" style="margin:0 0 12px"><button class="ghost" data-tech>${I.notes} Техника</button></div>
<h2>По тренировкам</h2>
${h.slice().reverse().map(y=>`<div class="day"><div class="cap"><b>${y.best===(best&&best.best)&&y.date===best.date?I.trophy:''}${D.fmtDD(y.date)}</b><span>фаза ${y.phase}, неделя ${y.week} · ${y.vol.toLocaleString('ru')} кг</span></div><div class="sets">${y.sets.map(s=>`<span class="chip ${best&&s.kg===best.best&&y.date===best.date?'on':''}">${s.kg} × ${s.reps}</span>`).join('')}</div></div>`).join('')||'<div class="note">Ещё не выполнялось</div>'}`;
r.querySelector('[data-v]').onclick=()=>U.openSheet(`<h3>Видео техники</h3><div class="video">${I.play}</div><div class="row2"><button class="ghost" data-close>Закрыть</button></div>`);
r.querySelector('[data-tech]').onclick=()=>U.openSheet(`<h3>Техника: ${x.name}</h3><p>Кадры тренера с углами и моменты</p><div class="stills"><div class="still">${I.photo}<span>скрин тренера: старт</span><div class="ang" data-a="угол"></div></div><div class="still">${I.photo}<span>скрин тренера: нижняя точка</span><div class="ang" data-a="угол"></div></div></div><ul class="pts"><li><b>1</b><span>Момент техники, текст тренера</span></li><li><b>2</b><span>Момент техники, текст тренера</span></li><li><b>3</b><span>Момент техники, текст тренера</span></li></ul><div class="row2"><button class="btn" data-close>Понятно</button></div>`);
</script>
</body></html>
