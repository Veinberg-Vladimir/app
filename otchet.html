<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791310227"><script src="phases.js?v=1791310227"></script><script src="data.js?v=1791310227"></script><script src="ui.js?v=1791310227"></script><title>Отчёт</title></head><body>
<style>
.q{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}.q b{display:block;font-size:14px;margin-bottom:6px}.q .auto{font-size:12px;color:#5BE49B;font-weight:700}.q .sub{font-size:12px;color:var(--muted)}
.q .chips .chip{min-width:34px;justify-content:center}
.meas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.meas label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.meas input{width:100%;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-weight:800;text-align:center;font-size:15px}.meas input:focus{outline:none;border-color:var(--acc)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph label{aspect-ratio:3/4;border-radius:14px;background:var(--chip);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;cursor:pointer}.ph label.ok{border-style:solid;border-color:#2FBF71;color:#5BE49B}.ph label svg{width:22px;height:22px}
.rep{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}.rep .cap{display:flex;justify-content:space-between;align-items:baseline}.rep .cap b{font-size:15px}.rep .cap span{font-size:12px;color:var(--muted)}
.rep .row3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.rep .row3 div{background:var(--chip);border-radius:12px;padding:8px 4px;text-align:center}.rep .row3 b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.rep .row3 span{font-size:10px;color:var(--muted)}
.cm{display:flex;gap:10px;background:rgba(246,179,67,.08);border:1px solid rgba(246,179,67,.3);border-radius:12px;padding:10px 12px;font-size:13px}.cm b{color:var(--acc2);flex:none;font-size:12px}
.status{display:flex;align-items:center;gap:10px;background:rgba(47,191,113,.1);border:1px solid rgba(47,191,113,.4);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}.status svg{width:18px;height:18px;color:#5BE49B}
</style>
<div class="phone"><div class="scroll" id="root"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2652A"/><stop offset="1" stop-color="#F6B343"/></linearGradient></defs></svg><nav class="nav"><a href="dom.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>Дом</a><a href="tren.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>Тренировки</a><a href="pit.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12zm0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3" /></svg>Питание</a><a href="prog.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>Прогресс</a><a class="on" href="otchet.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>Отчёт</a></nav></div>
<script>
const D=window.DATA,U=window.UI;const I={check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,clip:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>`,cam:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 20h-7a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v3.5" /><path d="M16 19h6" /><path d="M19 16v6" /><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>`,video:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z" /><path d="M3 6m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z" /></svg>`,chev:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6l6 6l-6 6" /></svg>`,play:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg>`};
const NEXT='2026-10-04';const wk=D.DAYS.slice(-7),prev=D.DAYS.slice(-14,-7);const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const auto={was:+avg(prev.map(x=>x.weight)).toFixed(1),now:+avg(wk.map(x=>x.weight)).toFixed(1),sleep:+avg(wk.map(x=>x.sleep)).toFixed(1),trainings:D.WORKOUTS.filter(w=>w.done&&w.date>=wk[0].date).length+(D.store.get('done:'+D.TODAY,null)?1:0),steps:Math.round(avg(wk.map(x=>x.steps))),food:{kcal:Math.round(avg(wk.map(x=>x.food.kcal))),p:Math.round(avg(wk.map(x=>x.food.p))),f:Math.round(avg(wk.map(x=>x.food.f))),c:Math.round(avg(wk.map(x=>x.food.c)))},videos:2,weighDays:7};
const lastM=D.MEASURES[D.MEASURES.length-1];
const dayS=D.store.get('day:'+D.TODAY,{});const pick=k=>wk.map(x=>x.date===D.TODAY?(dayS[k]||null):x[k]).filter(Boolean);const enA=pick('energy'),stA=pick('stress');const f1=v=>v.toFixed(1).replace('.',',');
auto.energy=enA.length?f1(avg(enA)):'—';auto.stress=stA.length?f1(avg(stA)):'—';auto.enN=enA.length;auto.stN=stA.length;
let F=D.store.get('report:'+NEXT,{energy:null,stress:null,training:null,appetite:null,adherence:85,meas:{},photos:{},hard:'',sent:false});F.meas=F.meas||{};
const saveF=()=>D.store.set('report:'+NEXT,F);
function scale(k){return `<div class="chips">${Array.from({length:10},(_,i)=>`<button class="chip ${F[k]===i+1?'on':''}" data-s="${k}:${i+1}">${i+1}</button>`).join('')}</div>`}
function form(){return `<div class="q"><b>1. Средний вес</b><span class="auto">${I.check} считается сам</span><div class="sub">было ${auto.was} кг → стало ${auto.now} кг · ${(auto.now-auto.was).toFixed(1)} кг за неделю · взвешиваний ${auto.weighDays} из 7</div></div>
<div class="q"><b>2. Сколько часов сна в среднем за ночь?</b><span class="auto">${I.check} из чек-листа</span><div class="sub">${auto.sleep} ч, можно поправить</div></div>
<div class="q"><b>3. Самочувствие и энергия</b><span class="auto">${I.check} из чек-листа</span><div class="sub">${auto.energy} из 5 в среднем за неделю · отмечено ${auto.enN} из 7 дней</div></div>
<div class="q"><b>4. Уровень стресса</b><span class="auto">${I.check} из чек-листа</span><div class="sub">${auto.stress} из 5 в среднем за неделю · отмечено ${auto.stN} из 7 дней</div></div>
<div class="q"><b>5. Как шли силовые, из 10</b><span class="auto">${I.check} среднее из оценок после тренировок: 8</span>${scale('training')}</div>
<div class="q"><b>6. Сколько тренировок провёл?</b><span class="auto">${I.check} считается сам</span><div class="sub">${auto.trainings} из 3 по плану</div></div>
<div class="q"><b>7. Какое было чувство голода?</b><div class="chips">${['не было','слабое','обычное','повышенное'].map(a=>`<button class="chip ${F.appetite===a?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
<div class="q"><b>8. Насколько придерживался плана?</b><div class="row"><span class="sub">из 100 %</span><b style="color:var(--acc2)" id="adhV">${F.adherence} %</b></div><input type="range" min="0" max="100" step="5" value="${F.adherence}" id="adh"></div>
<div class="q"><b>Шаги и питание</b><span class="auto">${I.check} вместо скринов «Здоровья» и FatSecret</span><div class="sub">шаги ${auto.steps.toLocaleString('ru')} в день · ${auto.food.kcal.toLocaleString('ru')} ккал · Б ${auto.food.p} Ж ${auto.food.f} У ${auto.food.c}</div></div>
<div class="q"><b>Замеры, см</b><div class="sub" style="margin-bottom:8px">серым прошлые значения</div><div class="meas">${D.MEAS_FIELDS.map(([l,k])=>`<div><label>${l}</label><input inputmode="decimal" data-meas="${k}" value="${F.meas[k]||''}" placeholder="${lastM[k]}"></div>`).join('')}</div></div>
<div class="q"><b>Фото</b><div class="sub" style="margin-bottom:8px">тот же свет, то же место, утром до еды</div><div class="ph">${['спереди','сбоку','сзади'].map(p=>`<label class="${F.photos[p]?'ok':''}">${F.photos[p]?I.check:I.cam}<span>${p}</span><input type="file" accept="image/*" capture="environment" hidden data-ph="${p}"></label>`).join('')}</div></div>
<div class="q"><b>Что было сложно на этой неделе?</b><textarea class="note-in" id="hard" placeholder="Одной-двумя строками">${F.hard}</textarea></div>
<button class="btn" id="send" style="width:100%;justify-content:center">${I.clip} Отправить тренеру</button>
<div class="note">Тренер получит отчёт с колесом недели и графиками. Разбор придёт сюда же</div>`}
function render(){const r=document.getElementById('root');
r.innerHTML=`<h1 class="title">Отчёт</h1>
${F.sent?`<div class="status">${I.check} Отчёт за неделю отправлен · ждёт разбора тренера</div><div class="card"><div class="row"><b>Неделя 7 · ${D.fmtD(NEXT)}</b><span class="muted" style="font-size:12px">отправлен</span></div><div class="sub muted" style="font-size:13px;margin-top:6px">${auto.was} → ${auto.now} кг · сон ${auto.sleep} ч · энергия ${auto.energy} из 5 · стресс ${auto.stress} из 5 · план ${F.adherence} %</div><div class="row2"><button class="ghost" id="reopen">Открыть и поправить</button></div></div>`
:`<div class="card hero"><div class="eyebrow">Неделя 7 · ${D.fmtD(NEXT,true).toLowerCase()}</div><div class="row"><b style="font-size:17px">Отчёт недели</b><span class="muted" style="font-size:12px">заполнить завтра</span></div><div class="sub muted" style="font-size:13px;margin:6px 0 10px">Половина уже собрана сама: вес, сон, тренировки, шаги, питание. От тебя 3 ответа, замеры и 3 фото</div><div class="minibar"><i style="width:65%"></i></div></div>
<h2>Твои вопросы</h2>${form()}`}
<h2>Прошлый разбор</h2>
<div class="card" style="border:1px solid rgba(246,179,67,.3)"><div class="row"><b>Неделя 6 · ${D.fmtD(D.REPORTS[5].date)}</b><span class="muted" style="font-size:12px">разбор тренера</span></div><ul class="pts" style="margin:8px 0 0">${D.REPORTS[5].review.map(([h,t])=>`<li style="flex-direction:column;gap:2px"><b style="font-size:12px;text-transform:uppercase;letter-spacing:.03em">${h}</b><span>${t}</span></li>`).join('')}</ul></div>
<h2>Прошлые отчёты</h2>
${D.REPORTS.slice().reverse().map(x=>`<div class="rep" data-r="${x.n}"><div class="cap"><b>Неделя ${x.n}</b><span>${D.fmtD(x.date)}</span></div><div class="row3"><div><b>${x.weightNow}</b><span>кг, было ${x.weightWas}</span></div><div><b>${x.adherence}%</b><span>план</span></div><div><b>${x.sleep}</b><span>сон, ч</span></div><div><b>${x.trainings}/3</b><span>трениров.</span></div></div><div class="cm"><b>Разбор</b><span>${x.comment}</span></div></div>`).join('')}
<div class="note">Демо: 6 прошлых отчётов и разборы сгенерированы для макета</div>`;
if(F.sent){r.querySelector('#reopen').onclick=()=>{F.sent=false;saveF();render()}}else{
 r.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.s.split(':');F[k]=+v;saveF();render()});
 r.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{F.appetite=b.dataset.a;saveF();render()});
 const adh=r.querySelector('#adh');adh.oninput=e=>{F.adherence=+e.target.value;r.querySelector('#adhV').textContent=F.adherence+' %'};adh.onchange=saveF;
 r.querySelectorAll('[data-meas]').forEach(i=>i.onchange=e=>{F.meas[i.dataset.meas]=e.target.value;saveF()});
 r.querySelectorAll('[data-ph]').forEach(i=>i.onchange=()=>{F.photos[i.dataset.ph]=true;saveF();render();U.toast('Фото добавлено')});
 r.querySelector('#hard').onchange=e=>{F.hard=e.target.value;saveF()};
 r.querySelector('#send').onclick=()=>{const miss=[];if(!F.training)miss.push('силовые');if(!F.appetite)miss.push('голод');if(miss.length){U.toast('Не хватает: '+miss.join(', '));return}F.sent=true;saveF();render();window.scrollTo(0,0);U.toast('Отправлено. Разбор придёт сюда')}}
r.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{const x=D.REPORTS.find(y=>y.n===+el.dataset.r);U.openSheet(`<h3>Отчёт недели ${x.n}</h3><p>${D.fmtD(x.date,true)}</p>
<div class="stats"><div class="stat"><b>${x.weightNow}</b><span>кг, было ${x.weightWas}</span></div><div class="stat"><b>${(x.weightNow-x.weightWas).toFixed(1)}</b><span>кг за неделю</span></div><div class="stat"><b>${x.adherence}%</b><span>план</span></div></div>
<ul class="pts"><li><b>2</b><span>Сон ${x.sleep} ч</span></li><li><b>3</b><span>Энергия ${x.energy} из 5</span></li><li><b>4</b><span>Стресс ${x.stress} из 5</span></li><li><b>5</b><span>Силовые ${x.training}/10</span></li><li><b>6</b><span>Тренировок ${x.trainings} из 3</span></li><li><b>7</b><span>Голод: ${x.appetite}</span></li><li><b>+</b><span>Шаги ${x.steps.toLocaleString('ru')} · ${x.food.kcal.toLocaleString('ru')} ккал · Б ${x.food.p} Ж ${x.food.f} У ${x.food.c}</span></li><li><b>см</b><span>${D.MEAS_FIELDS.map(([l,k])=>l.toLowerCase()+' '+x.meas[k]).join(' · ')}</span></li><li><b>?</b><span>Сложно: ${x.hard}</span></li></ul>
<h4>Разбор тренера</h4><ul class="pts" style="margin:0">${x.review.map(([h,t])=>`<li style="flex-direction:column;gap:2px"><b style="font-size:12px;text-transform:uppercase;letter-spacing:.03em">${h}</b><span>${t}</span></li>`).join('')}</ul><div class="row2"><button class="btn" data-close>Закрыть</button></div>`)})}
render();
</script>
</body></html>
