<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791525916"><script src="phases.js?v=1791525916"></script><script src="data.js?v=1791525916"></script><script src="ui.js?v=1791525916"></script><title>Клиенты</title></head><body>
<style>
.cl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;color:var(--text);text-decoration:none;border:1px solid rgba(255,255,255,.03)}
.cl .t{flex:1;min-width:0}
.cl .t b{display:block;font-size:15px;font-weight:800}
.cl .t span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.fl{display:flex;align-items:flex-start;gap:5px;font-size:12px;color:#E5533D;font-weight:600;margin-top:5px;line-height:1.3}
.fl svg{width:13px;height:13px;flex:none;margin-top:1px}
.fl.soft{color:var(--acc2)}
.cl .w{text-align:right;flex:none}
.cl .w b{display:block;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.cl .w b i{font-style:normal;font-size:11px;color:#5BE49B;font-weight:700;margin-left:4px}
.cl .w b i.up{color:#E5533D}
.cl .w b i.dim{color:var(--muted)}
.cl .w span{font-size:11px;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum .stat{padding:10px 6px}
.sum .stat b{font-size:22px}
.sum .stat b.red{color:#E5533D}.sum .stat b.gold{color:var(--acc2)}.sum .stat b.green{color:#5BE49B}
.filters .chip.red.on{border-color:#E5533D;color:#E5533D}
</style>
<div class="phone"><div class="scroll" id="root"></div></div>
<script>
const D=window.DATA,U=window.UI;
const I={back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`,settings:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>`,flag:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9" /><path d="M5 21v-7" /></svg>`,chev:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6l6 6l-6 6" /></svg>`,users:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /><path d="M21 21v-2a4 4 0 0 0 -3 -3.85" /></svg>`};
const f1=v=>v.toFixed(1).replace('.',',');
/* успеваемость недели: та же формула, что у клиента в Прогрессе */
const doneW=D.WORKOUTS.filter(w=>w.done);
function weekScore(a,b){const days=D.DAYS.filter(x=>x.date>=a&&x.date<=b);if(!days.length)return null;const tr=Math.min(1,doneW.filter(w=>w.date>=a&&w.date<=b).length/3);const n=D.normAt(b);const food=D.sum(days.map(x=>{const dev=Math.abs(x.food.kcal-n.kcal)/n.kcal;return dev<0.1?1:dev<0.2?0.6:0.2}))/days.length;const steps=Math.min(1,D.sum(days.map(x=>x.steps))/days.length/D.C.stepsGoal);const sleep=Math.min(1,D.sum(days.map(x=>x.sleep))/days.length/D.C.sleepGoal);return {tr,food,steps,sleep,avg:(tr+food+steps+sleep)/4}}
/* Андрей: демо-клиент, цифры из данных приложения */
function andrey(){const last=D.DAYS[D.DAYS.length-1];const sc=weekScore('2026-09-21','2026-09-27');const wk=D.DAYS.slice(-7);const sleep=D.sum(wk.map(x=>x.sleep))/7;const over=wk.filter(x=>x.food.kcal>D.normAt(x.date).kcal*1.1).length;
  const flags=[{t:'Фаза 12 кончается 11 окт, Фаза 13 не назначена',red:true}];
  if(sleep<7)flags.push({t:`Сон ${f1(sleep)} ч в среднем за 7 дней при цели ${f1(D.C.sleepGoal)}`});
  if(over>=2)flags.push({t:`${over} дня из 7 выше нормы калорий`});
  return {name:'Андрей',week:7,phase:'Фаза 12, нед. 3',kg:last.weight,dk:+(last.weight-D.C.startWeight).toFixed(1),score:sc?sc.avg:null,flags,demo:true}}
/* остальные клиенты придуманы для вида списка */
const OTHERS=[
 {name:'Сергей',week:2,phase:'Фаза 1, нед. 2',kg:104.8,dk:-1.6,score:.62,flags:[{t:'Отчёт недели пришёл, разбор не отправлен',red:true},{t:'Вес не внесён 3 дня'}]},
 {name:'Дмитрий',week:5,phase:'Фаза 2, нед. 1',kg:88.1,dk:-3.2,score:.81,flags:[{t:'Норма пересчитана после -3 кг: 2 120 ккал, ждёт утверждения',red:true}]},
 {name:'Артём',week:4,phase:'Фаза 1, нед. 4',kg:101.3,dk:-2.7,score:.84,flags:[{t:'Жим лёжа не добран две недели: предложено снизить вес на шаг, подтвердить',red:true}]},
 {name:'Олег',week:11,phase:'Фаза 3, нед. 3',kg:97.5,dk:-6.8,score:.74,flags:[{t:'Пропущена тренировка в четверг'},{t:'Калории выше нормы 3 дня подряд'}]},
 {name:'Роман',week:6,phase:'Фаза 2, нед. 2',kg:85.4,dk:-3.9,score:.67,flags:[{t:'Сон 5,9 ч за неделю при цели 7,5'}]},
 {name:'Максим',week:1,phase:'Фаза 1, нед. 1',kg:112.0,dk:0,score:null,flags:[{t:'Первая неделя: вес не внесён ни разу'}]},
 {name:'Игорь',week:8,phase:'Фаза 2, нед. 4',kg:91.2,dk:-5.0,score:.93,flags:[]},
 {name:'Алексей',week:3,phase:'Фаза 1, нед. 3',kg:99.6,dk:-2.1,score:.88,flags:[]},
 {name:'Виктор',week:9,phase:'Фаза 3, нед. 1',kg:94.0,dk:-4.4,score:.95,flags:[]},
 {name:'Константин',week:7,phase:'Фаза 2, нед. 3',kg:89.9,dk:-3.5,score:.86,flags:[]},
 {name:'Станислав',week:10,phase:'Фаза 3, нед. 2',kg:93.7,dk:-5.6,score:.91,flags:[]}];
const ALL=[andrey()].concat(OTHERS);
const bucket=c=>c.flags.some(f=>f.red)?'red':c.flags.length?'gold':'green';
const ORDER={red:0,gold:1,green:2};
ALL.sort((a,b)=>ORDER[bucket(a)]-ORDER[bucket(b)]||a.name.localeCompare(b.name,'ru'));
const st={f:'all'};
function ringS(p){const size=46,r=(size-6)/2,c=2*Math.PI*r;const col=p==null?'#30313F':p>=0.9?'#2FBF71':p>=0.7?'#F6B343':'#E5533D';return `<svg class="gfx" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#262633" stroke-width="5"/>${p==null?'':`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`}<text x="50%" y="55%" text-anchor="middle" fill="${p==null?'#7A7C83':'#fff'}" font-size="12" font-weight="800" font-family="Manrope,Arial">${p==null?'нет':Math.round(p*100)}</text></svg>`}
function row(c){const b=bucket(c);const dk=c.dk;const di=dk===0?'<i class="dim">старт</i>':`<i class="${dk>0?'up':''}">${dk>0?'+':''}${f1(dk)}</i>`;
  return `<a class="cl" href="klient.html?c=${encodeURIComponent(c.name)}">${ringS(c.score)}<div class="t"><b>${c.name}</b><span>${c.week}-я неделя · ${c.phase}</span>${c.flags.map(f=>`<div class="fl ${f.red?'':'soft'}">${I.flag}<span>${f.t}</span></div>`).join('')}</div><div class="w"><b>${f1(c.kg)}${di}</b><span>кг</span></div></a>`}
function render(){const r=document.getElementById('root');const n={red:0,gold:0,green:0};ALL.forEach(c=>n[bucket(c)]++);
  const list=ALL.filter(c=>st.f==='all'||bucket(c)===st.f);
  r.innerHTML=`<div class="hdr"><a href="index.html">${I.back}</a><b style="font-size:17px">Клиенты</b><a href="trener.html" title="Импорт программы и баланс">${I.settings}</a></div>
  <div class="card hero"><div class="eyebrow">${D.fmtD(D.TODAY,true)}</div><div class="row"><b style="font-size:17px">${D.pl(ALL.length,'клиент','клиента','клиентов')}</b><span class="muted" style="font-size:12px">отчёты недели придут завтра</span></div>
   <div class="sum"><div class="stat"><b class="red">${n.red}</b><span>ждут тебя</span></div><div class="stat"><b class="gold">${n.gold}</b><span>присмотреться</span></div><div class="stat"><b class="green">${n.green}</b><span>по плану</span></div></div></div>
  <div class="filters">${[['all','Все'],['red','Ждут тебя'],['gold','Присмотреться'],['green','По плану']].map(([k,t])=>`<button class="chip ${k==='red'?'red':''} ${st.f===k?'on':''}" data-f="${k}">${t}${k==='all'?' '+ALL.length:' '+n[k]}</button>`).join('')}</div>
  ${list.map(row).join('')||'<div class="note">Пусто</div>'}
  <div class="note" style="text-align:left;margin-top:14px">Рисунок панели тренера. Кружок у имени это успеваемость последней недели: среднее по тренировкам, питанию, шагам и сну, та же цифра, что клиент видит в Прогрессе. Красная строка ждёт твоего действия, жёлтая просит присмотреться. Андрей это демо-клиент за 7 недель, его цифры считаются из данных приложения. Остальные одиннадцать придуманы для вида списка</div>`;
  r.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.f=b.dataset.f;render()})}
render();
</script>
</body></html>
