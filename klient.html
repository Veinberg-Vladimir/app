<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791533599"><script src="phases.js?v=1791533599"></script><script src="data.js?v=1791533599"></script><script src="ui.js?v=1791533599"></script><title>Карточка клиента</title></head><body>
<style>
.flag{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(229,83,61,.4)}
.flag.soft{border-color:rgba(246,179,67,.35)}
.flag.ok{border-color:rgba(47,191,113,.35)}
.flag .ic{width:30px;height:30px;border-radius:10px;background:rgba(229,83,61,.14);color:#E5533D;display:grid;place-items:center;flex:none}
.flag.soft .ic{background:rgba(246,179,67,.12);color:var(--acc2)}
.flag.ok .ic{background:rgba(47,191,113,.12);color:#5BE49B}
.flag .ic svg{width:16px;height:16px}
.flag .t{flex:1;min-width:0}
.flag .t b{display:block;font-size:14px;line-height:1.3}
.flag .t span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.flag .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:7px 10px;font-size:13px;align-items:baseline}
.kv .k{color:var(--muted)}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv .d{font-size:12px;font-weight:700;color:#5BE49B;text-align:right;min-width:48px;font-variant-numeric:tabular-nums}
.kv .d.bad{color:#E5533D}
.kv .d.dim{color:var(--muted);font-weight:500}
.exl{border-top:1px solid var(--line);padding:10px 0}
.exl:first-child{border-top:0;padding-top:0}
.exl b{display:block;font-size:14px}
.exl .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.exl .s b{display:inline;font-size:12px;color:var(--text)}
.red{color:#E5533D}.green{color:#5BE49B}.gold{color:var(--acc2)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.supp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.supp:first-child{border-top:0;padding-top:0}
.supp span{font-size:12px;color:var(--muted)}
.dots7{display:flex;gap:3px}
.dots7 i{width:9px;height:9px;border-radius:50%;background:var(--chip2)}
.dots7 i.on{background:var(--grad)}
.dayrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;align-items:baseline}
.dayrow:first-child{border-top:0}
.dayrow .k{color:var(--muted)}
.dayrow .m{font-size:12px;color:var(--muted)}
.ta{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:13px;line-height:1.4;padding:10px 12px;min-height:150px;resize:vertical}
.ta:focus{outline:none;border-color:var(--acc)}
.wk{display:flex;gap:12px;align-items:center}
.stat b.red{color:#E5533D}
</style>
<div class="phone"><div class="scroll" id="root"></div></div>
<script>
const D=window.DATA,U=window.UI;
const I={back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`,tg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4" /></svg>`,flag:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9" /><path d="M5 21v-7" /></svg>`,warn:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 9v4" /><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" /><path d="M12 16h.01" /></svg>`,send:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></svg>`,pencil:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /><path d="M13.5 6.5l4 4" /></svg>`,chev:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6l6 6l-6 6" /></svg>`,check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,photo:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 8h.01" /><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z" /><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5" /><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3" /></svg>`,barbell:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>`,download:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg>`,circle:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M9 12l2 2l4 -4" /></svg>`};
const Q=new URLSearchParams(location.search).get('c');
const C=D.C;const f1=v=>v.toFixed(1).replace('.',',');const sg=(v,dig)=>(v>0?'+':'')+(dig===0?Math.round(v):f1(v));const num=v=>Math.round(v).toLocaleString('ru');
const st={tab:D.store.get('klient:tab','svodka'),angle:'спереди'};
const doneW=D.WORKOUTS.filter(w=>w.done);const last=D.DAYS[D.DAYS.length-1];const R6=D.REPORTS[5];const norm=D.normAt(D.TODAY);
const weightNow=last.weight,dStart=+(weightNow-C.startWeight).toFixed(1),dWeek=+(R6.weightNow-R6.weightWas).toFixed(1),toGoal=+(weightNow-(C.startWeight-10)).toFixed(1);
function weekScore(a,b){const days=D.DAYS.filter(x=>x.date>=a&&x.date<=b);if(!days.length)return null;const tr=Math.min(1,doneW.filter(w=>w.date>=a&&w.date<=b).length/3);const n=D.normAt(b);const food=D.sum(days.map(x=>{const dev=Math.abs(x.food.kcal-n.kcal)/n.kcal;return dev<0.1?1:dev<0.2?0.6:0.2}))/days.length;const steps=Math.min(1,D.sum(days.map(x=>x.steps))/days.length/C.stepsGoal);const sleep=Math.min(1,D.sum(days.map(x=>x.sleep))/days.length/C.sleepGoal);return {tr,food,steps,sleep,avg:(tr+food+steps+sleep)/4}}
const SC=weekScore('2026-09-21','2026-09-27');
/* успеваемость: кольцо и четыре полоски, как у клиента в Прогрессе */
function scoreBars(){const V=[['Тренировки',SC.tr,'3 из 3 по плану'],['Питание',SC.food,'дней в норме калорий'],['Шаги',SC.steps,'к плану '+num(C.stepsGoal)],['Сон',SC.sleep,'к '+f1(C.sleepGoal)+' ч']];
  return V.map(([l,v,t])=>`<div style="margin-top:12px"><div class="row"><b style="font-size:13px">${l}</b><b style="font-size:13px;color:${v>=0.9?'#5BE49B':v>=0.7?'var(--acc2)':'#E5533D'}">${Math.round(v*100)}%</b></div><div class="minibar" style="height:8px;margin-top:6px"><i class="${v>=0.9?'green':v>=0.7?'':'red'}" style="width:${Math.round(v*100)}%"></i></div><span class="muted" style="font-size:10px">${t}</span></div>`).join('')}
/* флаги по Андрею, считаются из его данных */
function flags(){const wk=D.DAYS.slice(-7);const sleep=D.sum(wk.map(x=>x.sleep))/7;const over=wk.filter(x=>x.food.kcal>D.normAt(x.date).kcal*1.1).length;const steps=D.sum(wk.map(x=>x.steps))/7;const prop=proposals();
  const out=[{red:true,t:'Фаза 12 кончается 11 окт, Фаза 13 не назначена',s:'Без новой фазы с понедельника 12 окт у клиента пустые тренировки',act:`<a class="ghost" href="trener.html">${I.download} Назначить из таблицы</a>`}];
  out.push({t:`Веса на неделю 4 предложены сами: ${D.pl(prop.length,'упражнение','упражнения','упражнений')}`,s:'Клиент увидит их как «предложено тренером». Поправь, если не согласен',act:`<button class="ghost" data-tab="prog">Посмотреть</button>`});
  if(sleep<7)out.push({t:`Сон ${f1(sleep)} ч в среднем за 7 дней при цели ${f1(C.sleepGoal)}`,s:'Короткий сон тормозит и вес, и силу'});
  if(over>=2)out.push({t:`${over} дня из 7 выше нормы калорий больше чем на 10 %`,s:'Дни видны во вкладке Питание'});
  if(steps<C.stepsGoal*0.8)out.push({t:`Шаги ${num(steps)} в день при цели ${num(C.stepsGoal)}`});
  return out}
/* предложение весов на неделю 4 по правилам Владимира: фиксированные повторения лесенка +5 %, диапазон тот же вес */
function parseReps(r){r=String(r);if(r.includes(','))return r.split(',').map(Number);if(r.includes('-')){const [a,b]=r.split('-').map(Number);return {lo:a,hi:b}}const n=parseInt(r);return isNaN(n)?10:n}
function proposals(){const ws=D.WORKOUTS.filter(w=>w.phase==='12'&&w.week===3&&w.done);const out=[];ws.forEach(w=>w.ex.forEach(e=>{if(!e.sets.length)return;const rp=parseReps(e.target.reps);const need=i=>Array.isArray(rp)?rp[i]:typeof rp==='number'?rp:rp.lo;const done=e.sets.every((s,i)=>s.reps>=need(i));const M=e.sets[e.sets.length-1].kg;const step=D.round(0.05*M,M>=20?2.5:1)||(M>=20?2.5:1);
  let next,why;if(typeof rp==='object'&&!Array.isArray(rp)){next=done?e.sets.map(s=>s.kg):e.sets.map(s=>D.round(s.kg*0.95,M>=20?2.5:1));why=done?`вес тот же, цель ${rp.hi} повторений`:'не добран: вес на шаг ниже'}else{next=done?e.sets.map(s=>s.kg+step):e.sets.map(s=>s.kg);why=done?`лесенка на шаг выше, +${step} кг`:'не добран: веса недели повторить'}
  out.push({name:e.name,sets:e.sets,reps:e.target.reps,next,why,done})}));return out}
const setsStr=sets=>{const same=sets.every(s=>s.reps===sets[0].reps);return same?`${sets.map(s=>s.kg).join(' · ')} кг × ${sets[0].reps}`:sets.map(s=>`${s.kg}×${s.reps}`).join(' · ')};
const tabs=()=>U.seg([{k:'svodka',t:'Сводка'},{k:'prog',t:'Программа'},{k:'pit',t:'Питание'},{k:'telo',t:'Тело'}],st.tab,'tab');
function hero(){return `<div class="card hero"><div class="eyebrow">7-я неделя ведения · Фаза 12, неделя 3 из 4</div><div class="row" style="align-items:flex-end"><div><div class="big">${f1(weightNow)} <small>кг · старт ${f1(C.startWeight)}</small></div><div class="muted" style="font-size:12px;margin-top:2px">${C.age} года · ${C.height} см · цель ${C.goal}</div></div><div style="text-align:right"><div class="delta ${dStart>0?'down':''}" style="font-size:18px;white-space:nowrap">${sg(dStart)} кг</div><div class="muted" style="font-size:11px">с ${D.fmtD(C.start)}</div></div></div>
  <div class="stats" style="margin-bottom:0"><div class="stat"><b>${sg(dWeek)}</b><span>за неделю, кг</span></div><div class="stat"><b>${f1(toGoal)}</b><span>до цели, кг</span></div><div class="stat"><b>${doneW.filter(w=>w.date>='2026-09-28').length}<small style="font-size:12px;color:var(--muted);font-weight:600"> из 3</small></b><span>тренировок на неделе</span></div></div></div>`}
function svodka(){const F=flags();const m0=D.MEASURES[0],m6=R6.meas;
  return `${hero()}
  <h2>Ждёт тебя</h2>${F.map(f=>`<div class="flag ${f.red?'':'soft'}"><div class="ic">${f.red?I.flag:I.warn}</div><div class="t"><b>${f.t}</b>${f.s?`<span>${f.s}</span>`:''}${f.act?`<div class="act">${f.act}</div>`:''}</div></div>`).join('')}
  <h2>Успеваемость недели</h2><div class="chart hero"><div class="cap"><b>Среднее ${Math.round(SC.avg*100)} %</b><span>21 - 27 сен, последняя полная</span></div><div style="display:flex;gap:16px;align-items:center"><div>${U.ring(SC.avg,112,Math.round(SC.avg*100)+'%','среднее')}</div><div style="flex:1;min-width:0">${scoreBars()}</div></div><div class="note" style="margin-top:10px">Та же картинка, что у клиента в Прогрессе. Красное ниже 70 %</div></div>
  <h2>Отчёт недели 6 · ${D.fmtD(R6.date)}</h2><div class="card"><div class="kv">
   <span class="k">Вес, среднее за неделю</span><span class="v">${f1(R6.weightWas)} → ${f1(R6.weightNow)}</span><span class="d ${dWeek>0?'bad':''}">${sg(dWeek)}</span>
   <span class="k">Талия, см</span><span class="v">${f1(D.MEASURES[5].waist)} → ${f1(m6.waist)}</span><span class="d">${sg(m6.waist-D.MEASURES[5].waist)}</span>
   <span class="k">Калории, среднее</span><span class="v">${num(R6.food.kcal)}</span><span class="d dim">норма ${num(D.normAt(R6.date).kcal)}</span>
   <span class="k">Белок, г</span><span class="v">${R6.food.p}</span><span class="d dim">норма ${D.normAt(R6.date).p}</span>
   <span class="k">Тренировки</span><span class="v">${R6.trainings} из 3</span><span class="d dim">силовые ${R6.training}/10</span>
   <span class="k">Шаги в день</span><span class="v">${num(R6.steps)}</span><span class="d ${R6.steps<C.stepsGoal*0.8?'bad':'dim'}">цель ${num(C.stepsGoal)}</span>
   <span class="k">Сон, ч</span><span class="v">${f1(R6.sleep)}</span><span class="d ${R6.sleep<7?'bad':'dim'}">цель ${f1(C.sleepGoal)}</span>
   <span class="k">Энергия · стресс</span><span class="v">${String(R6.energy).replace('.',',')} · ${String(R6.stress).replace('.',',')}</span><span class="d dim">из 5</span>
   <span class="k">Голод</span><span class="v">${R6.appetite}</span><span class="d dim"></span>
   <span class="k">Придерживался плана</span><span class="v">${R6.adherence} %</span><span class="d dim"></span></div>
   <div style="margin-top:12px;font-size:13px"><span class="muted">Что было сложно:</span> «${R6.hard}»</div>
   <div class="row" style="margin-top:12px"><b style="font-size:13px">Фото</b><div class="filters" style="margin:0;padding:0">${['спереди','сбоку','сзади'].map(a=>`<button class="chip ${st.angle===a?'on':''}" data-angle="${a}" style="padding:5px 10px;font-size:12px">${a}</button>`).join('')}</div></div>
   <div class="photos"><div class="photo">${I.photo}<b>${D.fmtD(D.REPORTS[4].date)}</b>неделю назад · ${st.angle}</div><div class="photo">${I.photo}<b>${D.fmtD(R6.date)}</b>сейчас · ${st.angle}</div></div></div>
  <h2>Разбор недели</h2><div class="card"><div class="row" style="margin-bottom:8px"><b style="font-size:14px">Текст уходит Андрею</b><span class="chip dim" style="padding:4px 10px;font-size:11px">${I.check} отправлен ${D.fmtD(R6.date)}</span></div><textarea class="ta" id="razbor">${R6.review.map(([h,t])=>h+': '+t).join('\n\n')}</textarea><div class="row2"><button class="btn" id="sendR">${I.send} Отправить Андрею</button></div><div class="note">Половина разбора собрана из цифр сама, строку «Решение на неделю» пишешь ты. Уходит в Telegram и во вкладку Отчёт у клиента</div></div>`}
function prog(){const P=proposals();const S=D.strength().sort((a,b)=>b.pct-a.pct).slice(0,6);const sch=D.SCHED.filter(s=>s.phase==='12');const name=D.PH['12'].name.split(' (')[0];
  return `${hero()}
  <h2>Текущая фаза</h2><div class="card"><div class="eyebrow">Фаза 12 · неделя 3 из 4 · ${D.fmtD(sch[0].date)} - ${D.fmtD(sch[sch.length-1].date)}</div><b style="font-size:17px">${name}</b><p class="muted" style="font-size:13px;margin:6px 0 0">Пояснение клиенту: «Фокус на эксцентрической фазе: замедленное опускание»</p><div class="bar"><i style="width:62%"></i></div><div class="row2" style="margin-top:0;flex-direction:column"><a class="btn" href="trener.html">${I.download} Назначить Фазу 13</a><button class="ghost" style="flex:0 0 auto" data-toast="Демо: здесь поправишь текст пояснения к фазе">${I.pencil} Пояснение</button></div></div>
  <h2>Веса на неделю 4</h2><div class="card">${P.map(p=>`<div class="exl"><b>${p.name}</b><div class="s">нед. 3: <b>${setsStr(p.sets)}</b>${p.done?'':' <span class="red">не добран</span>'}</div><div class="s">нед. 4: <b class="${p.done?'gold':'red'}">${p.next.join(' · ')} кг</b> · ${p.why}</div></div>`).join('')||'<div class="note">На этой неделе ещё нет законченных тренировок</div>'}<div class="row2"><button class="btn" data-toast="Демо: в готовом приложении веса лягут в неделю 4 у клиента">${I.check} Принять все</button><button class="ghost" data-toast="Демо: здесь откроется правка по каждому подходу">${I.pencil} Поправить</button></div><div class="note">Считается по твоим правилам: фиксированные повторения дают лесенку на шаг выше, диапазон держит вес до верхней границы. Не добран подход: лесенка стоит, диапазон на шаг ниже</div></div>
  <h2>Сила за 7 недель</h2><div class="card">${S.map(s=>`<div class="exl"><div class="row"><b style="font-size:13px;flex:1;min-width:0">${s.name}</b><b class="${s.pct>=0?'green':'red'}" style="font-size:13px;white-space:nowrap">${sg(s.pct,0)} %</b></div><div class="s">расчётный максимум ${s.first} → <b>${s.last} кг</b> · <a class="gold" href="prog-upr.html?ex=${encodeURIComponent(s.name)}" style="text-decoration:none">история</a></div></div>`).join('')}</div>
  <h2>Последние тренировки</h2><div class="card">${doneW.slice(-5).reverse().map(w=>`<div class="exl"><div class="row"><b style="font-size:13px">${D.fmtDD(w.date)} · ${w.title}</b><span class="muted" style="font-size:12px">${w.rating}/10</span></div><div class="s">фаза ${w.phase}, неделя ${w.week} · ${w.mins} мин · ${num(w.ton)} кг</div></div>`).join('')}<div class="note">Оценка из 10 это оценка самого клиента после тренировки. Ему в списках она не показывается, тебе показывается</div></div>`}
function pit(){const days=D.DAYS.slice(-8,-1);const avg=k=>D.sum(days.map(x=>x.food[k]))/days.length;const A={kcal:avg('kcal'),p:avg('p'),f:avg('f'),c:avg('c')};
  const bar=(l,v,n,unit)=>{const dev=(v-n)/n;const bad=Math.abs(dev)>0.1;return `<div style="margin-top:10px"><div class="row"><b style="font-size:13px">${l}</b><b style="font-size:13px" class="${bad?'red':'green'}">${num(v)} ${unit} <span class="muted" style="font-weight:500">/ ${num(n)}</span></b></div><div class="minibar" style="height:7px;margin-top:5px"><i class="${bad?'red':'green'}" style="width:${Math.min(100,Math.round(v/n*100))}%"></i></div></div>`};
  return `${hero()}
  <h2>Норма</h2><div class="card"><div class="row"><div><div class="big">${num(norm.kcal)} <small>ккал</small></div><div class="chips" style="margin-top:6px"><span class="chip dim" style="padding:5px 10px;font-size:12px">Б ${norm.p}</span><span class="chip dim" style="padding:5px 10px;font-size:12px">Ж ${norm.f}</span><span class="chip dim" style="padding:5px 10px;font-size:12px">У ${norm.c}</span></div></div><button class="ghost" id="editNorm">${I.pencil} Поправить</button></div><div class="note" style="text-align:left">Утверждена ${D.fmtD(norm.from)}: ${norm.why}. Клиент видит только утверждённое</div></div>
  <h2>Факт за 7 дней</h2><div class="card" style="padding-top:6px">${bar('Калории',A.kcal,norm.kcal,'ккал')}${bar('Белок',A.p,norm.p,'г')}${bar('Жиры',A.f,norm.f,'г')}${bar('Углеводы',A.c,norm.c,'г')}<div class="note">Красное: отклонение от нормы больше 10 %. ${D.fmtD(days[0].date)} - ${D.fmtD(days[days.length-1].date)}</div></div>
  <h2>По дням</h2><div class="card">${days.slice().reverse().map(x=>{const n=D.normAt(x.date);const over=x.food.kcal>n.kcal*1.1;return `<div class="dayrow"><span class="k">${D.fmtDD(x.date)}</span><span class="m">Б ${x.food.p} · Ж ${x.food.f} · У ${x.food.c}</span><b class="${over?'red':''}">${num(x.food.kcal)}</b></div>`}).join('')}</div>
  <h2>БАДы</h2><div class="card">${D.SUPPS.map((s,i)=>{const dots=days.map(x=>x.supps[i]);const n=dots.filter(Boolean).length;return `<div class="supp"><div><b style="font-size:14px">${s.name}</b> <span>${s.dose} · ${s.when}</span></div><div style="text-align:right"><div class="dots7">${dots.map(d=>`<i class="${d?'on':''}"></i>`).join('')}</div><span>${n} из 7</span></div></div>`}).join('')}<div class="row2"><button class="ghost" data-toast="Демо: здесь выберешь БАДы из своего списка, дозу и время">${I.pencil} Изменить список</button></div></div>`}
function telo(){const ws=D.DAYS.map(x=>x.weight);const labels=[];for(let i=0;i<ws.length;i+=7)labels.push({i,t:'н'+(i/7+1)});const m0=D.MEASURES[0],mN=D.MEASURES[D.MEASURES.length-1];
  const rows=D.MEAS_FIELDS.map(([l,k])=>{const d=+(mN[k]-m0[k]).toFixed(1);const good=/biceps/.test(k)?d>=0:d<=0;return `<span class="k">${l}</span><span class="v">${f1(m0[k])} → ${f1(mN[k])}</span><span class="d ${good?'':'bad'}">${sg(d)}</span>`}).join('');
  return `${hero()}
  <h2>Вес по дням</h2><div class="chart"><div class="cap"><b>${f1(C.startWeight)} → ${f1(weightNow)} кг</b><span>${D.fmtD(C.start)} - ${D.fmtD(D.TODAY)}</span></div>${U.line([{v:ws,area:true}],labels,{h:160,yfmt:v=>f1(v)})}<div class="note">Плато на 4-5 неделе видно глазами: тогда и была срезана норма</div></div>
  <h2>Замеры, см</h2><div class="card"><div class="kv">${rows}</div><div class="note">Старт ${D.fmtD(m0.date)} → ${D.fmtD(mN.date)}. Клиент меряет раз в неделю в отчёте</div></div>
  <h2>Фото</h2><div class="card"><div class="filters" style="margin-bottom:8px">${['спереди','сбоку','сзади'].map(a=>`<button class="chip ${st.angle===a?'on':''}" data-angle="${a}">${a}</button>`).join('')}</div><div class="photos"><div class="photo">${I.photo}<b>${D.fmtD(C.start)}</b>старт · ${st.angle}</div><div class="photo">${I.photo}<b>${D.fmtD(mN.date)}</b>сейчас · ${st.angle}</div></div><div class="note">Фото приходят из отчёта недели, один свет и место. Здесь пара «старт / сейчас», в сводке пара «неделю назад / сейчас»</div></div>`}
function render(){const r=document.getElementById('root');const body={svodka,prog,pit,telo}[st.tab]();
  r.innerHTML=`<div class="hdr"><a href="klienty.html">${I.back}</a><b style="font-size:17px">${C.name}</b><button id="tg" title="Написать в Telegram">${I.tg}</button></div>${tabs()}${body}
  <div class="note" style="text-align:left;margin-top:14px">Рисунок карточки клиента в панели тренера. Андрей это демо-клиент за 7 недель, цифры считаются из тех же данных, что видит он сам. Кнопки показывают, что здесь будет делать тренер, в рисунке они отвечают подсказкой</div>`;
  r.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;D.store.set('klient:tab',st.tab);render();window.scrollTo(0,0)});
  r.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{st.angle=b.dataset.angle;render()});
  r.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>U.toast(b.dataset.toast));
  const s=document.getElementById('sendR');if(s)s.onclick=()=>U.toast('Демо: разбор уйдёт Андрею в Telegram и во вкладку Отчёт');
  document.getElementById('tg').onclick=()=>U.toast('Откроет чат с Андреем в Telegram. Чат внутри приложения не строим');
  const en=document.getElementById('editNorm');if(en)en.onclick=()=>U.openSheet(`<h3>Норма Андрея</h3><p>Правишь цифры руками, клиент увидит их после «Утвердить»</p><div class="grid2">${[['ккал',norm.kcal],['Белок, г',norm.p],['Жиры, г',norm.f],['Углеводы, г',norm.c]].map(([l,v])=>`<label style="font-size:12px;color:var(--muted)">${l}<input class="in" value="${v}" inputmode="numeric" style="margin-top:4px"></label>`).join('')}</div><label style="font-size:12px;color:var(--muted);display:block;margin-top:10px">Почему меняем (видишь только ты)<input class="in" placeholder="вес стоял две недели" style="margin-top:4px"></label><div class="row2"><button class="btn" data-close id="okNorm">${I.check} Утвердить</button><button class="ghost" data-close>Отмена</button></div>`,sh=>{sh.querySelector('#okNorm').onclick=()=>U.toast('Демо: норма ушла бы клиенту в Питание')})}
if(Q&&Q!=='Андрей')setTimeout(()=>U.toast(`У «${Q}» данных нет: карточка нарисована на демо-клиенте Андрее`),300);
render();
</script>
</body></html>
