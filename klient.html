<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1793341729"><script src="phases.js?v=1793341729"></script><script src="data.js?v=1793341729"></script><script src="ui.js?v=1793341729"></script><title>Карточка клиента</title></head><body>
<style>
.flag{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(229,83,61,.4)}
.flag.soft{border-color:rgba(246,179,67,.35)}
.flag.ok{border-color:rgba(47,191,113,.35)}
.flag .ic{width:30px;height:30px;border-radius:10px;background:rgba(229,83,61,.14);color:#E5533D;display:grid;place-items:center;flex:none}
.flag.soft .ic{background:rgba(246,179,67,.12);color:var(--acc2)}
.flag.ok .ic{background:rgba(47,191,113,.12);color:#5BE49B}
.flag .ic svg{width:16px;height:16px}
.flag .t{flex:1;min-width:0}
.flag .t b{display:block;font-size:14px;line-height:1.3}
.flag .t span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.flag .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:7px 10px;font-size:13px;align-items:baseline}
.kv .k{color:var(--muted)}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv .d{font-size:12px;font-weight:700;color:#5BE49B;text-align:right;min-width:48px;font-variant-numeric:tabular-nums}
.kv .d.bad{color:#E5533D}
.kv .d.dim{color:var(--muted);font-weight:500}
.exl{border-top:1px solid var(--line);padding:10px 0}
.exl:first-child{border-top:0;padding-top:0}
.exl b{display:block;font-size:14px}
.exl .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.exl .s b{display:inline;font-size:12px;color:var(--text)}
.red{color:#E5533D}.green{color:#5BE49B}.gold{color:var(--acc2)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.supp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.supp:first-child{border-top:0;padding-top:0}
.supp span{font-size:12px;color:var(--muted)}
.dots7{display:flex;gap:3px}
.dots7 i{width:9px;height:9px;border-radius:50%;background:var(--chip2)}
.dots7 i.on{background:var(--grad)}
.dayrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;align-items:baseline}
.dayrow:first-child{border-top:0}
.dayrow .k{color:var(--muted)}
.dayrow .m{font-size:12px;color:var(--muted)}
.ta{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:13px;line-height:1.4;padding:10px 12px;min-height:150px;resize:vertical}
.ta:focus{outline:none;border-color:var(--acc)}
.wk{display:flex;gap:12px;align-items:center}
.stat b.red{color:#E5533D}
</style>
<div class="phone"><div class="scroll" id="root"></div></div>
<script>
const D=window.DATA,U=window.UI;
const I={back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`,tg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4" /></svg>`,flag:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9" /><path d="M5 21v-7" /></svg>`,warn:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 9v4" /><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" /><path d="M12 16h.01" /></svg>`,send:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></svg>`,pencil:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /><path d="M13.5 6.5l4 4" /></svg>`,chev:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6l6 6l-6 6" /></svg>`,check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,photo:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 8h.01" /><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z" /><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5" /><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3" /></svg>`,barbell:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>`,download:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg>`,circle:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M9 12l2 2l4 -4" /></svg>`};
I.plus=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>`;
/* кардио и шаги (30.10): план задаёт тренер, форма по образцу шторки VRTO «Create cardio session». Клиент видит план в Тренировках и на Доме */
const KI={treadmill:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 3a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" /><path d="M3 14l4 1l.5 -.5" /><path d="M12 18v-3l-3 -2.923l.75 -5.077" /><path d="M6 10v-2l4 -1l2.5 2.5l2.5 .5" /><path d="M21 22a1 1 0 0 0 -1 -1h-16a1 1 0 0 0 -1 1" /><path d="M18 21l1 -11l2 -1" /></svg>`,walk:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M13 4m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M7 21l3 -4" /><path d="M16 21l-2 -4l-3 -3l1 -6" /><path d="M6 12l2 -3l4 -1l3 3l3 1" /></svg>`,bike:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M19 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M12 19l0 -4l-3 -3l5 -4l2 3l3 0" /><path d="M17 5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg>`,ellipse:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 12h4l3 8l4 -16l3 8h4" /></svg>`,stairs:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M22 6h-5v5h-5v5h-5v5h-5" /><path d="M6 10v-7" /><path d="M3 6l3 -3l3 3" /></svg>`,run:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M13 4m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M4 17l5 1l.75 -1.5" /><path d="M15 21l0 -4l-4 -3l1 -6" /><path d="M7 12l0 -3l5 -1l3 3l3 1" /></svg>`,swim:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M16 9m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M6 11l4 -2l3.5 3l-1.5 2" /><path d="M3 16.75a2.4 2.4 0 0 0 1 .25a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 1 -.25" /></svg>`};
function capPill(mins){const over=mins>D.CARDIO_CAP;return `<span class="cap-pill ${over?'over':''}">${over?'выше потолка '+D.CARDIO_CAP+' мин':'в пределах потолка '+D.CARDIO_CAP+' мин'}</span>`}
function cardioBlock(){const P=D.CARDIO,wp=D.cardioWeekPlan(P);
  return `<h2>Кардио и шаги</h2><div class="card">${P.items.map(it=>`<div class="exl" data-cedit="${it.id}" style="cursor:pointer"><div class="row"><span class="ico" style="width:32px;height:32px;border-radius:10px">${KI[it.kind]}</span><b style="font-size:14px;flex:1;min-width:0">${D.cardioTitle(it)}</b><span class="gold">${I.pencil}</span></div><div class="s">${D.daysText(it.days)} · ${D.intText(it)}</div></div>`).join('')||'<div class="note" style="text-align:left">Кардио не назначено</div>'}
  <div class="exl" data-csteps style="cursor:pointer"><div class="row"><span class="ico" style="width:32px;height:32px;border-radius:10px">${KI.walk}</span><b style="font-size:14px;flex:1">Шаги · ${num(P.steps)} в день</b><span class="gold">${I.pencil}</span></div><div class="s">каждый день · потолок ${num(D.STEPS_CAP)}</div></div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><span style="font-size:13px"><b>${D.pl(wp.n,'занятие','занятия','занятий')}</b> · ${wp.mins} мин в неделю</span>${capPill(wp.mins)}</div>
  <div class="row2"><button class="btn" data-cadd>${I.plus} Добавить кардио</button></div>
  <div class="note">План с ${D.fmtD(P.from)}. Клиент видит его в Тренировках, а в дни кардио карточкой на Доме${P.from!==C.start?' · <a href="#" data-creset style="color:var(--acc2)">вернуть демо-план</a>':''}</div></div>`}
function savePlan(P,msg){P.from=D.TODAY;D.store.set('plan:cardio',P);try{sessionStorage.setItem('flash',msg)}catch(e){}location.reload()}
function cardioEditor(id){const P=JSON.parse(JSON.stringify(D.CARDIO));const isNew=id==null;
  const it=isNew?{id:Math.max(0,...P.items.map(x=>x.id))+1,kind:'treadmill',mode:'time',min:30,km:3,int:'zone',zone:2,pct:[60,70],rpe:5,days:[]}:P.items.find(x=>x.id===id);
  const trDays=[...new Set(D.SCHED.filter(s=>D.weekOf(s.date)===D.weekOf(D.TODAY)).map(s=>D.dowM(s.date)))];
  const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
  const total=()=>{const others=P.items.filter(x=>x.id!==it.id);return {n:D.sum(others.map(x=>x.days.length))+it.days.length,mins:D.sum(others.map(x=>x.days.length*D.cardioMins(x)))+it.days.length*D.cardioMins(it)}};
  const cnt=t=>{const p=Math.min(100,t.mins/D.CARDIO_CAP*100);return `<i style="width:${p}%"></i>${t.mins?`<b style="left:${Math.max(22,p)}%">${t.mins} мин</b>`:''}`};
  const draw=()=>{const isT=it.mode==='time';const r=D.hrRange(it);const t=total();
  U.openSheet(`<h3>${isNew?'Новое кардио':'Кардио'}</h3><p>${C.name} · максимум пульса ≈ ${D.HRMAX} (220 − ${C.age} лет)</p>
  <h4>Вид</h4><div class="filters">${D.CARDIO_KINDS.map(k=>`<button class="chip ${it.kind===k.k?'on':''}" data-kind="${k.k}">${KI[k.k]} ${k.t}</button>`).join('')}</div>
  <h4>Задание</h4>${D.kindOf(it.kind).pace?U.seg([{k:'time',t:'Время'},{k:'km',t:'Дистанция'}],it.mode,'mode'):''}
  <div class="big-amt"><button data-amt="-1" aria-label="меньше">−</button><b id="amtV">${D.cardioAmount(it)}</b><button data-amt="1" aria-label="больше">+</button></div>
  <input type="range" class="rng" id="amt" min="${isT?10:1}" max="${isT?60:10}" step="${isT?5:0.5}" value="${isT?it.min:it.km}"><div class="rngl"><span>${isT?'10 мин':'1 км'}</span><span>${isT?'60 мин':'10 км'}</span></div>
  <h4>Интенсивность</h4>${U.seg([{k:'zone',t:'Зона пульса'},{k:'pct',t:'% от макс.'},{k:'rpe',t:'Ощущения'}],it.int,'int')}
  <div class="chips" style="margin-top:4px">${it.int==='zone'?D.ZONES.map((z,i)=>`<button class="chip ${it.zone===i+1?'on':''}" data-zone="${i+1}" style="min-width:40px;justify-content:center">${i+1}</button>`).join(''):it.int==='pct'?[[50,60],[60,70],[70,80],[80,90]].map(p=>`<button class="chip ${it.pct[0]===p[0]?'on':''}" data-pct="${p[0]}">${p[0]}-${p[1]} %</button>`).join(''):Array.from({length:10},(_,i)=>`<button class="chip ${it.rpe===i+1?'on':''}" data-rpe="${i+1}" style="min-width:34px;justify-content:center">${i+1}</button>`).join('')}</div>
  <div class="note" style="text-align:left">${r?'пульс '+r[0]+'-'+r[1]+' · ':''}${D.intWords(it)}</div>
  <h4>Дни</h4><div class="chips" style="margin:0 0 10px"><button class="chip ${same(it.days,[0,1,2,3,4])?'on':''}" data-quick="wd">Будни</button><button class="chip ${same(it.days,[5,6])?'on':''}" data-quick="we">Выходные</button></div>
  <div class="cdays">${D.DOW.map((dd,i)=>`<button class="${it.days.includes(i)?'on':''} ${trDays.includes(i)?'tr':''}" data-dow="${i}">${dd}</button>`).join('')}</div>
  <div class="note" style="text-align:left;margin-top:12px">точка под днём: в этот день силовая</div>
  <div class="cnt" id="cnt">${cnt(t)}</div>
  <div class="row" style="flex-wrap:wrap"><span class="muted" style="font-size:12px" id="cntT">${D.pl(t.n,'занятие','занятия','занятий')} в неделю, всё кардио</span><span id="capP">${capPill(t.mins)}</span></div>
  <div class="row2"><button class="btn" id="cSave" ${it.days.length?'':'disabled style="opacity:.45"'}>${I.check} ${isNew?'Назначить':'Сохранить'}</button>${isNew?'<button class="ghost" data-close>Отмена</button>':'<button class="ghost" id="cDel">Убрать</button>'}</div>`,sh=>{
    const on=sh.querySelector('[data-kind].on');if(on)on.parentElement.scrollLeft=Math.max(0,on.offsetLeft-on.parentElement.offsetLeft-40);
    const q=(s,f)=>sh.querySelectorAll(s).forEach(b=>b.onclick=()=>{f(b);draw()});
    q('[data-kind]',b=>{it.kind=b.dataset.kind;if(!D.kindOf(it.kind).pace)it.mode='time'});
    q('[data-mode]',b=>{it.mode=b.dataset.mode});q('[data-int]',b=>{it.int=b.dataset.int});
    q('[data-zone]',b=>{it.zone=+b.dataset.zone});q('[data-pct]',b=>{const p=+b.dataset.pct;it.pct=[p,p+10]});q('[data-rpe]',b=>{it.rpe=+b.dataset.rpe});
    q('[data-quick]',b=>{it.days=b.dataset.quick==='wd'?[0,1,2,3,4]:[5,6]});
    q('[data-dow]',b=>{const i=+b.dataset.dow;it.days=it.days.includes(i)?it.days.filter(x=>x!==i):it.days.concat(i).sort((a,b)=>a-b)});
    q('[data-amt]',b=>{const k=+b.dataset.amt;if(it.mode==='time')it.min=Math.max(10,Math.min(60,it.min+5*k));else it.km=Math.max(1,Math.min(10,it.km+0.5*k))});
    const rg=sh.querySelector('#amt');rg.oninput=()=>{if(it.mode==='time')it.min=+rg.value;else it.km=+rg.value;sh.querySelector('#amtV').textContent=D.cardioAmount(it);const t=total();sh.querySelector('#cnt').innerHTML=cnt(t);sh.querySelector('#capP').innerHTML=capPill(t.mins)};
    sh.querySelector('#cSave').onclick=()=>{if(!it.days.length)return;if(isNew)P.items.push(it);savePlan(P,`Кардио ${isNew?'назначено':'сохранено'}: ${D.cardioTitle(it)}, ${D.daysText(it.days)}`)};
    const del=sh.querySelector('#cDel');if(del)del.onclick=()=>{P.items=P.items.filter(x=>x.id!==it.id);savePlan(P,'Кардио убрано из плана')}})};
  draw()}
function stepsEditor(){const P=JSON.parse(JSON.stringify(D.CARDIO));const a7=D.sum(D.DAYS.slice(-8,-1).map(x=>x.steps))/7;
  const draw=()=>U.openSheet(`<h3>Шаги в день</h3><p>${C.name} · за 7 дней в среднем ${num(a7)}</p><div class="big-amt"><button data-st="-500" aria-label="меньше">−</button><b id="stV">${num(P.steps)}</b><button data-st="500" aria-label="больше">+</button></div><input type="range" class="rng" id="stR" min="${D.STEPS_MIN}" max="${D.STEPS_CAP}" step="500" value="${P.steps}"><div class="rngl"><span>${num(D.STEPS_MIN)}</span><span>потолок ${num(D.STEPS_CAP)}</span></div><div class="row2"><button class="btn" id="sSave">${I.check} Сохранить</button><button class="ghost" data-close>Отмена</button></div>`,sh=>{

  <h2>Замеры, см</h2><div class="card"><div class="kv">${rows}</div><div class="note">Старт ${D.fmtD(m0.date)} → ${D.fmtD(mN.date)}. Клиент меряет раз в ${D.PERIOD_WORD} в отчёте</div></div>
  <h2>Фото</h2><div class="card"><div class="filters" style="margin-bottom:8px">${['спереди','сбоку','сзади'].map(a=>`<button class="chip ${st.angle===a?'on':''}" data-angle="${a}">${a}</button>`).join('')}</div><div class="photos"><div class="photo">${I.photo}<b>${D.fmtD(C.start)}</b>старт · ${st.angle}</div><div class="photo">${I.photo}<b>${D.fmtD(mN.date)}</b>сейчас · ${st.angle}</div></div><div class="note">Фото приходят из отчёта недели, один свет и место. Здесь пара «старт / сейчас», в сводке пара «прошлый отчёт / сейчас»</div></div>`}
function render(){const r=document.getElementById('root');const body={svodka,prog,pit,telo}[st.tab]();
  r.innerHTML=`<div class="hdr"><a href="klienty.html">${I.back}</a><b style="font-size:17px">${C.name}</b><button id="tg" title="Написать в Telegram">${I.tg}</button></div>${tabs()}${body}
  <div class="note" style="text-align:left;margin-top:14px">Рисунок карточки клиента в панели тренера. Андрей это демо-клиент за 7 недель, цифры считаются из тех же данных, что видит он сам. Кнопки показывают, что здесь будет делать тренер, в рисунке они отвечают подсказкой</div>`;
  r.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;D.store.set('klient:tab',st.tab);render();window.scrollTo(0,0)});
  r.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{st.angle=b.dataset.angle;render()});
  r.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>U.toast(b.dataset.toast));
  r.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>cardioEditor(+b.dataset.cedit));
  const ca=r.querySelector('[data-cadd]');if(ca)ca.onclick=()=>cardioEditor(null);const cs=r.querySelector('[data-csteps]');if(cs)cs.onclick=stepsEditor;
  const cr=r.querySelector('[data-creset]');if(cr)cr.onclick=e=>{e.preventDefault();D.store.del('plan:cardio');try{sessionStorage.setItem('flash','Вернул демо-план кардио')}catch(x){}location.reload()};
  const s=document.getElementById('sendR');if(s)s.onclick=()=>U.toast('Демо: разбор уйдёт Андрею в Telegram и во вкладку Отчёт');
  document.getElementById('tg').onclick=()=>U.toast('Откроет чат с Андреем в Telegram. Чат внутри приложения не строим');
  const en=document.getElementById('editNorm');if(en)en.onclick=()=>U.openSheet(`<h3>Норма Андрея</h3><p>Правишь цифры руками, клиент увидит их после «Утвердить»</p><div class="grid2">${[['ккал',norm.kcal],['Белок, г',norm.p],['Жиры, г',norm.f],['Углеводы, г',norm.c]].map(([l,v])=>`<label style="font-size:12px;color:var(--muted)">${l}<input class="in" value="${v}" inputmode="numeric" style="margin-top:4px"></label>`).join('')}</div><label style="font-size:12px;color:var(--muted);display:block;margin-top:10px">Почему меняем (видишь только ты)<input class="in" placeholder="вес стоял две недели" style="margin-top:4px"></label><div class="row2"><button class="btn" data-close id="okNorm">${I.check} Утвердить</button><button class="ghost" data-close>Отмена</button></div>`,sh=>{sh.querySelector('#okNorm').onclick=()=>U.toast('Демо: норма ушла бы клиенту в Питание')})}
try{const fl=sessionStorage.getItem('flash');if(fl){sessionStorage.removeItem('flash');setTimeout(()=>U.toast(fl),300)}}catch(e){}
if(Q&&Q!=='Андрей')setTimeout(()=>U.toast(`У «${Q}» данных нет: карточка нарисована на демо-клиенте Андрее`),300);
render();
</script>
</body></html>
