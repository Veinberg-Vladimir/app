<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1793256281"><script src="phases.js?v=1793256281"></script><script src="data.js?v=1793256281"></script><script src="ui.js?v=1793256281"></script><title>Фото к блюдам: выбор</title></head><body>
<style>
.bf-head p{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.4}
.bf-dish{margin-bottom:20px}
.bf-dish h3{font-size:15px;margin:0 0 8px;line-height:1.3}
.bf-dish h3 span{color:var(--acc2);margin-right:6px}
.bf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bf-it{display:block;text-decoration:none;color:inherit}
.bf-im{position:relative;border-radius:14px;overflow:hidden;background:var(--chip);aspect-ratio:1}
.bf-im img{width:100%;height:100%;object-fit:cover;display:block}
.bf-im b{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:800;border-radius:8px;padding:3px 7px;line-height:1}
.bf-it.on .bf-im{outline:2px solid var(--acc2);outline-offset:-2px}
.bf-cap{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
.bf-cap i{font-style:normal;color:var(--acc2);font-weight:700}
</style>
<div class="phone"><div class="scroll" id="root"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)"/></linearGradient></defs></svg><nav class="nav"><a href="dom.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>Дом</a><a href="tren.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>Тренировки</a><a class="on" href="pit.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12zm0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3" /></svg>Питание</a><a href="prog.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>Прогресс</a><a href="otchet.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>Отчёт</a></nav></div>
<script>
const I={back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(d,p){const r=document.getElementById('root');
 r.innerHTML=`<a href="bluda.html" class="muted" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;margin-bottom:8px">${I.back} Блюда</a>
 <div class="bf-head"><h1 class="title" style="margin-bottom:4px">Фото к блюдам</h1><p>30 блюд, к каждому от одного до четырёх фото. С рамкой то, что стоит в карточке сейчас. Поменять: напиши номер блюда и номер фото, например «5-2». Pexels: настоящее фото со свободной лицензией. Генерация: сделано нейросетью как снимок с фотоаппарата, состав по карточке</p></div>
 ${d.map((x,i)=>{const e=p[String(i+1)]||{variants:[]};return `<div class="bf-dish"><h3><span>${i+1}.</span>${esc(x.n)}</h3><div class="bf-grid">${(e.variants||[]).map((v,k)=>`<a class="bf-it ${v.file===e.main?'on':''}" href="${v.file}" target="_blank"><div class="bf-im"><img src="${v.file}" alt="" loading="lazy"><b>${k+1}</b></div><div class="bf-cap">${v.src==='Pexels'?'Pexels':'генерация'}${v.file===e.main?' · <i>в карточке</i>':''}</div></a>`).join('')||'<div class="note" style="grid-column:1/-1;text-align:left">Фото ещё нет</div>'}</div></div>`}).join('')}
 <div class="note">Нажми на фото, откроется крупно</div>`}
Promise.all([fetch('data/dishes-sample.json').then(r=>r.json()),fetch('data/dishes-photos.json').then(r=>r.json())]).then(([d,p])=>render(d,p)).catch(()=>{document.getElementById('root').innerHTML='<div class="note">Не загрузилось, проверь интернет</div>'});
</script>
</body></html>
