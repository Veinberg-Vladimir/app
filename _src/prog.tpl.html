<title>Прогресс</title>
<style>
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;color:var(--text);text-decoration:none}.ex .t{flex:1;min-width:0}.ex .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ex .t span{font-size:12px;color:var(--muted)}.ex .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.ex .v b{display:block;font-size:15px;color:#5BE49B}.ex .v b.down{color:#E5533D}.ex .v span{font-size:11px;color:var(--muted)}
.med{width:38px;height:38px;border-radius:12px;background:var(--chip2);display:grid;place-items:center;color:var(--acc2);flex:none}.med svg{width:18px;height:18px}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(242,101,42,.22),transparent 55%),var(--card)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat b .arr{display:inline-flex;align-items:center;vertical-align:-1px;margin-right:1px;font-size:inherit;line-height:1}.stat b .arr svg{display:inline-block;width:14px;height:14px;stroke-width:2.5}.stat b .arr.good{color:#5BE49B}.stat b .arr.bad{color:#E5533D}
</style>
<div class="phone"><div class="scroll" id="root"></div>{{nav:prog}}</div>
<script>
const D=window.DATA,U=window.UI;const I={trophy:`{{trophy}}`,search:`{{search}}`,chev:`{{chevron-right}}`,play:`{{player-play-filled}}`,photo:`{{photo}}`,barbell:`{{barbell}}`,dn:`{{arrow-narrow-down}}`,up:`{{arrow-narrow-up}}`};
const arr=(v,goodWhenDown)=>{if(Math.abs(v)<0.05)return '';const down=v<0;const good=goodWhenDown?down:!down;return `<span class="arr ${good?'good':'bad'}">${down?I.dn:I.up}</span>`};
const st={tab:D.store.get('prog:tab','obshee'),per:'month',wper:'all',q:'',muscle:'Все',openG:null,compare:false};
const doneW=D.WORKOUTS.filter(w=>w.done);const wk0=D.weekOf(D.TODAY);
const rng={week:[wk0,D.TODAY],month:['2026-09-04',D.TODAY],all:['2026-08-01',D.TODAY]};
const inR=(w,r)=>w.date>=r[0]&&w.date<=r[1];
const pbSet=()=>{const best={};const pbs=[];doneW.forEach(w=>w.ex.forEach(e=>{const k=D.normKey(e.name);const mxBy={};e.sets.forEach(s=>{mxBy[s.reps]=Math.max(mxBy[s.reps]||0,s.kg)});Object.keys(mxBy).forEach(r=>{const key=k+'@'+r;if(best[key]!=null&&mxBy[r]>best[key])pbs.push({date:w.date,name:e.name,kg:mxBy[r],reps:+r});best[key]=Math.max(best[key]||0,mxBy[r])})}));return pbs};
const PBS=pbSet();
function tiles(){const r=rng[st.per];const ws=doneW.filter(w=>inR(w,r));const ton=D.sum(ws.map(w=>w.ton));const plan=D.SCHED.filter(s=>s.date>=r[0]&&s.date<=r[1]).length;const pbN=PBS.filter(p=>p.date>=r[0]&&p.date<=r[1]).length;
  return `<div class="tiles"><div class="stat"><b>${ton.toLocaleString('ru')}</b><span>кг поднято</span></div><div class="stat"><b>${ws.length}<small style="font-size:12px;color:var(--muted);font-weight:600"> из ${plan}</small></b><span>тренировок</span></div><div class="stat"><b>${pbN}</b><span>рекордов</span></div></div>`}
function tonChart(){let vals,cap;if(st.per==='week'){const mon=D.d(wk0);vals=Array.from({length:7},(_,i)=>{const dt=D.iso(D.addDays(mon,i));const w=doneW.find(x=>x.date===dt);return {v:w?w.ton:0,t:D.RU_D[(i+1)%7],hi:!!w,top:w?Math.round(w.ton/1000)+'к':''}});cap='за тренировку, эта неделя'}
  else{const weeks=[];let m=D.d('2026-08-17');while(D.iso(m)<=D.TODAY){const a=D.iso(m),b=D.iso(D.addDays(m,6));weeks.push({a,b,v:D.sum(doneW.filter(w=>w.date>=a&&w.date<=b).map(w=>w.ton))});m=D.addDays(m,7)}const sel=st.per==='month'?weeks.slice(-5):weeks;vals=sel.map((w,i)=>({v:w.v,t:'н'+(weeks.indexOf(w)+1),hi:i===sel.length-1,top:Math.round(w.v/1000)+'к'}));cap='за неделю, тысячи кг'}
  return `<div class="chart"><div class="cap"><b>Тоннаж</b><span>${cap}</span></div>${U.bars(vals,{yfmt:v=>Math.round(v/1000)+'к'})}</div>`}
function strengthBlock(){const S=D.strength();const avgPct=S.reduce((a,s)=>a+s.pct,0)/S.length;
  const weeks=[];let m=D.d('2026-08-17');while(D.iso(m)<=D.TODAY){const a=D.iso(m),b=D.iso(D.addDays(m,6));const vals=S.map(s=>{const h=s.hist.filter(x=>x.date>=a&&x.date<=b);return h.length?Math.max(...h.map(x=>x.e1))/s.first:null}).filter(Boolean);weeks.push(vals.length?(D.sum(vals)/vals.length-1)*100:null);m=D.addDays(m,7)}
  let last=0;const serie=weeks.map(v=>{if(v==null)return last;last=v;return v});
  const order=['Грудь','Спина','Дельты','Бицепс','Трицепс','Ноги','Пресс','Другое'];const groups=order.map(g=>{const items=S.filter(x=>x.muscle===g).sort((a,b)=>b.pct-a.pct);if(!items.length)return null;return {g,items,pct:+(items.reduce((a,x)=>a+x.pct,0)/items.length).toFixed(1)}}).filter(Boolean).sort((a,b)=>b.pct-a.pct);
  return `<div class="chart hero"><div class="cap"><b>Сила</b><span>расчётный максимум к первой неделе</span></div><div class="row"><div class="big" style="color:#5BE49B">+${avgPct.toFixed(1)} %<small> за 7 недель</small></div><span class="muted" style="font-size:12px">${S.length} упражнений</span></div>${U.line([{v:serie,area:true}],serie.map((_,i)=>({i,t:'н'+(i+1)})),{h:130,yfmt:v=>(v>0?'+':'')+Math.round(v)+'%',min:0})}<div class="note" style="margin-top:4px">Расчётный максимум по Эпли: вес × (1 + повторы / 30). Считается из твоих подходов</div></div>
  <h2>По группам мышц, от большего роста к меньшему</h2>${groups.map(gr=>`<div class="ex" data-g="${gr.g}" style="cursor:pointer;flex-wrap:wrap"><div class="med">${I.barbell}</div><div class="t"><b>${gr.g}</b><span>${gr.items.length} упражн.</span><div class="minibar"><i class="${gr.pct<0?'red':'green'}" style="width:${Math.min(100,Math.abs(gr.pct)*5)}%"></i></div></div><div class="v"><b class="${gr.pct<0?'down':''}">${gr.pct>0?'+':''}${gr.pct}%</b><span>сила</span></div>
   ${st.openG===gr.g?`<div style="flex-basis:100%;margin-top:10px;border-top:1px solid var(--line);padding-top:6px">${gr.items.map(x=>`<a class="item" style="background:transparent;padding:8px 0" href="prog-upr.html?ex=${encodeURIComponent(x.name)}"><div class="t"><b style="font-size:13px;font-weight:600">${x.name}</b><span>${x.first} → ${x.last} кг макс</span></div><div class="v" style="color:${x.pct<0?'#E5533D':'#5BE49B'}">${x.pct>0?'+':''}${x.pct}%</div></a>`).join('')}</div>`:''}</div>`).join('')}`}
function pbBlock(){const muscles=['Все','Грудь','Спина','Дельты','Бицепс','Трицепс','Ноги','Пресс'];const list=D.EX_ALL.map(x=>{const h=D.exHistory(x.name);if(!h.length)return null;let bs=null,bd=null;h.forEach(y=>y.sets.forEach(st2=>{if(!bs||D.e1rm(st2.kg,st2.reps)>D.e1rm(bs.kg,bs.reps)){bs=st2;bd=y.date}}));return {name:x.name,muscle:x.muscle,kg:bs.kg,reps:bs.reps,date:bd,vol:Math.max(...h.map(y=>y.vol))}}).filter(Boolean).filter(x=>(st.muscle==='Все'||x.muscle===st.muscle)&&(!st.q||x.name.toLowerCase().includes(st.q.toLowerCase())));
  return `<h2>Рекорды</h2><div class="search">${I.search}<input id="q" placeholder="Упражнение" value="${st.q}"></div><div class="filters">${muscles.map(m=>`<button class="chip ${st.muscle===m?'on':''}" data-m="${m}">${m}</button>`).join('')}</div>${list.map(x=>`<a class="ex" href="prog-upr.html?ex=${encodeURIComponent(x.name)}"><div class="med">${I.trophy}</div><div class="t"><b>${x.name}</b><span>${D.fmtD(x.date)} · объём за тренировку ${x.vol.toLocaleString('ru')} кг</span></div><div class="v"><b style="color:#fff">${x.kg} × ${x.reps}</b><span>лучший подход</span></div></a>`).join('')||'<div class="note">Ничего не найдено</div>'}<div class="note">Лучший подход сравнивается по расчётному максимуму: 80 × 12 и 90 × 8 стоят рядом, а не «кто тяжелее»</div>`}
function weekScore(a,b){const days=D.DAYS.filter(x=>x.date>=a&&x.date<=b);if(!days.length)return null;const tr=Math.min(1,doneW.filter(w=>w.date>=a&&w.date<=b).length/3);const n=D.normAt(b);const food=D.sum(days.map(x=>{const dev=Math.abs(x.food.kcal-n.kcal)/n.kcal;return dev<0.1?1:dev<0.2?0.6:0.2}))/days.length;const steps=Math.min(1,D.sum(days.map(x=>x.steps))/days.length/D.C.stepsGoal);const sleep=Math.min(1,D.sum(days.map(x=>x.sleep))/days.length/D.C.sleepGoal);return {tr,food,steps,sleep,avg:(tr+food+steps+sleep)/4}}
function generalBlock(){const a='2026-09-21',b='2026-09-27';const sc=weekScore(a,b);const V=[['Тренировки',sc.tr,'3 из 3 по плану'],['Питание',sc.food,'дней в норме калорий'],['Шаги',sc.steps,'к плану '+D.C.stepsGoal.toLocaleString('ru')],['Сон',sc.sleep,'к '+D.C.sleepGoal+' ч']];
  const bars=V.map(([l,v,t])=>`<div style="margin-top:12px"><div class="row"><b style="font-size:13px">${l}</b><b style="font-size:13px;color:${v>=0.9?'#5BE49B':v>=0.7?'var(--acc2)':'#E5533D'}">${Math.round(v*100)}%</b></div><div class="minibar" style="height:8px;margin-top:6px"><i class="${v>=0.9?'green':v>=0.7?'':'red'}" style="width:${Math.round(v*100)}%"></i></div><span class="muted" style="font-size:10px">${t}</span></div>`).join('');
  const weeks=[];let m=D.d('2026-08-17');let k=1;while(D.iso(m)<=D.TODAY){const s2=weekScore(D.iso(m),D.iso(D.addDays(m,6)));weeks.push({v:s2?Math.round(s2.avg*100):0,t:'н'+k,hi:k===6,top:s2?Math.round(s2.avg*100)+'%':''});m=D.addDays(m,7);k++}
  const last=D.REPORTS[5];
  return `<div class="chart hero"><div class="cap"><b>Успеваемость недели</b><span>21 - 27 сен, последняя полная</span></div><div style="display:flex;gap:16px;align-items:center"><div>${U.ring(sc.avg,112,Math.round(sc.avg*100)+'%','среднее')}</div><div style="flex:1;min-width:0">${bars}</div></div><div class="note" style="margin-top:10px">Считается само из логов. Среднее по четырём заданиям тренера. Текущая неделя закроется в воскресенье</div></div>
  <div class="chart"><div class="cap"><b>По неделям</b><span>средняя успеваемость, %</span></div>${U.bars(weeks,{yfmt:v=>Math.round(v)+'%'})}</div>
  <div class="card"><div class="row"><b>Итог 7 недель</b><span class="muted" style="font-size:12px">с 17 авг</span></div>${(()=>{const dW=D.DAYS[D.DAYS.length-1].weight-D.C.startWeight,dT=D.MEASURES[D.MEASURES.length-1].waist-D.MEASURES[0].waist,dS=D.strength().reduce((a,s)=>a+s.pct,0)/D.strength().length;return `<div class="stats" style="margin-bottom:0"><div class="stat"><b>${arr(dW,true)}${Math.abs(dW).toFixed(1)}</b><span>кг веса</span></div><div class="stat"><b>${arr(dT,true)}${Math.abs(dT).toFixed(0)} см</b><span>талия</span></div><div class="stat"><b>${arr(dS,false)}${Math.abs(dS).toFixed(1)}%</b><span>сила</span></div></div>`})()}</div>`}
function bodyBlock(){const days=D.DAYS;const n=st.wper==='week'?8:st.wper==='month'?31:days.length;const sel=days.slice(-n);const w=sel.map(x=>x.weight);const avg7=days.map((x,i)=>{const s=days.slice(Math.max(0,i-6),i+1);return +(D.sum(s.map(y=>y.weight))/s.length).toFixed(1)}).slice(-n);
  const cur=avg7[avg7.length-1],start=D.C.startWeight,d=+(cur-start).toFixed(1);const rate=+((avg7[avg7.length-1]-avg7[Math.max(0,avg7.length-8)])).toFixed(1);
  const lbl=sel.map((x,i)=>({i,t:D.fmtD(x.date)})).filter((_,i)=>i%Math.ceil(n/4)===0||i===n-1);
  const M=D.MEASURES;
  const ml=M.map((m,i)=>({i,t:i===0?'старт':'н'+(i+1)}));
  return `<div class="chart hero"><div class="cap"><b>Вес</b><span>среднее за 7 дней</span></div><div class="row"><div class="big">${cur.toFixed(1)} <small>кг</small></div><div style="text-align:right"><span class="delta ${d<0?'':'down'}">${d>0?'+':''}${d} кг с 17 авг</span><br><span class="muted" style="font-size:12px">${rate<0?'':'+'}${rate} кг за неделю</span></div></div>
  ${U.seg([{k:'week',t:'Неделя'},{k:'month',t:'Месяц'},{k:'all',t:'Всё'}],st.wper,'w')}${U.line([{v:w,color:'#4A4B58',width:1.5,end:false},{v:avg7,area:true}],lbl,{h:150,yfmt:v=>v.toFixed(1)})}<div class="note" style="margin-top:4px">серым утренние взвешивания, оранжевым среднее за 7 дней: вода и соль не мешают видеть тренд</div></div>
  <h2>Замеры, см</h2>
  ${[['Грудь',[['chest',null]]],['Талия',[['waist',null]]],['Бедро',[['thighR','правое'],['thighL','левое']]],['Бицепс',[['bicepsR','правый'],['bicepsL','левый']]]].map(([title,keys])=>{const series=keys.map(([k,lab],i)=>({v:M.map(mm=>mm[k]),color:i===0?undefined:'#8A8C96',dots:true,end:i===0,dash:i===1}));const first=M[0],lastM=M[M.length-1];
    return `<div class="chart"><div class="cap"><b>${title}</b><span>${keys.map(([k,lab])=>(lab?lab+' ':'')+first[k]+' → '+lastM[k]).join(' · ')}</span></div><div class="row" style="margin-bottom:4px"><div class="big">${lastM[keys[0][0]]} <small>см${keys[1]?' · '+lastM[keys[1][0]]+' см':''}</small></div><span class="delta ${(lastM[keys[0][0]]-first[keys[0][0]])<0?'':'down'}">${(lastM[keys[0][0]]-first[keys[0][0]])>0?'+':''}${(lastM[keys[0][0]]-first[keys[0][0]]).toFixed(1)} см со старта</span></div>${U.line(series,ml,{h:100,yfmt:v=>v.toFixed(0)})}${keys[1]?'<div class="note" style="margin-top:4px">оранжевым '+keys[0][1]+', серым пунктиром '+keys[1][1]+'</div>':''}</div>`}).join('')}
  <h2>Фото прогресса</h2><div class="row" style="margin-bottom:8px"><span class="muted" style="font-size:12px">спереди · каждое воскресенье</span><button class="chip ${st.compare?'on':''}" data-cmp>Сравнить старт и сейчас</button></div>
  ${st.compare?`<div class="grid2"><div class="photo" style="aspect-ratio:3/4"><b>17 авг</b>${start} кг</div><div class="photo" style="aspect-ratio:3/4"><b>27 сен</b>${D.REPORTS[5].weightNow} кг</div></div>`:`<div class="grid3">${M.map((m,i)=>`<div class="photo"><b>${D.fmtD(m.date)}</b>${i===0?start:D.REPORTS[i-1].weightNow} кг</div>`).join('')}</div>`}
  <div class="note" style="margin-top:8px">Фото клиента грузятся из отчёта: спереди, сбоку, сзади</div>`}
function render(){const r=document.getElementById('root');
  r.innerHTML=`<h1 class="title">Прогресс</h1>${U.seg([{k:'obshee',t:'Общее'},{k:'sila',t:'Сила'},{k:'telo',t:'Тело'}],st.tab,'tab')}
  ${st.tab==='obshee'?generalBlock():st.tab==='sila'?`${U.seg([{k:'week',t:'Неделя'},{k:'month',t:'Месяц'},{k:'all',t:'Всё'}],st.per,'per')}${tiles()}${tonChart()}${strengthBlock()}${pbBlock()}`:bodyBlock()}
  <div class="note">Демо-клиент, 7 недель. Все цифры из логов подходов, взвешиваний и замеров</div>`;
  r.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;D.store.set('prog:tab',st.tab);render();window.scrollTo(0,0)});
  r.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{st.per=b.dataset.per;render()});r.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{st.wper=b.dataset.w;render()});
  r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.muscle=b.dataset.m;render()});r.querySelectorAll('[data-g]').forEach(el=>el.onclick=ev=>{if(ev.target.closest('a'))return;st.openG=st.openG===el.dataset.g?null:el.dataset.g;render()});const cmp=r.querySelector('[data-cmp]');if(cmp)cmp.onclick=()=>{st.compare=!st.compare;render()};
  const q=r.querySelector('#q');if(q)q.oninput=e=>{st.q=e.target.value;render();const x=document.getElementById('q');x.focus();x.setSelectionRange(st.q.length,st.q.length)}}
render();
</script>
