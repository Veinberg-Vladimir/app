<title>Прогресс</title>
<style>
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;color:var(--text);text-decoration:none}.ex .t{flex:1;min-width:0}.ex .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ex .t span{font-size:12px;color:var(--muted)}.ex .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.ex .v b{display:block;font-size:15px;color:#5BE49B}.ex .v b.down{color:#E5533D}.ex .v span{font-size:11px;color:var(--muted)}
.med{width:38px;height:38px;border-radius:12px;background:var(--chip2);display:grid;place-items:center;color:var(--acc2);flex:none}.med svg{width:18px;height:18px}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(242,101,42,.22),transparent 55%),var(--card)}
.fat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
</style>
<div class="phone"><div class="scroll" id="root"></div>{{nav:prog}}</div>
<script>
const D=window.DATA,U=window.UI;const I={trophy:`{{trophy}}`,search:`{{search}}`,chev:`{{chevron-right}}`,play:`{{player-play-filled}}`,photo:`{{photo}}`,barbell:`{{barbell}}`};
const st={tab:D.store.get('prog:tab','sila'),per:'month',wper:'all',q:'',muscle:'Все',showAll:false,compare:false};
const doneW=D.WORKOUTS.filter(w=>w.done);const wk0=D.weekOf(D.TODAY);
const rng={week:[wk0,D.TODAY],month:['2026-09-04',D.TODAY],all:['2026-08-01',D.TODAY]};
const prevRng={week:[D.iso(D.addDays(D.d(wk0),-7)),D.iso(D.addDays(D.d(wk0),-1))],month:['2026-08-05','2026-09-03'],all:null};
const inR=(w,r)=>w.date>=r[0]&&w.date<=r[1];
const pbSet=()=>{const best={};const pbs=[];doneW.forEach(w=>w.ex.forEach(e=>{const k=D.normKey(e.name);const mx=Math.max(...e.sets.map(s=>s.kg));if(best[k]==null||mx>best[k]){if(best[k]!=null)pbs.push({date:w.date,name:e.name,kg:mx});best[k]=mx}}));return pbs};
const PBS=pbSet();
function tiles(){const r=rng[st.per];const ws=doneW.filter(w=>inR(w,r));const ton=D.sum(ws.map(w=>w.ton));const pr=prevRng[st.per];const pton=pr?D.sum(doneW.filter(w=>inR(w,pr)).map(w=>w.ton)):0;const dlt=pr&&pton?Math.round((ton/pton-1)*100):null;
  const exN=D.sum(ws.map(w=>w.ex.length)),pbN=PBS.filter(p=>p.date>=r[0]&&p.date<=r[1]).length,mins=D.sum(ws.map(w=>w.mins));
  return `<div class="tiles"><div class="stat"><b>${ton.toLocaleString('ru')}</b><span>кг поднято</span></div><div class="stat"><b>${dlt==null?'—':(dlt>=0?'+':'')+dlt+'%'}</b><span>к прошлому периоду</span></div><div class="stat"><b>${exN}</b><span>упражнений</span></div><div class="stat"><b>${pbN}</b><span>рекордов</span></div><div class="stat"><b>${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}</b><span>часов в зале</span></div><div class="stat"><b>${ws.length}</b><span>тренировок</span></div></div>`}
function tonChart(){let vals,cap;if(st.per==='week'){const mon=D.d(wk0);vals=Array.from({length:7},(_,i)=>{const dt=D.iso(D.addDays(mon,i));const w=doneW.find(x=>x.date===dt);return {v:w?w.ton:0,t:D.RU_D[(i+1)%7],hi:!!w,top:w?Math.round(w.ton/1000)+'к':''}});cap='за тренировку, эта неделя'}
  else{const weeks=[];let m=D.d('2026-08-17');while(D.iso(m)<=D.TODAY){const a=D.iso(m),b=D.iso(D.addDays(m,6));weeks.push({a,b,v:D.sum(doneW.filter(w=>w.date>=a&&w.date<=b).map(w=>w.ton))});m=D.addDays(m,7)}const sel=st.per==='month'?weeks.slice(-5):weeks;vals=sel.map((w,i)=>({v:w.v,t:'н'+(weeks.indexOf(w)+1),hi:i===sel.length-1,top:Math.round(w.v/1000)+'к'}));cap='за неделю, тысячи кг'}
  return `<div class="chart"><div class="cap"><b>Тоннаж</b><span>${cap}</span></div>${U.bars(vals,{yfmt:v=>Math.round(v/1000)+'к'})}</div>`}
function strengthBlock(){const S=D.strength();const avgPct=S.reduce((a,s)=>a+s.pct,0)/S.length;
  const weeks=[];let m=D.d('2026-08-17');while(D.iso(m)<=D.TODAY){const a=D.iso(m),b=D.iso(D.addDays(m,6));const vals=S.map(s=>{const h=s.hist.filter(x=>x.date>=a&&x.date<=b);return h.length?Math.max(...h.map(x=>x.e1))/s.first:null}).filter(Boolean);weeks.push(vals.length?(D.sum(vals)/vals.length-1)*100:null);m=D.addDays(m,7)}
  let last=0;const serie=weeks.map(v=>{if(v==null)return last;last=v;return v});
  const list=S.slice().sort((a,b)=>b.pct-a.pct);const shown=st.showAll?list:list.slice(0,6);
  return `<div class="chart hero"><div class="cap"><b>Сила</b><span>расчётный максимум к первой неделе</span></div><div class="row"><div class="big" style="color:#5BE49B">+${avgPct.toFixed(1)} %<small> за 7 недель</small></div><span class="muted" style="font-size:12px">${S.length} упражнений</span></div>${U.line([{v:serie,area:true}],serie.map((_,i)=>({i,t:'н'+(i+1)})),{h:130,yfmt:v=>(v>0?'+':'')+Math.round(v)+'%',min:0})}<div class="note" style="margin-top:4px">Формула Эпли: вес × (1 + повторы / 30). Считается из твоих подходов</div></div>
  <h2>По упражнениям</h2>${shown.map(s=>`<a class="ex" href="prog-upr.html?ex=${encodeURIComponent(s.name)}"><div class="med">${I.barbell}</div><div class="t"><b>${s.name}</b><span>${s.muscle} · ${s.first} → ${s.last} кг макс</span><div class="minibar"><i class="${s.pct<0?'red':'green'}" style="width:${Math.min(100,Math.abs(s.pct)*5)}%"></i></div></div><div class="v"><b class="${s.pct<0?'down':''}">${s.pct>0?'+':''}${s.pct}%</b><span>сила</span></div></a>`).join('')}${list.length>6?`<button class="ghost" data-more style="width:100%;margin-bottom:12px">${st.showAll?'Свернуть':'Все '+list.length+' упражнений'}</button>`:''}`}
function pbBlock(){const muscles=['Все','Грудь','Спина','Дельты','Бицепс','Трицепс','Ноги','Пресс'];const list=D.EX_ALL.map(x=>{const h=D.exHistory(x.name);if(!h.length)return null;const best=h.reduce((a,b)=>b.best>a.best?b:a);const bs=best.sets.reduce((a,b)=>b.kg>a.kg?b:a);return {name:x.name,muscle:x.muscle,kg:bs.kg,reps:bs.reps,date:best.date,vol:Math.max(...h.map(y=>y.vol))}}).filter(Boolean).filter(x=>(st.muscle==='Все'||x.muscle===st.muscle)&&(!st.q||x.name.toLowerCase().includes(st.q.toLowerCase())));
  return `<h2>Рекорды</h2><div class="search">${I.search}<input id="q" placeholder="Упражнение" value="${st.q}"></div><div class="filters">${muscles.map(m=>`<button class="chip ${st.muscle===m?'on':''}" data-m="${m}">${m}</button>`).join('')}</div>${list.map(x=>`<a class="ex" href="prog-upr.html?ex=${encodeURIComponent(x.name)}"><div class="med">${I.trophy}</div><div class="t"><b>${x.name}</b><span>${D.fmtD(x.date)} · объём за тренировку ${x.vol.toLocaleString('ru')} кг</span></div><div class="v"><b style="color:#fff">${x.kg} × ${x.reps}</b><span>рекорд</span></div></a>`).join('')||'<div class="note">Ничего не найдено</div>'}`}
function wheelBlock(){const a='2026-09-21',b='2026-09-27';const days=D.DAYS.filter(x=>x.date>=a&&x.date<=b);const tr=doneW.filter(w=>w.date>=a&&w.date<=b).length/3;const n=D.normAt(b);const food=D.sum(days.map(x=>{const dev=Math.abs(x.food.kcal-n.kcal)/n.kcal;return dev<0.1?1:dev<0.2?0.6:0.2}))/days.length;const steps=Math.min(1,D.sum(days.map(x=>x.steps))/days.length/10000);const sleep=Math.min(1,D.sum(days.map(x=>x.sleep))/days.length/7.5);
  return `<div class="chart"><div class="cap"><b>Колесо недели</b><span>21 - 27 сен, прошлая полная</span></div>${U.wheel([tr,food,steps,sleep],['Тренировки','Питание','Шаги','Сон'],230)}<div class="note" style="margin-top:4px">Считается само из логов: тренировки к плану, попадание в норму, шаги к 10 000, сон к 7,5 ч</div></div>`}
function bodyBlock(){const days=D.DAYS;const n=st.wper==='week'?8:st.wper==='month'?31:days.length;const sel=days.slice(-n);const w=sel.map(x=>x.weight);const avg7=days.map((x,i)=>{const s=days.slice(Math.max(0,i-6),i+1);return +(D.sum(s.map(y=>y.weight))/s.length).toFixed(1)}).slice(-n);
  const cur=avg7[avg7.length-1],start=D.C.startWeight,d=+(cur-start).toFixed(1);const rate=+((avg7[avg7.length-1]-avg7[Math.max(0,avg7.length-8)])).toFixed(1);
  const lbl=sel.map((x,i)=>({i,t:D.fmtD(x.date)})).filter((_,i)=>i%Math.ceil(n/4)===0||i===n-1);
  const M=D.MEASURES;const fat=M.map(m=>+D.navyFat(m.waist,m.neck,D.C.height).toFixed(1));const fatNow=fat[fat.length-1],fatKg=+(cur*fatNow/100).toFixed(1),lean=+(cur-fatKg).toFixed(1);const fat0=fat[0];
  const ml=M.map((m,i)=>({i,t:i===0?'старт':'н'+(i+1)}));
  return `<div class="chart hero"><div class="cap"><b>Вес</b><span>среднее за 7 дней</span></div><div class="row"><div class="big">${cur.toFixed(1)} <small>кг</small></div><div style="text-align:right"><span class="delta ${d<0?'':'down'}">${d>0?'+':''}${d} кг с 17 авг</span><br><span class="muted" style="font-size:12px">${rate<0?'':'+'}${rate} кг за неделю</span></div></div>
  ${U.seg([{k:'week',t:'Неделя'},{k:'month',t:'Месяц'},{k:'all',t:'Всё'}],st.wper,'w')}${U.line([{v:w,color:'#4A4B58',width:1.5,end:false},{v:avg7,area:true}],lbl,{h:150,yfmt:v=>v.toFixed(1)})}<div class="note" style="margin-top:4px">серым утренние взвешивания, оранжевым среднее за 7 дней: вода и соль не мешают видеть тренд</div></div>
  <div class="chart"><div class="cap"><b>Процент жира</b><span>оценка по талии и шее</span></div><div class="row"><div class="big">${fatNow} <small>%</small></div><span class="delta">${(fatNow-fat0).toFixed(1)} % со старта</span></div>${U.line([{v:fat,dots:true,area:true}],ml,{h:120,yfmt:v=>v.toFixed(0)+'%'})}<div class="fat">${[['жир',fatKg+' кг'],['сухая масса',lean+' кг'],['талия',M[M.length-1].waist+' см']].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('')}</div><div class="note" style="margin-top:8px">Формула ВМС США по талии, шее и росту, точность ±3 %. Тренд надёжнее числа</div></div>
  <div class="chart"><div class="cap"><b>Замеры</b><span>см, раз в неделю</span></div>${U.line([{v:M.map(m=>m.waist),dots:true}],ml,{h:110,yfmt:v=>v.toFixed(0)})}<div class="grid3" style="margin-top:8px">${[['грудь','chest'],['бёдра','hips'],['рука','arm']].map(([a,k])=>`<div class="stat"><b>${M[M.length-1][k]}</b><span>${a}, см · было ${M[0][k]}</span></div>`).join('')}</div></div>
  <h2>Фото прогресса</h2><div class="row" style="margin-bottom:8px"><span class="muted" style="font-size:12px">спереди · каждое воскресенье</span><button class="chip ${st.compare?'on':''}" data-cmp>Сравнить старт и сейчас</button></div>
  ${st.compare?`<div class="grid2"><div class="photo" style="aspect-ratio:3/4"><b>17 авг</b>${start} кг</div><div class="photo" style="aspect-ratio:3/4"><b>27 сен</b>${D.REPORTS[5].weightNow} кг</div></div>`:`<div class="grid3">${M.map((m,i)=>`<div class="photo"><b>${D.fmtD(m.date)}</b>${i===0?start:D.REPORTS[i-1].weightNow} кг</div>`).join('')}</div>`}
  <div class="note" style="margin-top:8px">Фото клиента грузятся из отчёта: спереди, сбоку, сзади</div>`}
function render(){const r=document.getElementById('root');
  r.innerHTML=`<h1 class="title">Прогресс</h1>${U.seg([{k:'sila',t:'Сила'},{k:'telo',t:'Тело'}],st.tab,'tab')}
  ${st.tab==='sila'?`${wheelBlock()}${U.seg([{k:'week',t:'Неделя'},{k:'month',t:'Месяц'},{k:'all',t:'Всё'}],st.per,'per')}${tiles()}${tonChart()}${strengthBlock()}${pbBlock()}`:bodyBlock()}
  <div class="note">Демо-клиент, 7 недель. Все цифры из логов подходов, взвешиваний и замеров</div>`;
  r.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;D.store.set('prog:tab',st.tab);render();window.scrollTo(0,0)});
  r.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{st.per=b.dataset.per;render()});r.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{st.wper=b.dataset.w;render()});
  r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.muscle=b.dataset.m;render()});const more=r.querySelector('[data-more]');if(more)more.onclick=()=>{st.showAll=!st.showAll;render()};const cmp=r.querySelector('[data-cmp]');if(cmp)cmp.onclick=()=>{st.compare=!st.compare;render()};
  const q=r.querySelector('#q');if(q)q.oninput=e=>{st.q=e.target.value;render();const x=document.getElementById('q');x.focus();x.setSelectionRange(st.q.length,st.q.length)}}
render();
</script>
