<title>Питание</title>
<style>
.normc{display:flex;align-items:center;gap:14px}.normc .t{flex:1;min-width:0}.normc .t b{display:block;font-size:17px;font-weight:800}.normc .t span{font-size:12px;color:var(--muted);display:block}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mac div{background:var(--chip);border-radius:14px;padding:10px 8px 8px;text-align:center}.mac b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.mac span{font-size:11px;color:var(--muted)}
.meal{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}.meal .t{flex:1;min-width:0}.meal .t b{display:block;font-size:14px}.meal .t span{font-size:12px;color:var(--muted)}.meal .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.prod{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.prod .t{flex:1}.prod .t b{display:block;font-size:14px}.prod .t span{font-size:11px;color:var(--muted)}.prod .v{font-weight:800;font-size:13px;white-space:nowrap}
.res{background:var(--chip);border-radius:16px;padding:12px;margin:10px 0}.res b{display:block;font-size:15px}.res span{font-size:12px;color:var(--muted)}
.port{display:flex;gap:6px;margin:10px 0}.port .chip{flex:1;justify-content:center}
.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.avg div{background:var(--chip);border-radius:14px;padding:10px 8px;text-align:center}.avg b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.avg span{font-size:11px;color:var(--muted)}
.help{display:inline-flex;align-items:center;gap:4px;color:var(--acc2);font-size:12px;font-weight:700;cursor:pointer}.help svg{width:14px;height:14px}
.fthumb{width:44px;height:44px;border-radius:12px;background:#262633 center/cover no-repeat;flex:none}
.meal .t b.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* фото еды: сканер и результат по образцу Cal AI, картинки гайда 21.10 */
.fs{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:420px;z-index:35;background:#0B0C14;color:#fff;overflow:hidden;display:none;--fsz:min(80vw,340px,calc(100vh - 340px))}
@supports (height:100dvh){.fs{--fsz:min(80vw,340px,calc(100dvh - 340px))}}
.fs.show{display:block}
:where(.fs button){font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.fs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0B0C14}
.fs-glass{background:rgba(14,15,26,.58);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)!important}
.fs-shT{position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0));pointer-events:none}
.fs-shB{position:absolute;left:0;right:0;bottom:0;height:360px;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0));pointer-events:none}
.fs-ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px calc(env(safe-area-inset-bottom,0px) + 16px)}
.fs-top{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.fs-top b{font-size:17px;font-weight:800}
.fs-rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.fs-rb svg{width:22px;height:22px;stroke-width:2.2}
.fs-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.fs-frame{position:relative;width:var(--fsz);height:var(--fsz);transition:width .25s,height .25s;display:grid;place-items:center;color:rgba(255,255,255,.35)}
.fs-frame.bar{height:calc(var(--fsz)*.56)}
.fs-frame.lab{width:calc(var(--fsz)*.78)}
.fs-frame>i{position:absolute;width:56px;height:56px;border:0 solid #F2652A}
.fs-frame>i:nth-child(1){left:0;top:0;border-width:5.5px 0 0 5.5px;border-radius:24px 0 0 0}
.fs-frame>i:nth-child(2){right:0;top:0;border-width:5.5px 5.5px 0 0;border-radius:0 24px 0 0;border-color:#F48A38}
.fs-frame>i:nth-child(3){left:0;bottom:0;border-width:0 0 5.5px 5.5px;border-radius:0 0 0 24px;border-color:#F48A38}
.fs-frame>i:nth-child(4){right:0;bottom:0;border-width:0 5.5px 5.5px 0;border-radius:0 0 24px 0;border-color:#F6B343}
.fs-frame>svg{width:44px;height:44px;display:none}
.fs.nocam .fs-frame>svg{display:block}
.fs-frame .fs-line{position:absolute;left:12px;right:12px;top:50%;height:2px;border-radius:2px;background:var(--grad);box-shadow:0 0 12px #F6B343;display:none;animation:fsl 1.6s ease-in-out infinite alternate}
.fs-frame.bar .fs-line{display:block}
@keyframes fsl{from{transform:translateY(calc(var(--fsz)*-.2))}to{transform:translateY(calc(var(--fsz)*.2))}}
.fs-hint{border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:#fff;text-align:center;max-width:320px}
.fs.nocam .fs-hint{border-radius:16px;line-height:1.4}
.fs-modes{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fs-mode{height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px!important;font-weight:700!important;color:rgba(255,255,255,.88)!important}
.fs-mode svg{width:22px;height:22px;stroke-width:2}
.fs-mode.on{background:var(--grad)!important;color:#14110E!important;border:0!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.fs-ctrl{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px}
.fs-side{justify-self:center;width:64px;text-align:center;font-size:11px!important;font-weight:700!important}
.fs-side .c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px}
.fs-side svg{width:24px;height:24px;stroke-width:2}
.fs-shut{width:82px;height:82px;border-radius:50%;border:4px solid #fff!important;display:grid;place-items:center;transition:transform .12s}
.fs-shut i{display:block;width:66px;height:66px;border-radius:50%;background:#fff}
.fs-shut:active{transform:scale(.92)}
.fs-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.fs-flash.on{opacity:.75;transition:none}
.fr-ph{position:absolute;left:0;right:0;top:0;height:min(42vh,400px);background:#1b1c26 center/cover no-repeat}
.fr-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 130px)}
.fr-ph .fr-scan{position:absolute;left:0;right:0;top:0;height:70px;background:linear-gradient(180deg,rgba(246,179,67,0),rgba(246,179,67,.35));border-bottom:2px solid #F6B343;display:none;animation:frs 1.8s linear infinite}
.fs.busy .fr-scan{display:block}
@keyframes frs{from{transform:translateY(-70px)}to{transform:translateY(min(42vh,400px))}}
.fr-back{position:absolute;left:18px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3}
.fr-sheet{position:absolute;left:0;right:0;bottom:0;top:calc(min(42vh,400px) - 28px);background:#171826;border-radius:28px 28px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.45);overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 104px);z-index:2}
.fr-sheet .grab{width:40px;height:4px;border-radius:9px;background:#3a3b4a;margin:0 auto 10px}
.fr-r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fr-meal{display:inline-flex;align-items:center;gap:6px;background:var(--chip)!important;border-radius:999px;padding:6px 10px 6px 9px!important;font-size:13px!important;font-weight:700!important}
.fr-meal svg{width:16px;height:16px;color:var(--acc2)}
.fr-meal svg:last-child{width:14px;height:14px;color:var(--muted)}
.fr-step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:34px}
.fr-step button{width:34px;height:31px;display:grid;place-items:center}
.fr-step button svg{width:16px;height:16px;stroke-width:2.4}
.fr-step b{min-width:26px;text-align:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.fr-dish{margin:10px 0 0;font-size:20px;font-weight:800;line-height:1.25}
.fr-kc{display:flex;align-items:center;gap:14px;background:var(--chip);border-radius:20px;padding:10px 14px;margin-top:12px}
.fr-kc .fi{width:48px;height:48px;border-radius:15px;background:var(--grad);display:grid;place-items:center;color:#14110E;flex:none}
.fr-kc .fi svg{width:26px;height:26px}
.fr-kc .t{flex:1;min-width:0}
.fr-kc .t span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fr-kc .t b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.fr-kc .t b small{font-size:15px;color:var(--muted);font-weight:700;margin-left:4px}
.fr-ring{position:relative;width:58px;height:58px;margin:0 auto}
.fr-ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.fr-ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.fr-kc .of{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;font-weight:600;white-space:nowrap}
.fr-mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.fr-mt .m{background:var(--chip);border-radius:16px;padding:9px 10px;min-width:0}
.fr-mt .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.fr-mt .h i{width:22px;height:22px;border-radius:7px;background:rgba(246,179,67,.15);display:grid;place-items:center;color:var(--acc2);flex:none}
.fr-mt .h svg{width:14px;height:14px;stroke-width:2.2}
.fr-mt b{display:block;font-size:19px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr-mt b small{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px}
.fr-mt .bar{height:5px;border-radius:99px;background:#33344a;margin:7px 0 0;overflow:hidden}
.fr-sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.fr-sec b{font-size:16px;font-weight:800}
.fr-sec button{font-size:13px!important;font-weight:700!important;color:var(--acc2)!important;display:inline-flex;align-items:center;gap:4px}
.fr-sec button svg{width:15px;height:15px;stroke-width:2.4}
.fr-ing{display:flex!important;align-items:center;gap:10px;width:100%;text-align:left;background:var(--chip)!important;border-radius:16px;padding:8px 10px 8px 14px!important;margin-bottom:8px}
.fr-ing .t{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.3}
.fr-ing .t span{color:var(--muted);font-weight:600;white-space:nowrap}
.fr-ing .g{flex:none;background:var(--chip2);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.fr-bot{position:absolute;left:0;right:0;bottom:0;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:linear-gradient(180deg,rgba(23,24,38,0),#171826 22px);z-index:4;display:flex;gap:10px}
.fr-bot .ghost,.fr-bot .btn{flex:1;font-size:15px;padding:13px 14px}
.fr-bot .ghost svg,.fr-bot .btn svg{width:18px;height:18px}
.fr-bot button:disabled{opacity:.45}
.fr-busy{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin:4px 0 14px}
.fr-busy em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.fr-sp{width:20px;height:20px;border-radius:50%;border:2.5px solid #33344a;border-top-color:#F6B343;animation:frsp .8s linear infinite;flex:none}
@keyframes frsp{to{transform:rotate(360deg)}}
.fr-sk{height:18px;border-radius:9px;background:linear-gradient(90deg,#262633 0,#30313F 50%,#262633 100%);background-size:200% 100%;animation:frsk 1.2s linear infinite;margin-bottom:10px}
@keyframes frsk{from{background-position:100% 0}to{background-position:-100% 0}}
.fr-fail{background:var(--chip);border-radius:16px;padding:14px;margin:6px 0 4px}
.fr-fail b{display:block;font-size:16px;margin-bottom:4px}
.fr-fail span{font-size:13px;color:var(--muted)}
textarea.fx{width:100%;min-height:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:16px;padding:10px 12px;resize:none}
textarea.fx:focus{outline:none;border-color:var(--acc)}
</style>
<div class="phone"><div class="scroll" id="root"></div>{{nav:pit}}</div>
<script>
const D=window.DATA,U=window.UI;const I={plus:`{{plus}}`,cam:`{{camera-plus}}`,search:`{{search}}`,help:`{{help}}`,check:`{{check}}`,x:`{{x}}`,play:`{{player-play-filled}}`,chev:`{{chevron-right}}`,camera:`{{camera}}`,dish:`{{tools-kitchen-2}}`,barcode:`{{barcode}}`,label:`{{file-text}}`,photo:`{{photo}}`,q:`{{question-mark}}`,back:`{{arrow-left}}`,clock:`{{clock}}`,down:`{{chevron-down}}`,minus:`{{minus}}`,flame:`{{flame-filled}}`,meat:`{{meat}}`,drop:`{{droplet}}`,wheat:`{{wheat}}`,spark:`{{sparkles}}`};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRODUCTS=[['Куриная грудка',165,31,3.6,0],['Гречка варёная',110,4,1,21],['Рис варёный',130,2.7,0.3,28],['Творог 5%',121,17,5,3],['Яйцо куриное',157,13,11,1],['Овсянка сухая',370,13,7,62],['Банан',89,1.1,0.3,23],['Говядина тушёная',250,26,15,0],['Лосось',208,20,13,0],['Картофель варёный',77,2,0.1,17],['Хлеб цельнозерновой',250,9,3,45],['Масло оливковое',884,0,100,0],['Протеин сывороточный',400,80,5,10],['Йогурт греческий 2%',73,10,2,4],['Яблоко',52,0.3,0.2,14],['Орехи грецкие',654,15,65,14]].map(p=>({n:p[0],kcal:p[1],p:p[2],f:p[3],c:p[4]}));
const today=D.DAYS[D.DAYS.length-1],norm=D.normAt(D.TODAY);let added=D.store.get('food:'+D.TODAY,[]);
let tab=D.store.get('pit:tab','dnevnik');
const MENU=[['Завтрак',[['Овсянка на воде с ягодами и яйцом',420,22,12,55,'Овсянка 70 г, яйцо, ягоды 100 г'],['Омлет из трёх яиц с овощами',380,26,26,8,'3 яйца, помидор, шпинат, 5 г масла'],['Творог 5 % с бананом',350,30,9,35,'Творог 200 г, банан']]],['Обед',[['Гречка с куриной грудкой и овощами',560,48,10,62,'Гречка 100 г сухой, грудка 180 г, овощи 150 г'],['Рис с индейкой и салатом',580,45,12,70,'Рис 90 г сухой, индейка 180 г, салат с маслом 5 г'],['Картофель с говядиной',620,42,20,65,'Картофель 300 г, говядина 150 г, огурец']]],['Ужин',[['Лосось с брокколи',520,38,30,15,'Лосось 180 г, брокколи 250 г'],['Куриные бёдра без кожи с овощами',480,40,22,20,'Бёдра 200 г, овощи гриль 250 г'],['Творожная запеканка',400,35,10,30,'Творог 250 г, яйцо, рисовая мука 30 г']]],['Перекус',[['Греческий йогурт с орехами',260,16,14,15,'Йогурт 2 % 200 г, грецкие 15 г'],['Протеиновый коктейль',150,26,2,5,'Протеин 30 г, вода'],['Яблоко и миндаль',230,7,15,20,'Яблоко, миндаль 30 г']]]];
const totals=()=>({kcal:today.food.kcal+D.sum(added.map(a=>a.kcal)),p:today.food.p+D.sum(added.map(a=>a.p)),f:today.food.f+D.sum(added.map(a=>a.f)),c:today.food.c+D.sum(added.map(a=>a.c))});
const last7=D.DAYS.slice(-8,-1);const avg=k=>Math.round(D.sum(last7.map(x=>x.food[k]))/last7.length);
function render(){const r=document.getElementById('root');const t=totals();const left=norm.kcal-t.kcal;
if(tab==='menu'){renderMenu(r,t);return}
r.innerHTML=`<h1 class="title">Питание</h1>${U.seg([{k:'dnevnik',t:'Дневник'},{k:'menu',t:'Меню'}],tab,'ptab')}
<div class="card"><div class="normc">${U.ring(Math.min(1,t.kcal/norm.kcal),96,t.kcal.toLocaleString('ru'),'из '+norm.kcal.toLocaleString('ru'))}<div class="t"><b>${left>0?'Осталось '+left.toLocaleString('ru')+' ккал':'Норма выполнена'}</b><span>Норма от тренера с ${D.fmtD(norm.from)}</span><span class="help" data-norm>${I.help} откуда цифры</span></div></div>
<div class="mac">${[['Белки',t.p,norm.p],['Жиры',t.f,norm.f],['Углеводы',t.c,norm.c]].map(([n,v,m])=>`<div><b>${v} <span>/ ${m}</span></b><span>${n}, г</span><div class="minibar"><i class="${v>m*1.1?'red':''}" style="width:${Math.min(100,v/m*100)}%"></i></div></div>`).join('')}</div>
<div class="row2"><button class="btn" id="addBtn">${I.plus} Добавить еду</button><button class="ghost" id="photoBtn">${I.cam} Фото блюда</button></div></div>
<div class="card" style="margin-top:-2px"><div class="row"><b>Добавки от тренера</b><span class="muted" style="font-size:12px">на этой фазе</span></div>${D.SUPPS.map(x=>`<div class="meal" style="background:var(--chip);margin:8px 0 0;padding:10px 12px"><div class="t"><b>${x.name}</b><span>${x.when}</span></div><div class="v" style="font-size:13px">${x.dose}</div></div>`).join('')}</div>
<h2>Сегодня</h2>
${today.food.meals.map(m=>`<div class="meal"><div class="t"><b>${m.name}</b><span>${m.items}</span></div><div class="v">${m.kcal} ккал</div></div>`).join('')}
${added.map((a,i)=>`<div class="meal">${a.thumb?`<div class="fthumb" style="background-image:url('${esc(a.thumb)}')"></div>`:''}<div class="t"><b class="clamp2">${a.meal?dishHtml(a.n):esc(a.n)}</b>${a.photo||a.bar||a.lab?`<span class="badge grey" style="margin:3px 6px 2px 0">${a.photo?'по фото · примерно':a.bar?'штрих-код':'этикетка'}</span>`:''}<span>${a.meal?esc(a.meal)+(a.time?' '+a.time:'')+' · ':''}${a.menu?'из меню':a.g+' г'} · Б ${a.p} Ж ${a.f} У ${a.c}</span></div><div class="v">${a.kcal} ккал</div><button class="chip" data-del="${i}" style="padding:6px">${I.x}</button></div>`).join('')}
<h2>Неделя</h2>
<div class="chart"><div class="cap"><b>Калории по дням</b><span>норма ${norm.kcal.toLocaleString('ru')}</span></div>${U.bars(last7.map(x=>({v:x.food.kcal,t:D.RU_D[D.d(x.date).getDay()],hi:x.food.kcal>norm.kcal*1.1})))}<div class="note" style="margin-top:4px">оранжевым дни выше нормы на 10 % и больше</div></div>
<div class="card"><div class="row"><b>Среднее за 7 дней</b><span class="muted" style="font-size:12px">в отчёт идёт само</span></div><div class="avg" style="margin-top:10px">${[['Белки',avg('p'),norm.p],['Жиры',avg('f'),norm.f],['Углеводы',avg('c'),norm.c]].map(([n,v,m])=>`<div><b>${v}</b><span>${n} · норма ${m}</span><div class="minibar"><i class="${v<m*0.9?'red':v>m*1.1?'red':'green'}" style="width:${Math.min(100,v/m*100)}%"></i></div></div>`).join('')}</div>
<div class="note" style="margin-top:8px">Средние калории ${avg('kcal').toLocaleString('ru')} · норма ${norm.kcal.toLocaleString('ru')}</div></div>

function shrink(file,max){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};img.onerror=rej;img.src=u})}
function thumbOf(url){return new Promise(res=>{const img=new Image();img.onload=()=>{const S=120,k=S/Math.min(img.width,img.height),w=img.width*k,h=img.height*k;const c=document.createElement('canvas');c.width=c.height=S;c.getContext('2d').drawImage(img,(S-w)/2,(S-h)/2,w,h);res(c.toDataURL('image/jpeg',0.7))};img.onerror=()=>res('');img.src=url})}

/* кадр из камеры по рамке плюс 15 % запаса с каждой стороны: тарелка крупнее и на фото, и для распознавания */
function fsGrab(max){const v=$('fsVid'),W=v.videoWidth,H=v.videoHeight;if(!W||!H)return null;const e=v.getBoundingClientRect(),f=$('fsFrame').getBoundingClientRect(),s=Math.max(e.width/W,e.height/H),ox=(e.width-W*s)/2,oy=(e.height-H*s)/2;
 let sw=f.width/s,sh=f.height/s,sx=(f.left-e.left-ox)/s-sw*.15,sy=(f.top-e.top-oy)/s-sh*.15;sw*=1.3;sh*=1.3;sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(W-sx,sw);sh=Math.min(H-sy,sh);if(sw<50||sh<50){sx=0;sy=0;sw=W;sh=H}
 const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);return c}

function fsBarLoop(){clearInterval(FS.timer);FS.timer=setInterval(async()=>{if(FS.dec||FS.busy||!FS.live||FS.mode!=='bar')return;const c=fsGrab(960);if(!c)return;FS.dec=true;const code=await decodeBar(c);FS.dec=false;if(code&&code===FS.lastCode&&Date.now()-FS.lastAt<3000)return;if(code&&FS.live&&FS.mode==='bar'&&!FS.busy){if(navigator.vibrate)navigator.vibrate(40);onCode(code,c.toDataURL('image/jpeg',0.8))}},350)}

async function decodeBar(c){
 if('BarcodeDetector' in window&&!FS.noBD){try{FS.bd=FS.bd||new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});const r=await FS.bd.detect(c);return r&&r.length?r[0].rawValue:null}catch(e){FS.noBD=true}}

 const n=(p&&p.nutriments)||{};const kcal=p?(+n['energy-kcal_100g']||Math.round((+n['energy_100g']||0)/4.184)):0;
 if(!p||!kcal){fsFail(err?'Открытая база продуктов не ответила. Попробуй ещё раз или сними этикетку':'Код '+code+' не нашёлся в открытой базе. Сними этикетку, приложение прочитает цифры с неё',true);return}
 const name=(p.product_name_ru||p.product_name||'Продукт').trim(),brand=(p.brands||'').split(',')[0].trim();let g=+p.product_quantity||0;if(!(g>0&&g<=500))g=100;
 R.dish=brand&&!name.toLowerCase().includes(brand.toLowerCase())?name+', '+brand:name;
 R.comps=[{n:name,g,kcal:Math.round(kcal),p:+(+n['proteins_100g']||0).toFixed(1),f:+(+n['fat_100g']||0).toFixed(1),c:+(+n['carbohydrates_100g']||0).toFixed(1)}];
 if(p.image_front_url){const r0=R,im=new Image();im.onload=()=>{if(R===r0)$('frPh').style.backgroundImage=`url('${esc(p.image_front_url)}')`};im.src=p.image_front_url;R.thumb=p.image_front_small_url||p.image_front_url}
 $('fsRes').classList.remove('busy');fsDraw()}
async function recognize(url,mode,fix){const tok=fix?FS.tok:fsResult({kind:mode,img:url});FS.busy=true;
 fsBusy(fix?'Пересчитываю по твоим словам':mode==='lab'?'Читаю этикетку':'Распознаю блюдо');
 const body={code:foodCode(),client:(D.C&&D.C.name)||'client',image:url,mode:mode==='lab'?'label':'dish'};
 if(fix){body.fix=fix;body.prev={dish:R.dish,components:R.comps.map(c=>({name:c.n,grams:Math.round(c.g),kcal100:c.kcal,p100:c.p,f100:c.f,c100:c.c}))}}
 let r=null,j={};try{r=await fetch(FOOD_AI_URL+'/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});j=await r.json().catch(()=>({}))}catch(e){r=null}
 if(tok!==FS.tok)return;FS.busy=false;
 if(r&&r.status===403){D.store.set('access:code','');fsFail('Кодовое слово не подошло, его даёт тренер');askCode(()=>{if(fix)fsDraw();recognize(url,mode,fix)});return}
 if(r&&r.ok&&j.components&&(fix||mode==='lab')&&j.api!==2){const msg=fix?'Исправление словами включится после обновления сервера. Пока поправь граммы нажатием на цифру':'Чтение этикетки включится после обновления сервера. Пока сними штрих-код или впиши руками';if(fix){U.toast(msg);$('fsRes').classList.remove('busy');fsDraw()}else fsFail(msg);return}
 if(!r||!r.ok||!j.components){const msg=!r?'Нет связи с распознаванием. Проверь интернет и попробуй ещё раз':(j.message||'Распознавание недоступно');if(fix){U.toast(msg);$('fsRes').classList.remove('busy');fsDraw()}else fsFail(msg);return}
 R.dish=j.dish;R.comps=j.components.map(c=>({n:c.name,g:c.grams,kcal:c.kcal100,p:c.p100,f:c.f100,c:c.c100}));R.note=j.note||'';$('fsRes').classList.remove('busy');fsDraw();if(fix)U.toast('Пересчитал по твоим словам')}
function frTot(){return R.comps.reduce((a,c)=>{const k=c.g*R.q/100;a.kcal+=c.kcal*k;a.p+=c.p*k;a.f+=c.f*k;a.c+=c.c*k;a.g+=c.g*R.q;return a},{kcal:0,p:0,f:0,c:0,g:0})}
function fsDraw(){const t=frTot(),kc=Math.round(t.kcal),C=150.8;
 const tile=(n,ic,v,m)=>`<div class="m"><div class="h"><i>${ic}</i>${n}</div><b>${Math.round(v)}<small> / ${m} г</small></b><div class="bar"><i style="width:${Math.min(100,v/m*100).toFixed(0)}%"></i></div></div>`;
 $('frBody').innerHTML=`<div class="fr-r1"><button class="fr-meal" id="frMeal">${I.clock}${esc(R.meal)} · ${R.time}${I.down}</button><div class="fr-step"><button data-st="-1" aria-label="Меньше">${I.minus}</button><b>${String(R.q).replace('.',',')}</b><button data-st="1" aria-label="Больше">${I.plus}</button></div></div>
 <h3 class="fr-dish">${dishHtml(R.dish)}</h3>
 <div class="fr-kc"><div class="fi">${I.flame}</div><div class="t"><span>Калории</span><b>${kc.toLocaleString('ru')}<small>ккал</small></b></div><div><div class="fr-ring"><svg viewBox="0 0 58 58"><defs><linearGradient id="frg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2652A"/><stop offset="1" stop-color="#F6B343"/></linearGradient></defs><circle cx="29" cy="29" r="24" fill="none" stroke="#33344a" stroke-width="6"/>${kc>0?`<circle cx="29" cy="29" r="24" fill="none" stroke="url(#frg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(Math.min(1,kc/norm.kcal)*C).toFixed(2)} 999"/>`:''}</svg><div>${Math.round(kc/norm.kcal*100)}%</div></div><div class="of">нормы дня</div></div></div>
 <div class="fr-mt">${tile('Белки',I.meat,t.p,norm.p)}${tile('Жиры',I.drop,t.f,norm.f)}${tile('Углеводы',I.wheat,t.c,norm.c)}</div>
 <div class="fr-sec"><b>Состав</b><button id="frAddPart">${I.plus}Добавить часть</button></div>
 ${R.comps.map((c,i)=>`<button class="fr-ing" data-ing="${i}"><div class="t">${esc(c.n)} <span>· ${Math.round(c.kcal*c.g*R.q/100)} ккал</span></div><div class="g">${Math.round(c.g*R.q)} г</div></button>`).join('')}
 <div class="note" style="margin-top:6px">${!R.comps.length?'Состав пуст: добавь часть или переснимай':R.kind==='bar'?'КБЖУ из открытой базы по штрих-коду. Поставь свои граммы: нажми на цифру':R.kind==='lab'?'КБЖУ с этикетки. Поставь свои граммы: нажми на цифру':'Граммы по фото примерные. Нажми на цифру, чтобы поставить свои'}</div>`;
 $('frBot').innerHTML=(R.kind==='bar'?`<button class="ghost" id="frFix">${I.barcode} Другой код</button>`:`<button class="ghost" id="frFix">${I.spark} Исправить</button>`)+`<button class="btn" id="frAdd"${R.comps.length?'':' disabled'}>Добавить</button>`;
 $('frMeal').onclick=fsMealSheet;$('frAddPart').onclick=()=>sheetAdd(p=>gramsSheet({n:p.n,g:100,kcal:p.kcal,p:p.p,f:p.f,c:p.c},-1));
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{R.q=Math.max(0.5,Math.min(10,R.q+(+b.dataset.st)*0.5));fsDraw()});
 document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>gramsSheet(R.comps[+b.dataset.ing],+b.dataset.ing));
 $('frFix').onclick=R.kind==='bar'?fsRetake:fixSheet;$('frAdd').onclick=fsAdd}
function gramsSheet(c,idx){let g=Math.round(c.g*R.q)||100;const draw=()=>{const k=g/100;const s=U.openSheet(`<h3>${esc(c.n)}</h3><p>на 100 г: ${c.kcal} ккал · Б ${String(c.p).replace('.',',')} Ж ${String(c.f).replace('.',',')} У ${String(c.c).replace('.',',')}</p><div class="port">${[50,100,150,200,300].map(x=>`<button class="chip ${x===g?'on':''}" data-g="${x}">${x} г</button>`).join('')}</div><input class="in" id="gIn" inputmode="numeric" value="${g}" style="font-size:16px"><div class="res"><b>${Math.round(c.kcal*k)} ккал</b><span>Б ${Math.round(c.p*k)} · Ж ${Math.round(c.f*k)} · У ${Math.round(c.c*k)}</span></div><div class="row2">${idx>=0?'<button class="ghost" id="gDel">Убрать из состава</button>':'<button class="ghost" data-close>Отмена</button>'}<button class="btn" id="gOk">${idx>=0?'Готово':'Добавить'}</button></div>`);
  s.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=+b.dataset.g;draw()});
  s.querySelector('#gIn').oninput=e=>{g=Math.max(0,parseInt(e.target.value,10)||0);s.querySelector('.res b').textContent=Math.round(c.kcal*g/100)+' ккал';s.querySelector('.res span').textContent=`Б ${Math.round(c.p*g/100)} · Ж ${Math.round(c.f*g/100)} · У ${Math.round(c.c*g/100)}`};
  if(idx>=0)s.querySelector('#gDel').onclick=()=>{R.comps.splice(idx,1);U.closeSheet();fsDraw()};
  s.querySelector('#gOk').onclick=()=>{if(!g){U.toast('Впиши граммы');return}if(idx>=0)R.comps[idx].g=g/R.q;else R.comps.push(Object.assign({},c,{g:g/R.q}));U.closeSheet();fsDraw()}};draw()}
function fixSheet(){const s=U.openSheet(`<h3>Что исправить?</h3><p>Напиши словами, приложение пересчитает. Граммы одной части проще поправить нажатием на цифру</p><textarea class="fx" id="fxT" placeholder="Например: это индейка, а не курица. Картошки около 250 г. Салат без масла"></textarea><div class="row2"><button class="ghost" data-close>Отмена</button><button class="btn" id="fxGo">${I.spark} Пересчитать</button></div>`);
 const ta=s.querySelector('#fxT');setTimeout(()=>ta.focus(),260);
 s.querySelector('#fxGo').onclick=()=>{const v=ta.value.trim();if(!v){ta.focus();return}R.comps.forEach(c=>c.g=c.g*R.q);R.q=1;U.closeSheet();recognize(R.img,R.kind,v)}}
function fsMealSheet(){const s=U.openSheet(`<h3>Приём пищи</h3>${['Завтрак','Обед','Ужин','Перекус'].map(m=>`<div class="opt ${m===R.meal?'sel':''}" data-m="${m}"><div class="t"><b>${m}</b></div>${m===R.meal?I.check:''}</div>`).join('')}`);s.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{R.meal=b.dataset.m;U.closeSheet();fsDraw()})}
function fsAdd(){const t=frTot(),flag=R.kind==='bar'?{bar:true}:R.kind==='lab'?{lab:true}:{photo:true};
 added.push(Object.assign({n:R.dish,g:Math.round(t.g),kcal:Math.round(t.kcal),p:Math.round(t.p),f:Math.round(t.f),c:Math.round(t.c),meal:R.meal,time:R.time,thumb:R.thumb||''},flag));D.store.set('food:'+D.TODAY,added);fsClose();render();U.toast('Добавлено: '+Math.round(t.kcal)+' ккал')}
function fsHelp(){U.openSheet(`<h3>Как снимать</h3><div class="opt" style="cursor:default"><div class="ico">${I.dish}</div><div class="t"><b>Блюдо</b><span>Сверху, тарелка целиком в рамке, при дневном свете. Суп и смешанные блюда считаются по обычному рецепту, точность ниже</span></div></div><div class="opt" style="cursor:default"><div class="ico">${I.barcode}</div><div class="t"><b>Штрих-код</b><span>Наведи камеру на код, он считается сам. Продукт ищется в открытой базе. Не нашёлся, сними этикетку</span></div></div><div class="opt" style="cursor:default"><div class="ico">${I.label}</div><div class="t"><b>Этикетка</b><span>Сними таблицу «Пищевая ценность» ровно и близко, чтобы цифры читались</span></div></div><p style="margin-top:4px">Граммы по фото примерные, свои всегда точнее. На следующем экране их можно поправить</p>${FS.err==='denied'?'<p>Камера для этого сайта выключена. Включить: настройки сайта в Safari, пункт «Камера», «Разрешить». Пока можно снимать круглой кнопкой, откроется камера телефона</p>':''}<div class="row2"><button class="btn" data-close>Понятно</button></div>`)}
function sheetNorm(){U.openSheet(`<h3>Твоя норма</h3><p>Считает приложение по формуле тренера, тренер утверждает и правит руками</p>${D.NORMS.slice().reverse().map(n=>`<div class="opt"><div class="t"><b>${n.kcal.toLocaleString('ru')} ккал · Б ${n.p} Ж ${n.f} У ${n.c}</b><span>с ${D.fmtD(n.from)} · ${n.why}</span></div></div>`).join('')}<div class="row2"><a class="ghost" href="baza.html">Урок: откуда цифры</a><button class="btn" data-close>Понятно</button></div>`)}
render();if(location.hash==='#add')sheetAdd();if(location.hash==='#photo')openScanner();
</script>
