<title>Питание</title>
<style>
.normc{display:flex;align-items:center;gap:14px}.normc .t{flex:1;min-width:0}.normc .t b{display:block;font-size:17px;font-weight:800}.normc .t span{font-size:12px;color:var(--muted);display:block}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mac div{background:var(--chip);border-radius:14px;padding:10px 8px 8px;text-align:center}.mac b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.mac span{font-size:11px;color:var(--muted)}
.meal{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}.meal .t{flex:1;min-width:0}.meal .t b{display:block;font-size:14px}.meal .t span{font-size:12px;color:var(--muted)}.meal .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.prod{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.prod .t{flex:1}.prod .t b{display:block;font-size:14px}.prod .t span{font-size:11px;color:var(--muted)}.prod .v{font-weight:800;font-size:13px;white-space:nowrap}
.res{background:var(--chip);border-radius:16px;padding:12px;margin:10px 0}.res b{display:block;font-size:15px}.res span{font-size:12px;color:var(--muted)}
.port{display:flex;gap:6px;margin:10px 0}.port .chip{flex:1;justify-content:center}
.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.avg div{background:var(--chip);border-radius:14px;padding:10px 8px;text-align:center}.avg b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.avg span{font-size:11px;color:var(--muted)}
.help{display:inline-flex;align-items:center;gap:4px;color:var(--acc2);font-size:12px;font-weight:700;cursor:pointer}.help svg{width:14px;height:14px}
</style>
<div class="phone"><div class="scroll" id="root"></div>{{nav:pit}}</div>
<script>
const D=window.DATA,U=window.UI;const I={plus:`{{plus}}`,cam:`{{camera-plus}}`,search:`{{search}}`,help:`{{help}}`,check:`{{check}}`,x:`{{x}}`,play:`{{player-play-filled}}`,chev:`{{chevron-right}}`};
const PRODUCTS=[['Куриная грудка',165,31,3.6,0],['Гречка варёная',110,4,1,21],['Рис варёный',130,2.7,0.3,28],['Творог 5%',121,17,5,3],['Яйцо куриное',157,13,11,1],['Овсянка сухая',370,13,7,62],['Банан',89,1.1,0.3,23],['Говядина тушёная',250,26,15,0],['Лосось',208,20,13,0],['Картофель варёный',77,2,0.1,17],['Хлеб цельнозерновой',250,9,3,45],['Масло оливковое',884,0,100,0],['Протеин сывороточный',400,80,5,10],['Йогурт греческий 2%',73,10,2,4],['Яблоко',52,0.3,0.2,14],['Орехи грецкие',654,15,65,14]].map(p=>({n:p[0],kcal:p[1],p:p[2],f:p[3],c:p[4]}));
const DISHES=[{n:'Котлета с пюре',comps:[{n:'Котлета говяжья',g:120,kcal:220,p:18,f:15,c:4},{n:'Пюре картофельное',g:200,kcal:105,p:2.2,f:3.5,c:15}]},{n:'Гречка с курицей и овощами',comps:[{n:'Гречка варёная',g:150,kcal:110,p:4,f:1,c:21},{n:'Куриная грудка',g:150,kcal:165,p:31,f:3.6,c:0},{n:'Овощи тушёные',g:100,kcal:60,p:1.5,f:3,c:7}]},{n:'Рис с лососем',comps:[{n:'Рис варёный',g:180,kcal:130,p:2.7,f:0.3,c:28},{n:'Лосось запечённый',g:140,kcal:208,p:20,f:13,c:0}]}];
const today=D.DAYS[D.DAYS.length-1],norm=D.normAt(D.TODAY);let added=D.store.get('food:'+D.TODAY,[]);
const totals=()=>({kcal:today.food.kcal+D.sum(added.map(a=>a.kcal)),p:today.food.p+D.sum(added.map(a=>a.p)),f:today.food.f+D.sum(added.map(a=>a.f)),c:today.food.c+D.sum(added.map(a=>a.c))});
const last7=D.DAYS.slice(-8,-1);const avg=k=>Math.round(D.sum(last7.map(x=>x.food[k]))/last7.length);
function render(){const r=document.getElementById('root');const t=totals();const left=norm.kcal-t.kcal;
r.innerHTML=`<h1 class="title">Питание</h1>
<div class="card"><div class="normc">${U.ring(Math.min(1,t.kcal/norm.kcal),96,t.kcal.toLocaleString('ru'),'из '+norm.kcal.toLocaleString('ru'))}<div class="t"><b>${left>0?'Осталось '+left.toLocaleString('ru')+' ккал':'Норма выполнена'}</b><span>Норма от тренера с ${D.fmtD(norm.from)}</span><span class="help" data-norm>${I.help} откуда цифры</span></div></div>
<div class="mac">${[['Белки',t.p,norm.p],['Жиры',t.f,norm.f],['Углеводы',t.c,norm.c]].map(([n,v,m])=>`<div><b>${v} <span>/ ${m}</span></b><span>${n}, г</span><div class="minibar"><i class="${v>m*1.1?'red':''}" style="width:${Math.min(100,v/m*100)}%"></i></div></div>`).join('')}</div>
<div class="row2"><button class="btn" id="addBtn">${I.plus} Добавить еду</button><button class="ghost" id="photoBtn">${I.cam} Фото блюда</button></div></div>
<div class="card" style="margin-top:-2px"><div class="row"><b>Добавки от тренера</b><span class="muted" style="font-size:12px">на этой фазе</span></div>${D.SUPPS.map(x=>`<div class="meal" style="background:var(--chip);margin:8px 0 0;padding:10px 12px"><div class="t"><b>${x.name}</b><span>${x.when}</span></div><div class="v" style="font-size:13px">${x.dose}</div></div>`).join('')}</div>
<h2>Сегодня</h2>
${today.food.meals.map(m=>`<div class="meal"><div class="t"><b>${m.name}</b><span>${m.items}</span></div><div class="v">${m.kcal} ккал</div></div>`).join('')}
${added.map((a,i)=>`<div class="meal"><div class="t"><b>${a.n}${a.photo?'<span class="badge grey">по фото · примерно</span>':''}</b><span>${a.g} г · Б ${a.p} Ж ${a.f} У ${a.c}</span></div><div class="v">${a.kcal} ккал</div><button class="chip" data-del="${i}" style="padding:6px">${I.x}</button></div>`).join('')}
<h2>Неделя</h2>
<div class="chart"><div class="cap"><b>Калории по дням</b><span>норма ${norm.kcal.toLocaleString('ru')}</span></div>${U.bars(last7.map(x=>({v:x.food.kcal,t:D.RU_D[D.d(x.date).getDay()],hi:x.food.kcal>norm.kcal*1.1})))}<div class="note" style="margin-top:4px">оранжевым дни выше нормы на 10 % и больше</div></div>
<div class="card"><div class="row"><b>Среднее за 7 дней</b><span class="muted" style="font-size:12px">в отчёт идёт само</span></div><div class="avg" style="margin-top:10px">${[['Белки',avg('p'),norm.p],['Жиры',avg('f'),norm.f],['Углеводы',avg('c'),norm.c]].map(([n,v,m])=>`<div><b>${v}</b><span>${n} · норма ${m}</span><div class="minibar"><i class="${v<m*0.9?'red':v>m*1.1?'red':'green'}" style="width:${Math.min(100,v/m*100)}%"></i></div></div>`).join('')}</div>
<div class="note" style="margin-top:8px">Средние калории ${avg('kcal').toLocaleString('ru')} · норма ${norm.kcal.toLocaleString('ru')}</div></div>
<div class="opt" data-lesson><div class="ico">${I.play}</div><div class="t"><b>Что на что менять</b><span>урок из базы знаний, 7 мин</span></div><span class="muted">${I.chev}</span></div>
<div class="note">Дневник еды заменяет скрин FatSecret в отчёте. Фото блюда: модель узнаёт блюдо и части, граммы прикидывает по тарелке, КБЖУ берёт из базы продуктов на 100 г. Твои граммы всегда точнее</div>`;
r.querySelector('#addBtn').onclick=sheetAdd;r.querySelector('#photoBtn').onclick=sheetPhoto;r.querySelector('[data-norm]').onclick=sheetNorm;
r.querySelector('[data-lesson]').onclick=()=>U.openSheet(`<h3>Что на что менять</h3><p>Питание · 7 мин</p><div class="video">${I.play}</div><p>Текст урока: замены продуктов внутри нормы, пример таблицы</p><div class="row2"><a class="ghost" href="baza.html">Вся база</a><button class="btn" data-close>Понятно</button></div>`);
r.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{added.splice(+b.dataset.del,1);D.store.set('food:'+D.TODAY,added);render();U.toast('Удалено')})}
function sheetAdd(){let q='';const draw=()=>{const list=PRODUCTS.filter(p=>!q||p.n.toLowerCase().includes(q.toLowerCase()));const s=U.openSheet(`<h3>Добавить еду</h3><div class="search">${I.search}<input id="pq" placeholder="Продукт" value="${q}"></div>${list.map((p,i)=>`<div class="prod" data-p="${PRODUCTS.indexOf(p)}"><div class="t"><b>${p.n}</b><span>на 100 г · Б ${p.p} Ж ${p.f} У ${p.c}</span></div><div class="v">${p.kcal} ккал</div></div>`).join('')}<div class="row2"><button class="ghost" data-close>Закрыть</button></div>`);
  const inp=s.querySelector('#pq');inp.oninput=e=>{q=e.target.value;draw();const x=document.getElementById('pq');x.focus();x.setSelectionRange(q.length,q.length)};
  s.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>portion(PRODUCTS[+el.dataset.p]))};draw()}
function portion(p){let g=150;const draw=()=>{const k=g/100;const s=U.openSheet(`<h3>${p.n}</h3><p>Сколько грамм?</p><div class="port">${[50,100,150,200,300].map(x=>`<button class="chip ${x===g?'on':''}" data-g="${x}">${x} г</button>`).join('')}</div><input class="in" id="gIn" inputmode="numeric" value="${g}"><div class="res"><b>${Math.round(p.kcal*k)} ккал</b><span>Б ${Math.round(p.p*k)} · Ж ${Math.round(p.f*k)} · У ${Math.round(p.c*k)}</span></div><div class="row2"><button class="ghost" data-close>Отмена</button><button class="btn" id="addGo">Добавить</button></div>`);
  s.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=+b.dataset.g;draw()});s.querySelector('#gIn').onchange=e=>{g=+e.target.value||g;draw()};
  s.querySelector('#addGo').onclick=()=>{added.push({n:p.n,g,kcal:Math.round(p.kcal*k),p:Math.round(p.p*k),f:Math.round(p.f*k),c:Math.round(p.c*k)});D.store.set('food:'+D.TODAY,added);U.closeSheet();render();U.toast('Добавлено')}};draw()}
function sheetPhoto(){const s=U.openSheet(`<h3>Фото блюда</h3><p>Сними тарелку сверху, при свете. Приложение назовёт блюдо и прикинет порцию</p><label class="btn" style="width:100%;justify-content:center">${I.cam} Открыть камеру<input type="file" accept="image/*" capture="environment" hidden id="ph"></label><div class="row2"><button class="ghost" data-close>Отмена</button></div>`);
  s.querySelector('#ph').onchange=()=>{U.openSheet(`<h3>Распознаю…</h3><p>Обычно 2-3 секунды</p><div class="video" style="aspect-ratio:4/3">${I.cam}</div>`);setTimeout(()=>recognized(DISHES[Math.floor(Math.random()*DISHES.length)]),1400)}}
function recognized(d){const comps=d.comps.map(c=>Object.assign({},c));const tot=()=>comps.reduce((a,c)=>{const k=c.g/100;a.kcal+=c.kcal*k;a.p+=c.p*k;a.f+=c.f*k;a.c+=c.c*k;return a},{kcal:0,p:0,f:0,c:0});
  const draw=()=>{const t=tot();const s=U.openSheet(`<h3>Похоже на: ${d.n}</h3><p>Состав разобран по частям. Впиши граммы каждой части, если знаешь, так точнее всего</p>
   ${comps.map((c,i)=>`<div class="prod" style="cursor:default"><div class="t"><b>${c.n}</b><span>на 100 г: ${c.kcal} ккал · Б ${c.p} Ж ${c.f} У ${c.c}</span></div><input class="in" inputmode="numeric" data-g="${i}" value="${c.g}" style="width:72px;text-align:center;font-weight:800;padding:8px 6px"><span class="muted" style="font-size:12px">г</span></div>`).join('')}
   <div class="res"><b>${Math.round(t.kcal)} ккал · ${comps.reduce((a,c)=>a+c.g,0)} г</b><span>Б ${Math.round(t.p)} · Ж ${Math.round(t.f)} · У ${Math.round(t.c)} · граммы по фото примерные, твои точнее</span></div>
   <div class="row2"><button class="ghost" id="notIt">Это не то</button><button class="btn" id="okIt">Добавить</button></div><div class="note" style="margin-top:8px">Суп и смешанные блюда оцениваются по типичному рецепту, точность ниже</div>`);
   s.querySelectorAll('[data-g]').forEach(inp=>inp.onchange=e=>{comps[+inp.dataset.g].g=+e.target.value||0;draw()});s.querySelector('#notIt').onclick=sheetAdd;
   s.querySelector('#okIt').onclick=()=>{const t=tot();added.push({n:d.n+' ('+comps.map(c=>c.n.split(' ')[0].toLowerCase()+' '+c.g).join(', ')+')',g:comps.reduce((a,c)=>a+c.g,0),photo:true,kcal:Math.round(t.kcal),p:Math.round(t.p),f:Math.round(t.f),c:Math.round(t.c)});D.store.set('food:'+D.TODAY,added);U.closeSheet();render();U.toast('Добавлено по составу')}};draw()}
function sheetNorm(){U.openSheet(`<h3>Твоя норма</h3><p>Считает приложение по формуле тренера, тренер утверждает и правит руками</p>${D.NORMS.slice().reverse().map(n=>`<div class="opt"><div class="t"><b>${n.kcal.toLocaleString('ru')} ккал · Б ${n.p} Ж ${n.f} У ${n.c}</b><span>с ${D.fmtD(n.from)} · ${n.why}</span></div></div>`).join('')}<div class="row2"><a class="ghost" href="baza.html">Урок: откуда цифры</a><button class="btn" data-close>Понятно</button></div>`)}
render();if(location.hash==='#add')sheetAdd();
</script>
