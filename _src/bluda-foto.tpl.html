<title>Фото к блюдам: выбор</title>
<style>
.bf-head p{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.4}
.bf-dish{margin-bottom:20px}
.bf-dish h3{font-size:15px;margin:0 0 8px;line-height:1.3}
.bf-dish h3 span{color:var(--acc2);margin-right:6px}
.bf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bf-it{display:block;text-decoration:none;color:inherit}
.bf-im{position:relative;border-radius:14px;overflow:hidden;background:var(--chip);aspect-ratio:1}
.bf-im img{width:100%;height:100%;object-fit:cover;display:block}
.bf-im b{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:800;border-radius:8px;padding:3px 7px;line-height:1}
.bf-it.on .bf-im{outline:2px solid var(--acc2);outline-offset:-2px}
.bf-cap{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
.bf-cap i{font-style:normal;color:var(--acc2);font-weight:700}
</style>
<div class="phone"><div class="scroll" id="root"></div>{{nav:pit}}</div>
<script>
const I={back:`{{arrow-left}}`};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(d,p){const r=document.getElementById('root');
 r.innerHTML=`<a href="bluda.html" class="muted" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;margin-bottom:8px">${I.back} Блюда</a>
 <div class="bf-head"><h1 class="title" style="margin-bottom:4px">Фото к блюдам</h1><p>30 блюд, к каждому от одного до четырёх фото. С рамкой то, что стоит в карточке сейчас. Поменять: напиши номер блюда и номер фото, например «5-2». Pexels: настоящее фото со свободной лицензией. Генерация: сделано нейросетью как снимок с фотоаппарата, состав по карточке</p></div>
 ${d.map((x,i)=>{const e=p[String(i+1)]||{variants:[]};return `<div class="bf-dish"><h3><span>${i+1}.</span>${esc(x.n)}</h3><div class="bf-grid">${(e.variants||[]).map((v,k)=>`<a class="bf-it ${v.file===e.main?'on':''}" href="${v.file}" target="_blank"><div class="bf-im"><img src="${v.file}" alt="" loading="lazy"><b>${k+1}</b></div><div class="bf-cap">${v.src==='Pexels'?'Pexels':'генерация'}${v.file===e.main?' · <i>в карточке</i>':''}</div></a>`).join('')||'<div class="note" style="grid-column:1/-1;text-align:left">Фото ещё нет</div>'}</div></div>`}).join('')}
 <div class="note">Нажми на фото, откроется крупно</div>`}
Promise.all([fetch('data/dishes-sample.json').then(r=>r.json()),fetch('data/dishes-photos.json').then(r=>r.json())]).then(([d,p])=>render(d,p)).catch(()=>{document.getElementById('root').innerHTML='<div class="note">Не загрузилось, проверь интернет</div>'});
</script>
