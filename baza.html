<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791309109"><script src="phases.js?v=1791309109"></script><script src="data.js?v=1791309109"></script><script src="ui.js?v=1791309109"></script><title>База знаний</title></head><body>
<style>.cat{margin:16px 0 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.prog{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px;margin-bottom:6px}.prog .t b{display:block;font-size:17px;font-weight:800}.prog .t span{color:var(--muted);font-size:13px}</style>
<div class="phone"><div class="scroll" id="root"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2652A"/><stop offset="1" stop-color="#F6B343"/></linearGradient></defs></svg><nav class="nav"><a class="on" href="dom.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>Дом</a><a href="tren.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>Тренировки</a><a href="pit.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12zm0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3" /></svg>Питание</a><a href="prog.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>Прогресс</a><a href="otchet.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>Отчёт</a></nav></div>
<script>
const D=window.DATA,U=window.UI;const I={play:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg>`,search:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>`,check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`};
let q='';let seen=D.store.get('lessons',[]);const all=D.LESSONS.flatMap(c=>c.items.map(l=>Object.assign({cat:c.cat},l)));
function render(){const r=document.getElementById('root');const n=all.length;
r.innerHTML=`<div class="hdr"><a href="dom.html">${I.back}</a><b style="font-size:17px">База знаний</b><span style="width:30px"></span></div>
<div class="prog">${U.ring(seen.length/n,72,seen.length+'/'+n)}<div class="t"><b>Твои уроки</b><span>Видео от тренера: питание, тренировки, как вести приложение</span></div></div>
<div class="search">${I.search}<input id="q" placeholder="Найти урок" value="${q}"></div>
${D.LESSONS.map(c=>{const items=c.items.filter(l=>!q||l.t.toLowerCase().includes(q.toLowerCase()));if(!items.length)return '';return `<div class="cat">${c.cat}</div>${items.map(l=>`<div class="lesson ${seen.includes(l.t)?'seen':''}" data-l="${l.t}"><div class="thumb" style="width:52px;height:52px">${seen.includes(l.t)?I.check:I.play}</div><div class="t"><b>${l.t}${l.new&&!seen.includes(l.t)?'<span class="badge">новое</span>':''}</b><span>${l.min} мин${seen.includes(l.t)?' · просмотрено':''}</span></div></div>`).join('')}`}).join('')}
<div class="note">Сюда тренер загружает ролики. Ссылки на уроки стоят в разделах: «?» у темпа, у нормы КБЖУ, у отчёта</div>`;
const inp=r.querySelector('#q');inp.oninput=e=>{q=e.target.value;render();r.querySelector('#q').focus();r.querySelector('#q').setSelectionRange(q.length,q.length)};
r.querySelectorAll('[data-l]').forEach(el=>el.onclick=()=>open(all.find(l=>l.t===el.dataset.l)))}
function open(l){U.openSheet(`<h3>${l.t}</h3><p>${l.cat} · ${l.min} мин</p><div class="video">${I.play}</div><p>Здесь текст урока: твои тезисы под видео, что запомнить и что сделать</p><div class="row2"><button class="ghost" data-close>Закрыть</button><button class="btn" id="seenBtn">${seen.includes(l.t)?'Снять отметку':'Просмотрено'}</button></div>`,s=>{s.querySelector('#seenBtn').onclick=()=>{seen=seen.includes(l.t)?seen.filter(x=>x!==l.t):seen.concat(l.t);D.store.set('lessons',seen);U.closeSheet();render()}})}
render();
</script>
</body></html>
