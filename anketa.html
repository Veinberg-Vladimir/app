<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1793341729"><script src="phases.js?v=1793341729"></script><script src="data.js?v=1793341729"></script><script src="ui.js?v=1793341729"></script><script>(function(){var h=document.documentElement;function set(){var t="auto";try{t=JSON.parse(localStorage.getItem("app:theme"))||"auto"}catch(e){}var d=t==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"neon"):t;h.dataset.theme=d;var m=document.querySelector("meta[name=theme-color]");if(m)m.content=d==="light"?"#F3F5F9":"#07070C"}set();window.setTheme=function(t){try{localStorage.setItem("app:theme",JSON.stringify(t))}catch(e){}set()};try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",set)}catch(e){}})()</script><title>Анкета</title></head><body>
<style>
.stepn{font-size:12px;color:var(--acc2);font-weight:700}.steph{font-size:22px;font-weight:800;margin:2px 0 4px}.steps{font-size:13px;color:var(--muted);margin:0 0 12px}
.q{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}.q>b{display:block;font-size:14px;margin-bottom:8px}.q>b small{font-weight:500;color:var(--muted);font-size:12px}.q .chips{display:flex;flex-wrap:wrap;gap:6px}
.q input[type=text],.q input[inputmode],.q textarea{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-weight:700;padding:0 12px;font-size:15px}.q textarea{height:76px;padding:10px 12px;font-weight:500;resize:vertical}.q input:focus,.q textarea:focus{outline:none;border-color:var(--acc)}
.q .num{display:flex;align-items:center;gap:8px}.q .num input{width:110px;text-align:center}.q .num span{color:var(--muted);font-size:13px}
.q .opts{display:flex;flex-direction:column;gap:6px}.q .opts .opt{margin:0}.q .opts .opt b{font-size:14px}
.q.err{box-shadow:inset 0 0 0 1.5px var(--bad)}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:10px;cursor:pointer}.cons i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}.cons i.on{background:var(--ok);border-color:var(--ok);color:var(--okInk)}.cons i svg{width:14px;height:14px}
.fatg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fat{background:var(--chip);border-radius:14px;padding:8px 8px 10px;border:1.5px solid transparent;cursor:pointer;text-align:center}.fat.sel{border-color:var(--acc)}.fat img{display:block;width:100%;max-width:120px;aspect-ratio:2/3;object-fit:cover;margin:0 auto 6px;border-radius:10px;background:#EDEBE6}.fat b{display:block;font-size:14px}.fat span{display:block;font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px}
.meas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.meas label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.meas input{text-align:center}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph label{aspect-ratio:3/4;border-radius:14px;background:var(--chip);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;cursor:pointer}.ph label.ok{border-style:solid;border-color:var(--ok);color:var(--ok2)}.ph label svg{width:22px;height:22px}
.nav2{display:flex;gap:8px;margin-top:14px}.nav2 .btn{flex:2}.nav2 .ghost{flex:1}
.draft{font-size:11px;color:var(--acc2);background:color-mix(in srgb,var(--acc2) 8%,transparent);border:1px dashed color-mix(in srgb,var(--acc2) 45%,transparent);border-radius:10px;padding:6px 10px;margin-bottom:12px}
</style>
<div class="phone"><div class="scroll" id="root"></div></div>
<script>
const D=window.DATA,U=window.UI;const I={check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,cam:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 20h-7a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v3.5" /><path d="M16 19h6" /><path d="M19 16v6" /><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>`,back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`,send:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 14l11 -11" /><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" /></svg>`};
/* анкета при старте (100): поля нормы как в калькуляторе Владимира (пол, вес, % жира, активность 5 уровней, «давно на диете»),
   остальное под программу и меню: где и с чем тренируется, травмы, что ест, что не ест. Его правки 29.10 внесены, анкета заполняется один раз */
const FAT={m:[['8-12 %','Кубики и вены видны всегда, лицо сухое'],['12-16 %','Пресс виден, талия узкая, руки рельефные'],['17-22 %','Живот плоский, но мягкий, пресса почти не видно'],['23-27 %','Живот выступает, появились бока, пресса нет'],['28-33 %','Круглый живот, бока, лицо округлилось'],['34-40 %','Большой живот нависает над ремнём']],
 f:[['14-18 %','Мышцы прорисованы, пресс виден, бёдра узкие'],['19-23 %','Подтянутая, живот плоский, пресса почти не видно'],['24-28 %','Живот мягкий, не выступает, бёдра округлые'],['29-33 %','Живот выступает, появились бока и складки'],['34-39 %','Круглый живот, полные руки и бёдра'],['40-45 %','Большой живот, складки на боках и спине']]};
const ACT=[['1.2','Сидячая, офисная работа'],['1.375','Лёгкие тренировки, 1-2 дня в неделю'],['1.55','Средние тренировки, 3-5 дней в неделю'],['1.725','Тяжёлые тренировки, 6-7 дней в неделю'],['1.9','Спортсмен, 2 тренировки в день']];
const HEALTH=['inj','ill','meds'];
const STEPS=[
 {h:'О себе',s:'Из этого считается твоя норма',q:[{k:'name',t:'Как тебя зовут',type:'text',req:1},{k:'sex',t:'Пол',type:'one',o:['Мужской','Женский'],req:1},{k:'age',t:'Возраст',type:'num',u:'лет',req:1},{k:'height',t:'Рост',type:'num',u:'см',req:1},{k:'weight',t:'Вес утром натощак',type:'num',u:'кг',req:1}]},
 {h:'Процент жира',s:'Выбери, на что больше похоже',q:[{k:'fat',t:'Как выглядишь сейчас',type:'fat',req:1}]},
 {h:'Цель',s:'Срок не ставим: темп держим 0,5-1,5 % веса в неделю',q:[{k:'goal',t:'Чего хочешь',type:'one',o:['Похудеть','Рельеф, вес держать','Набрать мышцы'],req:1},{k:'goalKg',t:'Какой вес хочешь',type:'num',u:'кг',hint:'можно пропустить'},{k:'diet',t:'Давно сидишь на диете?',type:'one',o:['Да, больше 3 месяцев','Нет'],req:1}]},
 {h:'Обычный день',s:'Чтобы план лёг в твою жизнь, а не наоборот',q:[{k:'act',t:'Активность сейчас',type:'list',o:ACT.map(x=>x[1]),req:1},{k:'steps',t:'Шагов в день сейчас',type:'one',o:['до 5 000','5-8 тысяч','8-12 тысяч','больше 12 тысяч','не знаю']},{k:'sleep',t:'Сколько спишь',type:'one',o:['меньше 6 ч','6-7 ч','7-8 ч','больше 8 ч']},{k:'shift',t:'Сменная работа или ночные смены',type:'one',o:['Да','Нет']},{k:'trips',t:'Командировки',type:'one',o:['Нет','Раз в месяц','Чаще']}]},
 {h:'Тренировки',s:'',q:[{k:'where',t:'Где будешь тренироваться',type:'one',o:['В зале','Дома'],req:1},{k:'kit',t:'Что есть дома',type:'many',o:['Гантели','Гири','Штанга','Турник','Брусья','Резинки','Скамья','Ничего'],show:a=>a.where==='Дома',req:1},{k:'times',t:'Сколько раз в неделю',type:'one',o:['2','3','4','5'],req:1},{k:'mins',t:'Сколько времени на тренировку',type:'one',o:['45 мин','1 час','1,5 часа'],req:1},{k:'exp',t:'Опыт в зале',type:'one',o:['Нет','До года','1-3 года','Больше 3 лет'],req:1}]},
 {h:'Здоровье',s:'',q:[{k:'inj',t:'Травмы и боли',type:'many',o:['Поясница','Колени','Плечи','Локти','Шея','Нет'],req:1},{k:'injTxt',t:'Что именно и когда',type:'area',show:a=>(a.inj||[]).some(x=>x!=='Нет')},{k:'ill',t:'Болезни, важные для еды и нагрузки',type:'many',o:['Давление','Диабет','Щитовидка','Желудок, кишечник','Сердце','Нет'],req:1},{k:'meds',t:'Лекарства, которые пьёшь постоянно',type:'text',hint:'можно пропустить'},{k:'consent',type:'consent',show:a=>HEALTH.some(k=>Array.isArray(a[k])?a[k].some(x=>x!=='Нет'):String(a[k]||'').trim())}]},
 {h:'Еда сейчас',s:'Как ешь обычно, без прикрас: так меню выйдет похожим на твою жизнь',q:[{k:'count',t:'Считал калории раньше',type:'one',o:['Нет','Пробовал','Считаю сейчас']},{k:'usual',t:'Что ешь за обычный день',type:'area',hint:'завтрак, обед, ужин, перекусы'},{k:'cook',t:'Готовишь сам',type:'one',o:['Да','Иногда','Нет, ем вне дома'],req:1},{k:'alc',t:'Алкоголь',type:'one',o:['Нет','По праздникам','Каждую неделю']},{k:'sweet',t:'Сладкое',type:'one',o:['Редко','Пару раз в неделю','Каждый день']}]},
 {h:'Вкусы',s:'В меню не будет того, что ты не ешь',q:[{k:'no',t:'Не ешь или не любишь',type:'many',o:['Рыба','Морепродукты','Свинина','Говядина','Молочное','Творог','Яйца','Грибы','Крупы']},{k:'noTxt',t:'Что ещё не ешь',type:'text',hint:'можно пропустить'},{k:'allergy',t:'Аллергия или непереносимость',type:'many',o:['Лактоза','Глютен','Орехи','Морепродукты','Нет'],req:1},{k:'love',t:'Что любишь, без чего плохо',type:'area',hint:'например: гречка, курица, кофе с молоком'},{k:'budget',t:'Бюджет на еду в неделю',type:'num',u:'₽',hint:'можно пропустить'}]},
 {h:'Старт: замеры и фото',s:'С ними сравнивается каждый отчёт. Утром до еды, лентой по голой коже',q:[{k:'meas',t:'Замеры, см',type:'meas',req:1},{k:'photos',t:'Фото: спереди, сбоку, сзади',type:'photos',req:1}]}];
let A=D.store.get('anketa',{});let step=Math.min(D.store.get('anketa:step',0),STEPS.length);
const save=()=>{D.store.set('anketa',A);D.store.set('anketa:step',step)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shown=q=>!q.show||q.show(A);
function filled(q){const v=A[q.k];if(q.type==='consent')return !!v;if(q.type==='meas')return D.MEAS_FIELDS.every(([l,k])=>v&&String(v[k]||'').trim());if(q.type==='photos')return ['спереди','сбоку','сзади'].every(x=>v&&v[x]);if(Array.isArray(v))return v.length>0;return v!=null&&String(v).trim()!==''}
function qHtml(q,err){const v=A[q.k];const cls=`q ${err?'err':''}`;const tt=q.t?`<b>${q.t}${q.req?'':' <small>· '+(q.hint||'по желанию')+'</small>'}</b>`:'';
  if(q.type==='text')return `<div class="${cls}">${tt}<input type="text" data-t="${q.k}" value="${esc(v)}"></div>`;
  if(q.type==='area')return `<div class="${cls}">${tt}<textarea data-t="${q.k}" placeholder="${esc(q.hint||'')}">${esc(v)}</textarea></div>`;
  if(q.type==='num')return `<div class="${cls}">${tt}<div class="num"><input inputmode="decimal" data-t="${q.k}" value="${esc(v)}"><span>${q.u}</span></div></div>`;
  if(q.type==='one')return `<div class="${cls}">${tt}<div class="chips">${q.o.map(o=>`<button class="chip ${v===o?'on':''}" data-one="${q.k}" data-v="${esc(o)}">${o}</button>`).join('')}</div></div>`;
  if(q.type==='many')return `<div class="${cls}">${tt}<div class="chips">${q.o.map(o=>`<button class="chip ${(v||[]).includes(o)?'on':''}" data-many="${q.k}" data-v="${esc(o)}">${o}</button>`).join('')}</div></div>`;
  if(q.type==='list')return `<div class="${cls}">${tt}<div class="opts">${q.o.map(o=>`<div class="opt ${v===o?'sel':''}" data-one="${q.k}" data-v="${esc(o)}"><div class="t"><b>${o}</b></div></div>`).join('')}</div></div>`;
  if(q.type==='fat'){const sx=A.sex==='Женский'?'f':'m',F=FAT[sx];return `<div class="${cls}">${tt}<div class="fatg">${F.map(([r,t],i)=>`<div class="fat ${v===r?'sel':''}" data-one="fat" data-v="${r}"><img src="img/fat/${sx==='f'?'women':'men'}-${i+1}.png" alt="" loading="lazy"><b>${r}</b><span>${t}</span></div>`).join('')}</div></div>`}
  if(q.type==='consent')return `<div class="${cls}"><div class="cons" data-cons><i class="${v?'on':''}">${v?I.check:''}</i><span>Согласен, чтобы тренер видел мои данные о здоровье и учитывал их в программе и питании. Без этого согласия по закону их нельзя хранить</span></div></div>`;
  if(q.type==='meas'){const m=v||{};return `<div class="${cls}">${tt}<div class="meas">${D.MEAS_FIELDS.map(([l,k])=>`<div><label>${l}</label><input inputmode="decimal" data-m="${k}" value="${esc(m[k])}"></div>`).join('')}</div></div>`}
  if(q.type==='photos'){const p=v||{};return `<div class="${cls}">${tt}<div class="ph">${['спереди','сбоку','сзади'].map(x=>`<label class="${p[x]?'ok':''}">${p[x]?I.check:I.cam}<span>${x}</span><input type="file" accept="image/*" capture="environment" hidden data-ph="${x}"></label>`).join('')}</div></div>`}
  return ''}
function done(){return `<div class="card hero" style="margin-top:8px"><div class="eyebrow">Анкета отправлена</div><b style="font-size:19px;display:block;line-height:1.2">Тренер соберёт программу, нутрициолог меню</b><p class="muted" style="font-size:13px;margin:6px 0 12px">План будет готов в течение 48 часов</p>
  <ul class="pts" style="margin:0">${[['Пол, возраст, рост, вес',[A.sex,A.age&&D.pl(+A.age,'год','года','лет'),A.height&&A.height+' см',A.weight&&A.weight+' кг'].filter(Boolean).join(' · ')],['Жир',A.fat],['Цель',A.goal],['Тренировки',[A.where,A.times&&D.pl(+A.times,'раз','раза','раз')+' в неделю',(A.kit||[]).join(', ')].filter(Boolean).join(' · ')],['Травмы',(A.inj||[]).join(', ')],['Не ест',(A.no||[]).concat(A.noTxt?[A.noTxt]:[]).join(', ')||'всё ест'],['Аллергия',(A.allergy||[]).join(', ')]].map(([h,t])=>`<li><b style="min-width:92px">${h}</b><span>${esc(t||'нет')}</span></li>`).join('')}</ul>
  <div class="row2"><a class="btn" href="dom.html">В приложение</a></div></div>`}
function render(errs){const r=document.getElementById('root');
  if(step>=STEPS.length){r.innerHTML=`<div class="hdr"><a href="index.html">${I.back}</a><b style="font-size:17px">Анкета</b><span style="width:30px"></span></div>${done()}<div class="note">Анкета заполняется один раз. Демо: ответы хранятся в этом телефоне, заново пройти можно кнопкой «Сбросить прототип» в списке макетов</div>`;return}
  const S=STEPS[step];
  r.innerHTML=`<div class="hdr"><a href="${step?'#':'index.html'}" id="bk">${I.back}</a><b style="font-size:15px">Анкета</b><span class="muted" style="font-size:12px">${step+1} из ${STEPS.length}</span></div>
  <div class="bar" style="margin:4px 0 14px"><i style="width:${(step+1)/STEPS.length*100}%"></i></div>
  <div class="stepn">Шаг ${step+1}</div><div class="steph">${S.h}</div>${S.s?`<p class="steps">${S.s}</p>`:'<div style="height:10px"></div>'}
  ${S.q.filter(shown).map(q=>qHtml(q,errs&&errs.includes(q.k))).join('')}
  <div class="nav2">${step?'<button class="ghost" id="prev">Назад</button>':''}<button class="btn" id="next">${step===STEPS.length-1?I.send+' Отправить тренеру':'Дальше'}</button></div>`;
  const bk=r.querySelector('#bk');if(step)bk.onclick=e=>{e.preventDefault();step--;save();render()};
  r.querySelectorAll('[data-t]').forEach(i=>i.oninput=()=>{A[i.dataset.t]=i.value;save()});
  r.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>{A[b.dataset.one]=b.dataset.v;save();render()});
  r.querySelectorAll('[data-many]').forEach(b=>b.onclick=()=>{const k=b.dataset.many,v=b.dataset.v;let a=A[k]||[];if(v==='Нет'||v==='Ничего')a=a.includes(v)?[]:[v];else{a=a.filter(x=>x!=='Нет'&&x!=='Ничего');a=a.includes(v)?a.filter(x=>x!==v):a.concat(v)}A[k]=a;save();render()});
  const c=r.querySelector('[data-cons]');if(c)c.onclick=()=>{A.consent=!A.consent;save();render()};
  r.querySelectorAll('[data-m]').forEach(i=>i.oninput=()=>{A.meas=A.meas||{};A.meas[i.dataset.m]=i.value;save()});
  r.querySelectorAll('[data-ph]').forEach(i=>i.onchange=()=>{A.photos=A.photos||{};A.photos[i.dataset.ph]=true;save();render();U.toast('Фото добавлено')});
  const p=r.querySelector('#prev');if(p)p.onclick=()=>{step--;save();render();window.scrollTo(0,0)};
  r.querySelector('#next').onclick=()=>{const miss=S.q.filter(shown).filter(q=>(q.req||q.type==='consent')&&!filled(q));if(miss.length){render(miss.map(q=>q.k));U.toast(miss.some(q=>q.type==='consent')?'Нужна галочка согласия':'Ответь на отмеченные вопросы');return}step++;save();render();window.scrollTo(0,0)}}
render();
</script>
</body></html>
