iewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 2c0 -.88 1.056 -1.331 1.692 -.722c1.958 1.876 3.096 5.995 1.75 9.12l-.08 .174l.012 .003c.625 .133 1.203 -.43 2.303 -2.173l.14 -.224a1 1 0 0 1 1.582 -.153c1.334 1.435 2.601 4.377 2.601 6.27c0 4.265 -3.591 7.705 -8 7.705s-8 -3.44 -8 -7.706c0 -2.252 1.022 -4.716 2.632 -6.301l.605 -.589c.241 -.236 .434 -.43 .618 -.624c1.43 -1.512 2.145 -2.924 2.145 -4.78" /></svg>`,meat:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M13.62 8.382l1.966 -1.967a2 2 0 1 1 3.414 -1.415a2 2 0 1 1 -1.413 3.414l-1.82 1.821" /><path d="M5.904 18.596c2.733 2.734 5.9 4 7.07 2.829c1.172 -1.172 -.094 -4.338 -2.828 -7.071c-2.733 -2.734 -5.9 -4 -7.07 -2.829c-1.172 1.172 .094 4.338 2.828 7.071z" /><path d="M7.5 16l1 1" /><path d="M12.975 21.425c3.905 -3.906 4.855 -9.288 2.121 -12.021c-2.733 -2.734 -8.115 -1.784 -12.02 2.121" /></svg>`,drop:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7.502 19.423c2.602 2.105 6.395 2.105 8.996 0c2.602 -2.105 3.262 -5.708 1.566 -8.546l-4.89 -7.26c-.42 -.625 -1.287 -.803 -1.936 -.397a1.376 1.376 0 0 0 -.41 .397l-4.893 7.26c-1.695 2.838 -1.035 6.441 1.567 8.546z" /></svg>`,wheat:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12.014 21.514v-3.75" /><path d="M5.93 9.504l-.43 1.604c-.712 2.659 .866 5.391 3.524 6.105c.997 .268 1.993 .535 2.99 .801v-3.44c-.164 -2.105 -1.637 -3.879 -3.676 -4.426l-2.408 -.644z" /><path d="M13.744 11.164c.454 -.454 .815 -.994 1.061 -1.587c.246 -.594 .372 -1.23 .372 -1.873c0 -.643 -.126 -1.279 -.372 -1.872c-.246 -.594 -.606 -1.133 -1.061 -1.588l-1.73 -1.73l-1.73 1.73c-.454 .454 -.815 .994 -1.06 1.588c-.246 .594 -.372 1.23 -.373 1.872c0 .643 .127 1.279 .373 1.873c.246 .594 .606 1.133 1.06 1.587" /><path d="M18.099 9.504l.43 1.604c.712 2.659 -.866 5.391 -3.525 6.105c-.997 .268 -1.994 .535 -2.99 .801v-3.44c.164 -2.105 1.637 -3.879 3.677 -4.426l2.408 -.644z" /></svg>`,spark:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6z" /></svg>`};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=D.DAYS[D.DAYS.length-1],norm=D.normAt(D.TODAY);let added=D.store.get('food:'+D.TODAY,[]);
let tab=D.store.get('pit:tab','dnevnik');
const MENU=[['Завтрак',[['Овсянка на воде с ягодами и яйцом',420,22,12,55,'Овсянка 70 г, яйцо, ягоды 100 г'],['Омлет из трёх яиц с овощами',380,26,26,8,'3 яйца, помидор, шпинат, 5 г масла'],['Творог 5 % с бананом',350,30,9,35,'Творог 200 г, банан']]],['Обед',[['Гречка с куриной грудкой и овощами',560,48,10,62,'Гречка 100 г сухой, грудка 180 г, овощи 150 г'],['Рис с индейкой и салатом',580,45,12,70,'Рис 90 г сухой, индейка 180 г, салат с маслом 5 г'],['Картофель с говядиной',620,42,20,65,'Картофель 300 г, говядина 150 г, огурец']]],['Ужин',[['Лосось с брокколи',520,38,30,15,'Лосось 180 г, брокколи 250 г'],['Куриные бёдра без кожи с овощами',480,40,22,20,'Бёдра 200 г, овощи гриль 250 г'],['Творожная запеканка',400,35,10,30,'Творог 250 г, яйцо, рисовая мука 30 г']]],['Перекус',[['Греческий йогурт с орехами',260,16,14,15,'Йогурт 2 % 200 г, грецкие 15 г'],['Протеиновый коктейль',150,26,2,5,'Протеин 30 г, вода'],['Яблоко и миндаль',230,7,15,20,'Яблоко, миндаль 30 г']]]];
/* подсказка «чем добить белок» (50): КБЖУ на 100 г из базы продуктов приложения, порция не больше max. Первые три по умолчанию, список принят его «ок» 29.10 */
const PROT=[{n:'Творог 5 %',kcal:120,p:16,f:5,c:3,max:250},{n:'Куриная грудка варёная',kcal:151,p:29,f:3,c:0,max:200},{n:'Протеиновый коктейль',kcal:352,p:78.1,f:1.6,c:6.2,max:60,step:30,u:'г порошка'},{n:'Творог 0-0,5 %',kcal:90,p:18,f:0.5,c:3.3,max:250},{n:'Йогурт греческий 2 %',kcal:73,p:9.9,f:1.9,c:3.9,max:300},{n:'Тунец в собственном соку',kcal:86,p:19.4,f:1,c:0,max:150},{n:'Филе индейки запечённое',kcal:136,p:29.5,f:2,c:0,max:200},{n:'Минтай запечённый',kcal:87,p:19.4,f:1,c:0,max:250},{n:'Креветки варёные',kcal:99,p:24,f:0.3,c:0.2,max:200},{n:'Омлет из яичных белков',kcal:52,p:10.9,f:0.2,c:0.7,max:200},{n:'Кефир 1 %',kcal:37,p:3,f:1,c:4,max:500,u:'мл'}];
function protPortion(x,need){const st=x.step||10;const g=Math.max(st,Math.min(x.max,Math.ceil(need/x.p*100/st)*st));const k=g/100;return {x,g,p:Math.round(x.p*k),kcal:Math.round(x.kcal*k),f:+(x.f*k).toFixed(1),c:+(x.c*k).toFixed(1)}}
function protPicks(need,kLeft,all){const L=PROT.map(x=>protPortion(x,need));if(all)return L;const fit=L.filter(o=>o.kcal<=Math.max(kLeft,0));const pick=fit.slice(0,3);if(pick.length<3){L.slice().sort((a,b)=>a.kcal/a.p-b.kcal/b.p).forEach(o=>{if(pick.length<3&&!pick.includes(o))pick.push(o)})}return pick}
function protRow(o){return `<div class="pr"><div class="t"><b>${esc(o.x.n)}, ${o.g} ${o.x.u||'г'}</b><span>+${o.p} г белка · ${o.kcal} ккал</span></div><button class="chip on" data-prot="${PROT.indexOf(o.x)}:${o.g}">${I.plus}</button></div>`}
function protTip(t){const need=norm.p-t.p;if(need<10)return '';const kLeft=norm.kcal-t.kcal;return `<div class="ptip"><div class="row"><b>Ещё ${need} г белка. Чем добить</b><button class="help" data-protall style="background:none;border:0;padding:0;font:inherit">другие</button></div>${protPicks(need,kLeft).map(protRow).join('')}</div>`}
const totals=()=>({kcal:today.food.kcal+D.sum(added.map(a=>a.kcal)),p:today.food.p+D.sum(added.map(a=>a.p)),f:today.food.f+D.sum(added.map(a=>a.f)),c:today.food.c+D.sum(added.map(a=>a.c))});
const last7=D.DAYS.slice(-8,-1);const avg=k=>Math.round(D.sum(last7.map(x=>x.food[k]))/last7.length);
function render(){const r=document.getElementById('root');const t=totals();const left=norm.kcal-t.kcal;
if(tab==='menu'){renderMenu(r,t);return}
r.innerHTML=`<h1 class="title">Питание</h1>${U.seg([{k:'dnevnik',t:'Дневник'},{k:'menu',t:'Меню'}],tab,'ptab')}
<div class="card"><div class="normc">${U.ring(Math.min(1,t.kcal/norm.kcal),96,t.kcal.toLocaleString('ru'),'из '+norm.kcal.toLocaleString('ru'))}<div class="t"><b>${left>0?'Осталось '+left.toLocaleString('ru')+' ккал':'Норма выполнена'}</b><span>Норма с ${D.fmtD(norm.from)}</span><span class="help" data-norm>${I.help} откуда цифры</span></div></div>
<div class="mac">${[['Белки',t.p,norm.p],['Жиры',t.f,norm.f],['Углеводы',t.c,norm.c]].map(([n,v,m])=>`<div><b>${v} <span>/ ${m}</span></b><span>${n}, г</span><div class="minibar"><i class="${v>m*1.1?'red':''}" style="width:${Math.min(100,v/m*100)}%"></i></div></div>`).join('')}</div>
${protTip(t)}<div class="row2"><button class="btn" id="addBtn">${I.plus} Добавить еду</button><button class="ghost" id="photoBtn">${I.cam} Фото блюда</button></div></div>
<div class="card" style="margin-top:-2px"><div class="row"><b>Добавки от тренера</b><span class="muted" style="font-size:12px">на этой фазе</span></div>${D.SUPPS.map(x=>`<div class="meal" style="background:var(--chip);margin:8px 0 0;padding:10px 12px"><div class="t"><b>${x.name}</b><span>${x.when}</span></div><div class="v" style="font-size:13px">${x.dose}</div></div>`).join('')}</div>
<h2>Сегодня</h2>
${today.food.meals.map(m=>`<div class="meal"><div class="t"><b>${m.name}</b><span>${m.items}</span></div><div class="v">${m.kcal} ккал</div></div>`).join('')}
${added.map((a,i)=>`<div class="meal">${a.thumb?`<div class="fthumb" style="background-image:url('${esc(a.thumb)}')"></div>`:''}<div class="t"><b class="clamp2">${a.meal?dishHtml(a.n):esc(a.n)}</b>${a.photo||a.bar||a.lab?`<span class="badge grey" style="margin:3px 6px 2px 0">${a.photo?'по фото · примерно':a.bar?'штрих-код':'этикетка'}</span>`:''}<span>${a.meal?esc(a.meal)+(a.time?' '+a.time:'')+' · ':''}${a.menu?'из меню':a.g+' г'} · Б ${a.p} Ж ${a.f} У ${a.c}</span></div><div class="v">${a.kcal} ккал</div><button class="chip" data-del="${i}" style="padding:6px">${I.x}</button></div>`).join('')}
<h2>Неделя</h2>
<div class="chart"><div class="cap"><b>Калории по дням</b><span>норма ${norm.kcal.toLocaleString('ru')}</span></div>${U.bars(last7.map(x=>({v:x.food.kcal,t:D.RU_D[D.d(x.date).getDay()],hi:x.food.kcal>norm.kcal*1.1})))}<div class="note" style="margin-top:4px">оранжевым дни выше нормы на 10 % и больше</div></div>
<div class="card"><div class="row"><b>Среднее за 7 дней</b><span class="muted" style="font-size:12px">в отчёт идёт само</span></div><div class="avg" style="margin-top:10px">${[['Белки',avg('p'),norm.p],['Жиры',avg('f'),norm.f],['Углеводы',avg('c'),norm.c]].map(([n,v,m])=>`<div><b>${v}</b><span>${n} · норма ${m}</span><div class="minibar"><i class="${v<m*0.9?'red':v>m*1.1?'red':'green'}" style="width:${Math.min(100,v/m*100)}%"></i></div></div>`).join('')}</div>
<div class="note" style="margin-top:8px">Средние калории ${avg('kcal').toLocaleString('ru')} · норма ${norm.kcal.toLocaleString('ru')}</div></div>
<div class="opt" data-lesson><div class="ico">${I.play}</div><div class="t"><b>Что на что менять</b><span>урок из базы знаний, 7 мин</span></div><span class="muted">${I.chev}</span></div>
<div class="note">Дневник еды заменяет скрин FatSecret в отчёте. Фото блюда: модель узнаёт блюдо и части, граммы прикидывает по тарелке, КБЖУ берёт из базы продуктов на 100 г. Штрих-код ищется в открытой базе Open Food Facts. Твои граммы всегда точнее</div>`;
r.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{tab=b.dataset.ptab;D.store.set('pit:tab',tab);render();window.scrollTo(0,0)});
r.querySelector('#addBtn').onclick=()=>sheetAdd();r.querySelector('#photoBtn').onclick=openScanner;r.querySelector('[data-norm]').onclick=sheetNorm;
r.querySelector('[data-lesson]').onclick=()=>U.openSheet(`<h3>Что на что менять</h3><p>Питание · 7 мин</p><div class="video">${I.play}</div><p>Текст урока: замены продуктов внутри нормы, пример таблицы</p><div class="row2"><a class="ghost" href="baza.html">Вся база</a><button class="btn" data-close>Понятно</button></div>`);

const FDB={core:null,off:null,byCode:null,loading:null};
const normS=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/,/g,'.').replace(/[^a-zа-я0-9%.]+/g,' ').replace(/(\d)\s+%/g,'$1%').replace(/\s+/g,' ').trim();

function fdbSearch(q,lim){const q0=normS(q),qs=[q0];if(/[a-z]/.test(q0)&&!/[а-я]/.test(q0))qs.push(normS(fromLat(q0)));
  const run=(list,bonus)=>{const res=[];for(const it of list){let best=-1;const w=' '+it.k+' ';for(const qq of qs){const toks=qq.split(' ').filter(Boolean);if(!toks.length)continue;let sc=bonus,ok=true;for(const t of toks){const i=w.indexOf(' '+t);if(i<0){ok=false;break}sc+=w.startsWith(' '+t+' ',i)?12:6}if(!ok)continue;if(it.k.startsWith(toks[0]))sc+=25;sc-=it.k.length/12;for(const [re,pen,qre] of RARE)if(re.test(it.k)&&!qre.test(qq))sc-=pen;if(sc>best)best=sc}if(best>-1)res.push([best,it])}const seen=new Set();return res.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).filter(it=>{const key=it.k+'|'+it.kcal+'|'+it.p;if(seen.has(key))return false;seen.add(key);return true}).slice(0,lim)};
  return {core:run(FDB.core,100),off:run(FDB.off,0)}}

 const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);return c}
const dishHtml=s=>esc(s).replace(/\S+-\S+/g,m=>`<span style="white-space:nowrap">${m}</span>`);
function fsShoot(){if(FS.busy)return;if(!FS.live){$('fsCap').click();return}
 const c=fsGrab(1280);if(!c){U.toast('Камера ещё включается');return}const fl=$('fsFlash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),40);
 if(FS.mode==='bar'){decodeBar(c).then(code=>{if(code)onCode(code,c.toDataURL('image/jpeg',0.8));else U.toast('Штрих-код не виден, поднеси ближе')});return}
 const url=c.toDataURL('image/jpeg',0.85);fsStop();recognize(url,FS.mode)}
async function fsFile(e){const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;let c;try{c=await shrink(f,1280)}catch(err){U.toast('Не открыл фото');return}
 if(FS.mode==='bar'){const code=await decodeBar(c);if(code)onCode(code,c.toDataURL('image/jpeg',0.8));else U.toast('На фото не нашёл штрих-код, сними ближе и ровно');return}
 fsStop();recognize(c.toDataURL('image/jpeg',0.85),FS.mode)}
function fsBarLoop(){clearInterval(FS.timer);FS.timer=setInterval(async()=>{if(FS.dec||FS.busy||!FS.live||FS.mode!=='bar')return;const c=fsGrab(960);if(!c)return;FS.dec=true;const code=await decodeBar(c);FS.dec=false;if(code&&code===FS.lastCode&&Date.now()-FS.lastAt<3000)return;if(code&&FS.live&&FS.mode==='bar'&&!FS.busy){if(navigator.vibrate)navigator.vibrate(40);onCode(code,c.toDataURL('image/jpeg',0.8))}},350)}
let ZXP=null;function loadZX(){return ZXP||(ZXP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/zxing-0.21.3.min.js';s.onload=()=>{if(window.ZXing)res(window.ZXing);else{ZXP=null;s.remove();rej(new Error('zxing'))}};s.onerror=()=>{ZXP=null;s.remove();rej(new Error('zxing'))};document.head.appendChild(s)}))}
async function decodeBar(c){
 if('BarcodeDetector' in window&&!FS.noBD){try{FS.bd=FS.bd||new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});const r=await FS.bd.detect(c);return r&&r.length?r[0].rawValue:null}catch(e){FS.noBD=true}}
 try{const Z=await loadZX();if(!FS.zr){FS.zh=new Map();FS.zh.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);FS.zh.set(Z.DecodeHintType.TRY_HARDER,true);FS.zr=new Z.MultiFormatReader()}
  return FS.zr.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))),FS.zh).getText()}catch(e){return null}}
async function offByCode(code){const u='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_ru,brands,nutriments,product_quantity,image_front_url,image_front_small_url';
 for(let t=0;t<2;t++){try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),12000);const r=await fetch(u,{signal:ac.signal});clearTimeout(tm);if(r.status===404)return null;if(r.ok){const j=await r.json();return j.product||null}}catch(e){}}throw new Error('off')}
function fsResult(o){FS.tok++;const now=new Date();R=Object.assign({dish:'',comps:[],q:1,meal:mealNow(now),time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),thumb:'',note:''},o);
 $('fsCam').classList.remove('show');$('fsRes').classList.add('show');$('frPh').style.backgroundImage=R.img?`url('${R.img}')`:'none';$('frSheet').scrollTop=0;
 if(R.img&&R.img.startsWith('data:')){const r0=R;thumbOf(R.img).then(t=>{if(!r0.thumb)r0.thumb=t})}return FS.tok}
function fsBusy(txt,sub){$('fsRes').classList.add('busy');$('frBody').innerHTML=`<div class="fr-busy"><span class="fr-sp"></span><div>${esc(txt)}<br><em>${esc(sub||'обычно 3-6 секунд')}</em></div></div><div class="fr-sk" style="width:72%;height:24px"></div><div class="fr-sk" style="height:78px;border-radius:20px"></div><div class="fr-mt">${'<div class="fr-sk" style="height:84px;border-radius:16px;margin:0"></div>'.repeat(3)}</div><div class="fr-sk" style="height:46px;border-radius:16px;margin-top:22px"></div><div class="fr-sk" style="height:46px;border-radius:16px"></div>`;
 $('frBot').innerHTML=(R&&R.kind==='bar'?`<button class="ghost" disabled>${I.barcode} Другой код</button>`:`<button class="ghost" disabled>${I.spark} Исправить</button>`)+`<button class="btn" disabled>Добавить</button>`}
function fsFail(msg,lab){FS.busy=false;$('fsRes').classList.remove('busy');$('frBody').innerHTML=`<div class="fr-fail"><b>Не получилось</b><span>${esc(msg)}</span></div>`;
 $('frBot').innerHTML=lab?`<button class="ghost" id="fbA">${I.label} Снять этикетку</button><button class="btn" id="fbB">Вписать руками</button>`:`<button class="ghost" id="fbA">${I.camera} Переснять</button><button class="btn" id="fbB">Вписать руками</button>`;
 $('fbA').onclick=()=>{if(lab)FS.mode='lab';fsRetake()};$('fbB').onclick=()=>{fsClose();sheetAdd()}}
function fsRetake(){FS.tok++;FS.busy=false;FS.lastAt=Date.now();R=null;U.closeSheet();$('fsRes').classList.remove('show','busy');$('fsCam').classList.add('show');fsMode(FS.mode);fsStart()}
async function onCode(code,frame){if(FS.busy)return;FS.busy=true;FS.lastCode=code;FS.lastAt=Date.now();fsStop();const tok=fsResult({kind:'bar',img:frame,code});fsBusy('Ищу продукт по штрих-коду','код '+code);
 let p=null,err=false;const loc=await fdbLoad().then(()=>FDB.byCode.get(code)).catch(()=>null);
 if(loc)p={product_name:loc.n,brands:loc.br,product_quantity:loc.q,nutriments:{'energy-kcal_100g':loc.kcal,proteins_100g:loc.p,fat_100g:loc.f,carbohydrates_100g:loc.c}};else{try{p=await offByCode(code)}catch(e){err=true}}if(tok!==FS.tok)return;FS.busy=false;
 const n=(p&&p.nutriments)||{};const kcal=p?(+n['energy-kcal_100g']||Math.round((+n['energy_100g']||0)/4.184)):0;
 if(!p||!kcal){fsFail(err?'Открытая база продуктов не ответила. Попробуй ещё раз или сними этикетку':'Код '+code+' не нашёлся в открытой базе. Сними этикетку, приложение прочитает цифры с неё',true);return}
 const name=(p.product_name_ru||p.product_name||'Продукт').trim(),brand=(p.brands||'').split(',')[0].trim();let g=+p.product_quantity||0;if(!(g>0&&g<=500))g=100;
 R.dish=brand&&!name.toLowerCase().includes(brand.toLowerCase())?name+', '+brand:name;
 R.comps=[{n:name,g,kcal:Math.round(kcal),p:+(+n['proteins_100g']||0).toFixed(1),f:+(+n['fat_100g']||0).toFixed(1),c:+(+n['carbohydrates_100g']||0).toFixed(1)}];
 if(p.image_front_url){const r0=R,im=new Image();im.onload=()=>{if(R===r0)$('frPh').style.backgroundImage=`url('${esc(p.image_front_url)}')`};im.src=p.image_front_url;R.thumb=p.image_front_small_url||p.image_front_url}
 $('fsRes').classList.remove('busy');fsDraw()}
async function recognize(url,mode,fix){const tok=fix?FS.tok:fsResult({kind:mode,img:url});FS.busy=true;
 fsBusy(fix?'Пересчитываю по твоим словам':mode==='lab'?'Читаю этикетку':'Распознаю блюдо');
 const body={code:foodCode(),client:(D.C&&D.C.name)||'client',image:url,mode:mode==='lab'?'label':'dish'};
 if(fix){body.fix=fix;body.prev={dish:R.dish,components:R.comps.map(c=>({name:c.n,grams:Math.round(c.g),kcal100:c.kcal,p100:c.p,f100:c.f,c100:c.c}))}}
 let r=null,j={};try{r=await fetch(FOOD_AI_URL+'/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});j=await r.json().catch(()=>({}))}catch(e){r=null}
 if(tok!==FS.tok)return;FS.busy=false;
 if(r&&r.status===403){D.store.set('access:code','');fsFail('Кодовое слово не подошло, его даёт тренер');askCode(()=>{if(fix)fsDraw();recognize(url,mode,fix)});return}
 if(r&&r.ok&&j.components&&(fix||mode==='lab')&&j.api!==2){const msg=fix?'Исправление словами включится после обновления сервера. Пока поправь граммы нажатием на цифру':'Чтение этикетки включится после обновления сервера. Пока сними штрих-код или впиши руками';if(fix){U.toast(msg);$('fsRes').classList.remove('busy');fsDraw()}else fsFail(msg);return}
 if(!r||!r.ok||!j.components){const msg=!r?'Нет связи с распознаванием. Проверь интернет и попробуй ещё раз':(j.message||'Распознавание недоступно');if(fix){U.toast(msg);$('fsRes').classList.remove('busy');fsDraw()}else fsFail(msg);return}
 R.dish=j.dish;R.comps=j.components.map(c=>({n:c.name,g:c.grams,kcal:c.kcal100,p:c.p100,f:c.f100,c:c.c100}));R.note=j.note||'';$('fsRes').classList.remove('busy');fsDraw();if(fix)U.toast('Пересчитал по твоим словам')}
function frTot(){return R.comps.reduce((a,c)=>{const k=c.g*R.q/100;a.kcal+=c.kcal*k;a.p+=c.p*k;a.f+=c.f*k;a.c+=c.c*k;a.g+=c.g*R.q;return a},{kcal:0,p:0,f:0,c:0,g:0})}
function fsDraw(){const t=frTot(),kc=Math.round(t.kcal),C=150.8;
 const tile=(n,ic,v,m)=>`<div class="m"><div class="h"><i>${ic}</i>${n}</div><b>${Math.round(v)}<small> / ${m} г</small></b><div class="bar"><i style="width:${Math.min(100,v/m*100).toFixed(0)}%"></i></div></div>`;
 $('frBody').innerHTML=`<div class="fr-r1"><button class="fr-meal" id="frMeal">${I.clock}${esc(R.meal)} · ${R.time}${I.down}</button><div class="fr-step"><button data-st="-1" aria-label="Меньше">${I.minus}</button><b>${String(R.q).replace('.',',')}</b><button data-st="1" aria-label="Больше">${I.plus}</button></div></div>
 <h3 class="fr-dish">${dishHtml(R.dish)}</h3>
 <div class="fr-kc"><div class="fi">${I.flame}</div><div class="t"><span>Калории</span><b>${kc.toLocaleString('ru')}<small>ккал</small></b></div><div><div class="fr-ring"><svg viewBox="0 0 58 58"><defs><linearGradient id="frg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)"/></linearGradient></defs><circle cx="29" cy="29" r="24" fill="none" stroke="var(--track)" stroke-width="6"/>${kc>0?`<circle cx="29" cy="29" r="24" fill="none" stroke="url(#frg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(Math.min(1,kc/norm.kcal)*C).toFixed(2)} 999"/>`:''}</svg><div>${Math.round(kc/norm.kcal*100)}%</div></div><div class="of">нормы дня</div></div></div>
 <div class="fr-mt">${tile('Белки',I.meat,t.p,norm.p)}${tile('Жиры',I.drop,t.f,norm.f)}${tile('Углеводы',I.wheat,t.c,norm.c)}</div>
 <div class="fr-sec"><b>Состав</b><button id="frAddPart">${I.plus}Добавить часть</button></div>
 ${R.comps.map((c,i)=>`<button class="fr-ing" data-ing="${i}"><div class="t">${esc(c.n)} <span>· ${Math.round(c.kcal*c.g*R.q/100)} ккал</span></div><div class="g">${Math.round(c.g*R.q)} г</div></button>`).join('')}
 <div class="note" style="margin-top:6px">${!R.comps.length?'Состав пуст: добавь часть или переснимай':R.kind==='bar'?'КБЖУ из открытой базы по штрих-коду. Поставь свои граммы: нажми на цифру':R.kind==='lab'?'КБЖУ с этикетки. Поставь свои граммы: нажми на цифру':'Граммы по фото примерные. Нажми на цифру, чтобы поставить свои'}</div>`;
 $('frBot').innerHTML=(R.kind==='bar'?`<button class="ghost" id="frFix">${I.barcode} Другой код</button>`:`<button class="ghost" id="frFix">${I.spark} Исправить</button>`)+`<button class="btn" id="frAdd"${R.comps.length?'':' disabled'}>Добавить</button>`;
 $('frMeal').onclick=fsMealSheet;$('frAddPart').onclick=()=>sheetAdd(p=>gramsSheet({n:p.n,g:100,kcal:p.kcal,p:p.p,f:p.f,c:p.c},-1));
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{R.q=Math.max(0.5,Math.min(10,R.q+(+b.dataset.st)*0.5));fsDraw()});
 document.querySelectorAll('[data-ing]').forEach(b=>b.onclick=()=>gramsSheet(R.comps[+b.dataset.ing],+b.dataset.ing));
 $('frFix').onclick=R.kind==='bar'?fsRetake:fixSheet;$('frAdd').onclick=fsAdd}
function gramsSheet(c,idx){let g=Math.round(c.g*R.q)||100;const draw=()=>{const k=g/100;const s=U.openSheet(`<h3>${esc(c.n)}</h3><p>на 100 г: ${c.kcal} ккал · Б ${String(c.p).replace('.',',')} Ж ${String(c.f).replace('.',',')} У ${String(c.c).replace('.',',')}</p><div class="port">${[50,100,150,200,300].map(x=>`<button class="chip ${x===g?'on':''}" data-g="${x}">${x} г</button>`).join('')}</div><input class="in" id="gIn" inputmode="numeric" value="${g}" style="font-size:16px"><div class="res"><b>${Math.round(c.kcal*k)} ккал</b><span>Б ${Math.round(c.p*k)} · Ж ${Math.round(c.f*k)} · У ${Math.round(c.c*k)}</span></div><div class="row2">${idx>=0?'<button class="ghost" id="gDel">Убрать из состава</button>':'<button class="ghost" data-close>Отмена</button>'}<button class="btn" id="gOk">${idx>=0?'Готово':'Добавить'}</button></div>`);
  s.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=+b.dataset.g;draw()});
  s.querySelector('#gIn').oninput=e=>{g=Math.max(0,parseInt(e.target.value,10)||0);s.querySelector('.res b').textContent=Math.round(c.kcal*g/100)+' ккал';s.querySelector('.res span').textContent=`Б ${Math.round(c.p*g/100)} · Ж ${Math.round(c.f*g/100)} · У ${Math.round(c.c*g/100)}`};
  if(idx>=0)s.querySelector('#gDel').onclick=()=>{R.comps.splice(idx,1);U.closeSheet();fsDraw()};
  s.querySelector('#gOk').onclick=()=>{if(!g){U.toast('Впиши граммы');return}if(idx>=0)R.comps[idx].g=g/R.q;else R.comps.push(Object.assign({},c,{g:g/R.q}));U.closeSheet();fsDraw()}};draw()}
function fixSheet(){const s=U.openSheet(`<h3>Что исправить?</h3><p>Напиши словами, приложение пересчитает. Граммы одной части проще поправить нажатием на цифру</p><textarea class="fx" id="fxT" placeholder="Например: это индейка, а не курица. Картошки около 250 г. Салат без масла"></textarea><div class="row2"><button class="ghost" data-close>Отмена</button><button class="btn" id="fxGo">${I.spark} Пересчитать</button></div>`);
 const ta=s.querySelector('#fxT');setTimeout(()=>ta.focus(),260);
 s.querySelector('#fxGo').onclick=()=>{const v=ta.value.trim();if(!v){ta.focus();return}R.comps.forEach(c=>c.g=c.g*R.q);R.q=1;U.closeSheet();recognize(R.img,R.kind,v)}}
function fsMealSheet(){const s=U.openSheet(`<h3>Приём пищи</h3>${['Завтрак','Обед','Ужин','Перекус'].map(m=>`<div class="opt ${m===R.meal?'sel':''}" data-m="${m}"><div class="t"><b>${m}</b></div>${m===R.meal?I.check:''}</div>`).join('')}`);s.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{R.meal=b.dataset.m;U.closeSheet();fsDraw()})}
function fsAdd(){const t=frTot(),flag=R.kind==='bar'?{bar:true}:R.kind==='lab'?{lab:true}:{photo:true};
 added.push(Object.assign({n:R.dish,g:Math.round(t.g),kcal:Math.round(t.kcal),p:Math.round(t.p),f:Math.round(t.f),c:Math.round(t.c),meal:R.meal,time:R.time,thumb:R.thumb||''},flag));D.store.set('food:'+D.TODAY,added);fsClose();render();U.toast('Добавлено: '+Math.round(t.kcal)+' ккал')}
function fsHelp(){U.openSheet(`<h3>Как снимать</h3><div class="opt" style="cursor:default"><div class="ico">${I.dish}</div><div class="t"><b>Блюдо</b><span>Сверху, тарелка целиком в рамке, при дневном свете. Суп и смешанные блюда считаются по обычному рецепту, точность ниже</span></div></div><div class="opt" style="cursor:default"><div class="ico">${I.barcode}</div><div class="t"><b>Штрих-код</b><span>Наведи камеру на код, он считается сам. Продукт ищется в открытой базе. Не нашёлся, сними этикетку</span></div></div><div class="opt" style="cursor:default"><div class="ico">${I.label}</div><div class="t"><b>Этикетка</b><span>Сними таблицу «Пищевая ценность» ровно и близко, чтобы цифры читались</span></div></div><p style="margin-top:4px">Граммы по фото примерные, свои всегда точнее. На следующем экране их можно поправить</p>${FS.err==='denied'?'<p>Камера для этого сайта выключена. Включить: настройки сайта в Safari, пункт «Камера», «Разрешить». Пока можно снимать круглой кнопкой, откроется камера телефона</p>':''}<div class="row2"><button class="btn" data-close>Понятно</button></div>`)}
function sheetNorm(){U.openSheet(`<h3>Твоя норма</h3>${D.NORMS.slice().reverse().map(n=>`<div class="opt"><div class="t"><b>${n.kcal.toLocaleString('ru')} ккал · Б ${n.p} Ж ${n.f} У ${n.c}</b><span>с ${D.fmtD(n.from)} · ${n.why}</span></div></div>`).join('')}<div class="row2"><a class="ghost" href="baza.html">Урок: откуда цифры</a><button class="btn" data-close>Понятно</button></div>`)}
render();if(location.hash==='#add')sheetAdd();if(location.hash==='#photo')openScanner();
</script>
</body></html>
