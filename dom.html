<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791107724"><script src="phases.js?v=1791107724"></script><script src="data.js?v=1791107724"></script><script src="ui.js?v=1791107724"></script><title>Дом</title></head><body>
<style>
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--acc2);border:1px solid var(--line)}
.hello{flex:1;min-width:0}.hello b{display:block;font-size:19px;font-weight:800}.hello span{color:var(--muted);font-size:13px}
.streak{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--acc2);white-space:nowrap}
.streak svg{width:14px;height:14px}
.hero h3{margin:0;font-size:21px;font-weight:800;line-height:1.15}.hero p{margin:6px 0 14px;color:var(--muted);font-size:13px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{background:var(--chip);border-radius:14px;padding:10px 8px 8px;text-align:center}.m b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.m span{font-size:11px;color:var(--muted)}
.ck{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:16px;padding:10px 12px}
.ck .t{flex:1;min-width:0}.ck .t b{display:block;font-size:14px}.ck .t span{font-size:12px;color:var(--muted)}
.ck input{width:74px;height:36px;border-radius:10px;border:1.5px solid transparent;background:var(--card);color:var(--text);font:inherit;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.ck input:focus{outline:none;border-color:var(--acc)}
.kb{display:flex;gap:12px;align-items:center;background:radial-gradient(120% 120% at 0% 100%,rgba(246,179,67,.18),transparent 60%),var(--card);border-radius:20px;padding:14px;color:var(--text);text-decoration:none;margin-bottom:12px;border:1px solid rgba(255,255,255,.03)}
.kb .t{flex:1;min-width:0}.kb .t b{display:block;font-size:15px}.kb .t span{font-size:12px;color:var(--muted)}
.rep{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
.rep .t{flex:1;min-width:0}.rep .t b{display:block}.rep .t span{color:var(--muted);font-size:12px}
</style>
<div class="phone"><div class="scroll" id="root"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2652A"/><stop offset="1" stop-color="#F6B343"/></linearGradient></defs></svg><nav class="nav"><a class="on" href="dom.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>Дом</a><a href="tren.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>Тренировки</a><a href="pit.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12zm0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3" /></svg>Питание</a><a href="prog.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>Прогресс</a><a href="otchet.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>Отчёт</a></nav></div>
<script>
const D=window.DATA,U=window.UI;const I={bell:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>`,play:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg>`,plus:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>`,check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,moon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" /></svg>`,walk:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M13 4m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M7 21l3 -4" /><path d="M16 21l-2 -4l-3 -3l1 -6" /><path d="M6 12l2 -3l4 -1l3 3l3 1" /></svg>`,clip:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>`,chev:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6l6 6l-6 6" /></svg>`,book:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" /><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" /><path d="M3 6l0 13" /><path d="M12 6l0 13" /><path d="M21 6l0 13" /></svg>`,scale:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 20l10 0" /><path d="M6 6l6 -1l6 1" /><path d="M12 3l0 17" /><path d="M9 12l-3 -6l-3 6a3 3 0 0 0 6 0" /><path d="M21 12l-3 -6l-3 6a3 3 0 0 0 6 0" /></svg>`};
const today=D.DAYS[D.DAYS.length-1],W=D.WORKOUTS.find(w=>w.today),norm=D.normAt(D.TODAY);
const dayS=D.store.get('day:'+D.TODAY,{weight:today.weight,sleep:today.sleep,steps:today.steps,supps:today.supps.slice()});
const added=D.store.get('food:'+D.TODAY,[]);const eaten={kcal:today.food.kcal+D.sum(added.map(a=>a.kcal)),p:today.food.p+D.sum(added.map(a=>a.p)),f:today.food.f+D.sum(added.map(a=>a.f)),c:today.food.c+D.sum(added.map(a=>a.c))};
const doneToday=D.store.get('done:'+D.TODAY,null);
const lessonsN=D.LESSONS.reduce((a,c)=>a+c.items.length,0),seen=D.store.get('lessons',[]);const newest=D.LESSONS.flatMap(c=>c.items).find(l=>l.new);
function weekStrip(){const mon=D.d(D.weekOf(D.TODAY));let h='<div class="week">';for(let i=0;i<7;i++){const dt=D.iso(D.addDays(mon,i));const w=D.WORKOUTS.find(x=>x.date===dt);let cls='',ic='';
  if(dt===D.TODAY){cls='now';ic=doneToday?I.check:''}else if(dt<D.TODAY){cls='ok';ic=I.check}else if(i===6){cls='miss';ic=''}else{cls='miss'}
  if(w&&w.done){cls='ok';ic=I.play}
  h+=`<div data-day="${dt}" style="cursor:pointer">${D.RU_D[(i+1)%7]}<i class="${cls}">${ic}</i></div>`}return h+'</div>'}
function daySheet(dt){const day=D.DAYS.find(x=>x.date===dt);const w=D.WORKOUTS.find(x=>x.date===dt);const n=D.normAt(dt);
  if(!day&&!w){U.openSheet(`<h3>${D.fmtD(dt,true)}</h3><p>${dt==='2026-10-04'?'День отчёта: завтра заполняешь отчёт недели, половина соберётся сама':'Ещё не наступил'}</p><div class="row2">${dt==='2026-10-04'?'<a class="btn" href="otchet.html">Открыть отчёт</a>':''}<button class="ghost" data-close>Закрыть</button></div>`);return}
  const food=dt===D.TODAY?eaten:day.food;const dv=dt===D.TODAY?dayS:day;
  U.openSheet(`<h3>${D.fmtD(dt,true)}</h3><p>${dt===D.TODAY?'сегодня':'что было в этот день'}</p>
  <div class="stats"><div class="stat"><b>${dv.weight}</b><span>кг утром</span></div><div class="stat"><b>${dv.sleep}</b><span>ч сна</span></div><div class="stat"><b>${(+dv.steps).toLocaleString('ru')}</b><span>шагов</span></div></div>
  ${w?`<div class="opt" onclick="location.href='tren-den.html?${w.done?'date='+w.date:'d='+w.day}'"><div class="ico">${I.play}</div><div class="t"><b>${w.title}</b><span>${w.done?w.ton.toLocaleString('ru')+' кг · '+w.mins+' мин · оценка '+w.rating+'/10':'сегодня, ещё не начата'}</span></div><span class="muted">${I.chev}</span></div>`:'<div class="note" style="text-align:left">Тренировки не было, день отдыха</div>'}
  <div class="opt" onclick="location.href='pit.html'"><div class="t"><b>${food.kcal.toLocaleString('ru')} ккал · норма ${n.kcal.toLocaleString('ru')}</b><span>Б ${food.p} · Ж ${food.f} · У ${food.c}</span></div><span class="muted">${I.chev}</span></div>
  <div class="row2"><button class="ghost" data-close>Закрыть</button></div>`)}
function render(){const r=document.getElementById('root');const pct=Math.min(1,eaten.kcal/norm.kcal);
r.innerHTML=`<div class="top"><div class="avatar">${D.C.initial}</div><div class="hello"><b>Привет, ${D.C.name}</b><span>${D.fmtD(D.TODAY,true)} · неделя 3 из 4 · 7-я неделя ведения</span></div></div>
${weekStrip()}
<h2>Тренировка дня</h2>
<div class="card hero"><div class="eyebrow">Фаза 12 · Интенсификация · День ${W.day}</div><h3>${W.title}</h3><p>${W.ex.length} упражнений · темп ${W.ex[0].target.tempo} · RIR ${W.ex[0].target.rir}</p>
${doneToday?`<div class="pb">${I.check} Выполнена · ${doneToday.mins} мин · ${doneToday.ton} кг · оценка ${doneToday.rating}/10</div>`:`<a class="btn" href="tren-den.html?d=${W.day}">${I.play} Начать тренировку</a>`}</div>
<h2>Питание сегодня</h2>
<div class="card"><div class="row"><div class="big">${eaten.kcal.toLocaleString('ru')} <small>/ ${norm.kcal.toLocaleString('ru')} ккал</small></div><a class="ghost" href="pit.html#add">${I.plus} Еда</a></div>
<div class="bar"><i style="width:${pct*100}%"></i></div>
<div class="macros">${[['Белки',eaten.p,norm.p],['Жиры',eaten.f,norm.f],['Углеводы',eaten.c,norm.c]].map(([n,v,t])=>`<div class="m"><b>${v} <span>/ ${t}</span></b><span>${n}, г</span><div class="minibar"><i style="width:${Math.min(100,v/t*100)}%"></i></div></div>`).join('')}</div></div>
<h2>Чек-лист дня</h2>
<div class="card list">
 <div class="ck"><div class="ico">${I.scale}</div><div class="t"><b>Вес утром</b><span>вчера ${D.DAYS[D.DAYS.length-2].weight} кг</span></div><input inputmode="decimal" id="wIn" value="${dayS.weight}"><span class="muted" style="font-size:12px">кг</span></div>
 <div class="ck"><div class="ico">${I.moon}</div><div class="t"><b>Сон</b><span>цель 7-8 часов</span></div><input inputmode="decimal" id="sIn" value="${dayS.sleep}"><span class="muted" style="font-size:12px">ч</span></div>
 <div class="ck"><div class="ico">${I.walk}</div><div class="t"><b>Шаги</b><span>цель 10 000</span><div class="minibar"><i style="width:${Math.min(100,dayS.steps/100)}%"></i></div></div><input inputmode="numeric" id="stIn" value="${dayS.steps}"></div>
</div>
<div class="card rep" onclick="location.href='otchet.html'"><div class="ico">${I.clip}</div><div class="t"><b>Отчёт недели: завтра</b><span>вес внесён 6 из 7 дней · 2 видео подходов · прошлый разбор получен</span></div><span class="muted">${I.chev}</span></div>
<a class="kb" href="baza.html"><div class="ico">${I.book}</div><div class="t"><b>База знаний</b><span>${lessonsN} уроков · просмотрено ${seen.length}${newest?' · новое: «'+newest.t+'»':''}</span></div><span class="muted">${I.chev}</span></a>
<div class="note">Демо-клиент: 7 недель ведения, цифры сгенерированы для макета</div>`;
r.querySelector('#wIn').onchange=e=>{dayS.weight=e.target.value;save('Вес записан')};r.querySelector('#sIn').onchange=e=>{dayS.sleep=e.target.value;save('Сон записан')};r.querySelector('#stIn').onchange=e=>{dayS.steps=+e.target.value||0;save('Шаги записаны');render()};
r.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>daySheet(el.dataset.day))}
function save(t){D.store.set('day:'+D.TODAY,dayS);U.toast(t)}
render();
</script>
</body></html>
