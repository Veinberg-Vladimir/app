<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E0F1A"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="app.css?v=1791306966"><script src="phases.js?v=1791306966"></script><script src="data.js?v=1791306966"></script><script src="ui.js?v=1791306966"></script><title>Тренировка</title></head><body>
<style>
.timer{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}.timer svg{color:var(--acc);width:20px;height:20px}
.dayt{font-size:12px;color:var(--acc2);font-weight:700}.dayh{font-size:21px;font-weight:800;margin:2px 0 4px}
.hint{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin:8px 0 14px}.hint svg{width:14px;height:14px}
.ex{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.03)}.ex.open{border-color:rgba(242,101,42,.35)}.ex.alldone{border-color:rgba(47,191,113,.35)}
.exh{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.exh .t{flex:1;min-width:0}.exh .t b{display:block;font-size:15px;font-weight:700;line-height:1.2}.exh .t .sub{font-size:12px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.acts .chip{padding:6px 10px;font-size:12px}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}.meta b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.tempo{display:inline-flex;gap:3px;align-items:center}.tempo i{font-style:normal;background:var(--chip2);border-radius:6px;padding:2px 6px;color:var(--text);font-weight:700;font-size:12px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.sh{display:grid;grid-template-columns:22px minmax(0,1fr) 62px 62px 36px;gap:6px;font-size:10px;color:var(--muted);padding:0 5.5px 0 9.5px;text-transform:uppercase;letter-spacing:.03em}.sh span:nth-child(3),.sh span:nth-child(4){text-align:center}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 62px 62px 36px;gap:6px;align-items:center;background:var(--chip2);border-radius:14px;padding:6px 4px 6px 8px;transition:background .2s,border-color .2s;border:1.5px solid transparent;min-height:50px}
.set .n{font-weight:800;color:var(--muted)}.set .goal b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}.set .goal span{font-size:10.5px;color:var(--muted);display:block;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.set input{width:100%;height:38px;border-radius:10px;border:1.5px solid transparent;background:var(--card);color:var(--text);font:inherit;font-weight:800;font-size:16px;text-align:center;font-variant-numeric:tabular-nums;padding:0}
.set input::placeholder{color:#4A4B58;font-weight:600}.set input:focus{outline:none;border-color:var(--acc)}
.set .ok{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--acc2);display:grid;place-items:center;cursor:pointer;padding:0;transition:all .2s}.set .ok svg{width:16px;height:16px}
.set.fill{background:rgba(47,191,113,.08);border-color:rgba(47,191,113,.45)}.set.fill .ok{background:#2FBF71;border-color:#2FBF71;color:#06120B;box-shadow:0 0 0 4px rgba(47,191,113,.18)}.set.fill input{background:transparent;color:#5BE49B}
.set.pb .goal b{color:var(--acc2)}.set .goal b svg{width:12px;height:12px;color:var(--acc2);vertical-align:-1px;margin-left:2px}
.vid{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--acc2);font-weight:700;margin-top:8px;cursor:pointer}.vid svg{width:16px;height:16px}.vid.ok{color:#5BE49B}
.vol{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px}
.rest{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin:-4px 0 12px;border:1px solid rgba(242,101,42,.35)}.rest .lbl{font-weight:700;font-size:13px}.rest .cnt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:20px;color:var(--acc2)}.rest .skip{background:none;border:0;color:var(--muted);padding:4px;cursor:pointer}.rest .skip svg{width:18px;height:18px}
.restbar{height:3px;background:var(--chip2);border-radius:9px;margin:-8px 0 12px;overflow:hidden}.restbar i{display:block;height:100%;background:var(--grad)}
.super{border:1px dashed rgba(246,179,67,.5)}.super .sup{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--acc2);font-weight:700;margin-bottom:10px}.super .sup span{color:var(--muted);font-weight:500}.super .ex{background:var(--chip);margin:0;border:0;padding:12px}.super .ex+.ex{margin-top:8px}
.link{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:11px;margin:4px 0}.link i{display:block;width:2px;height:14px;background:var(--acc2);border-radius:2px}
.finish{display:block;text-align:center;margin:6px 0 0;width:100%}
.banner{display:flex;align-items:center;gap:10px;background:rgba(47,191,113,.1);border:1px solid rgba(47,191,113,.4);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}.banner svg{width:18px;height:18px;color:#5BE49B}
.banner.plan{background:rgba(246,179,67,.08);border-color:rgba(246,179,67,.4)}.banner.plan svg{color:var(--acc2)}
</style>
<div class="phone"><div class="scroll" id="root"></div><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2652A"/><stop offset="1" stop-color="#F6B343"/></linearGradient></defs></svg><nav class="nav"><a href="dom.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>Дом</a><a class="on" href="tren.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M2 12h1" /><path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2" /><path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M9 12h6" /><path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1z" /><path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2" /><path d="M22 12h-1" /></svg>Тренировки</a><a href="pit.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12zm0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3" /></svg>Питание</a><a href="prog.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>Прогресс</a><a href="otchet.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 14l2 2l4 -4" /></svg>Отчёт</a></nav></div>
<script>
const D=window.DATA,U=window.UI;
const I={check:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>`,play:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg>`,swap:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M16 3l4 4l-4 4" /><path d="M10 7l10 0" /><path d="M8 13l-4 4l4 4" /><path d="M4 17l9 0" /></svg>`,notes:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 3m0 2a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z" /><path d="M9 7l6 0" /><path d="M9 11l6 0" /><path d="M9 15l4 0" /></svg>`,video:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z" /><path d="M3 6m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z" /></svg>`,skip:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 5v14l12 -7z" /><path d="M20 5l0 14" /></svg>`,stop:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 13a7 7 0 1 0 14 0a7 7 0 0 0 -14 0z" /><path d="M14.5 10.5l-2.5 2.5" /><path d="M17 8l1 -1" /><path d="M14 3h-4" /></svg>`,photo:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 8h.01" /><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z" /><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5" /><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3" /></svg>`,trophy:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 21l8 0" /><path d="M12 17l0 4" /><path d="M7 4l10 0" /><path d="M17 4v8a5 5 0 0 1 -10 0v-8" /><path d="M5 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M19 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /></svg>`,x:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>`,cal:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z" /><path d="M16 3v4" /><path d="M8 3v4" /><path d="M4 11h16" /><path d="M11 15h1" /><path d="M12 15v3" /></svg>`,back:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>`,dots:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M19 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg>`,pause:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" ><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z" /><path d="M17 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z" /></svg>`};
const q=new URLSearchParams(location.search);const dateQ=q.get('date');const dQ=+q.get('d')||2;
const W=dateQ?D.WORKOUTS.find(w=>w.date===dateQ):D.WORKOUTS.find(w=>w.phase==='12'&&w.week===3&&w.day===dQ);
const MODE=W.done?'view':(W.today?'live':'plan');
const parseReps=(r,i)=>{r=String(r);if(r.includes(','))return r.split(',')[i]||r.split(',').slice(-1)[0];return r};
const EX=W.ex.map((e,idx)=>{const hist=D.exHistory(e.name).filter(h=>h.date<W.date);const prev=hist.length?hist[hist.length-1]:null;const best=hist.length?Math.max(...hist.map(h=>h.best)):0;const byReps={};hist.forEach(h=>h.sets.forEach(x=>{byReps[x.reps]=Math.max(byReps[x.reps]||0,x.kg)}));const sup=/^[A-Z]\d$/.test(e.code)?e.code[0]:null;
  return {id:e.code,idx,name:e.name,sets:e.target.sets,reps:e.target.reps,tempo:e.target.tempo,rir:e.target.rir,prev,best,byReps,sup,rest:[e.target.rest,e.target.rest+30],muscle:D.EX_ALL.find(x=>D.normKey(x.name)===D.normKey(e.name)).muscle,logged:e.sets}});
EX.forEach(e=>{if(e.sup&&EX.filter(x=>x.sup===e.sup).length<2)e.sup=null});
const KEY='wo:'+W.date;
let S=D.store.get(KEY,{});S.sets=S.sets||{};S.swap=S.swap||{};S.notes=S.notes||{};S.video=S.video||{};S.open=S.open||EX[0].id;S.start=S.start||Date.now();S.restSel=S.restSel||{};
function save(){D.store.set(KEY,S)}
function setsOf(e){if(!S.sets[e.id])S.sets[e.id]=MODE==='view'?e.logged.map(s=>({kg:String(s.kg),reps:String(s.reps),done:true})):Array.from({length:e.sets},()=>({kg:'',reps:'',done:false,rested:false}));return S.sets[e.id]}
const nameOf=e=>S.swap[e.id]?S.swap[e.id].name:e.name;
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const tempoHtml=t=>'<span class="tempo">'+String(t).split('').map(c=>'<i>'+c+'</i>').join('')+'</span>';
const RO=MODE==='view';
function isPb(e,s){if(!s.done||!(+s.kg>0)||!(+s.reps>0))return false;const prevBest=e.byReps[+s.reps];return prevBest!=null&&+s.kg>prevBest}
function exHtml(e){const open=S.open===e.id,sets=setsOf(e),all=sets.every(s=>s.done),n=sets.filter(s=>s.done).length;
  let h=`<div class="ex ${open?'open':''} ${all?'alldone':''}" id="ex-${e.id}"><div class="exh" data-open="${e.id}"><div class="thumb" data-video="${e.id}">${I.play}</div><div class="t"><b>${e.id} · ${nameOf(e)}${S.swap[e.id]?'<span class="badge">замена</span>':''}</b><div class="sub">${e.sets} × ${e.reps}${e.rir?' · RIR '+e.rir:''}${open?'':' · '+n+' из '+e.sets+' сделано'}</div></div>${all?'<div class="done">'+I.check+'</div>':'<div class="todo"></div>'}</div>`;
  if(open){h+=`<div class="acts">${RO?'':`<button class="chip" data-swap="${e.id}">${I.swap} Замена</button>`}<button class="chip" data-tech="${e.id}">${I.notes} Техника</button><a class="chip" href="prog-upr.html?ex=${encodeURIComponent(e.name)}">${I.trophy} История</a></div>
   <div class="meta"><span>Темп ${tempoHtml(e.tempo)}</span><span>${e.rir?'RIR <b>'+e.rir+'</b> · ':''}отдых <b>${e.rest[0]} с</b></span></div>
   <div class="sets"><div class="sh"><span>№</span><span>Цель</span><span>кг</span><span>повт</span><span></span></div>`;
   sets.forEach((s,i)=>{const pb=isPb(e,s);h+=`<div class="set ${s.done?'fill':''} ${pb?'pb':''}" id="set-${e.id}-${i}"><span class="n">${i+1}</span><span class="goal"><b>${parseReps(e.reps,i)}${pb?' '+I.trophy:''}</b><span>${e.prev&&e.prev.sets[i]?'было '+String(e.prev.sets[i].kg).replace('.',',')+' кг × '+e.prev.sets[i].reps+' повт':e.prev?'было: подхода не было':'первый раз'}</span></span><input inputmode="decimal" placeholder="кг" value="${s.kg}" data-kg="${e.id}:${i}" ${RO?'readonly':''}><input inputmode="numeric" placeholder="повт" value="${s.reps}" data-reps="${e.id}:${i}" ${RO?'readonly':''}><button class="ok" data-ok="${e.id}:${i}" aria-label="Подход">${I.check}</button></div>`});
   const vol=sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);
   h+=`</div><div class="vol"><span>Объём <b style="color:#fff" id="vol-${e.id}">${vol.toLocaleString('ru')} кг</b></span><span>${e.prev?'прошлый раз '+e.prev.vol.toLocaleString('ru')+' кг':''}</span></div>`;
   if(!RO&&!D.C.vip)h+=`<div class="vid" style="color:var(--muted)">${I.video} Видео подходов тренеру: на тарифе VIP</div>`;
   if(!RO&&D.C.vip)h+=`<label class="vid ${S.video[e.id]?'ok':''}">${S.video[e.id]?I.check+' Видео последнего подхода записано':I.video+' Снять видео последнего рабочего подхода'}<input type="file" accept="video/*" capture="environment" hidden data-vfile="${e.id}"></label>`;
   else h+=`<div class="vid ok">${I.check} Видео последнего подхода отправлено тренеру</div>`}
  return h+'</div>'}
function render(){const r=document.getElementById('root');let list='';let i=0;
  while(i<EX.length){const e=EX[i];if(e.sup){const pair=EX.filter(x=>x.sup===e.sup);list+=`<div class="ex super"><div class="sup">Суперсет ${pair.map(p=>p.id).join(' + ')} <span>· отдых ${pair[0].rest[0]} с после первого, ${pair[1].rest[0]} с после второго</span></div>${pair.map((p,k)=>exHtml(p)+(k<pair.length-1?`<div class="link"><i></i> отдых ${p.rest[0]} с, потом ${pair[k+1].id}</div>`:'')).join('')}</div>`;i+=pair.length}else{list+=exHtml(e);i++}}
  const banner=MODE==='view'?`<div class="banner">${I.check} Выполнена ${D.fmtDD(W.date)} · ${W.mins} мин · ${W.ton.toLocaleString('ru')} кг · оценка ${W.rating}/10</div>`:MODE==='plan'?`<div class="banner plan">${I.cal} Запланирована на ${D.fmtDD(W.date)}. Можно посмотреть и заполнить заранее</div>`:'';
  const fin=D.store.get('done:'+W.date,null);
  r.innerHTML=`<div class="hdr"><a href="tren.html">${I.back}</a><div class="timer">${MODE==='live'?I.pause:''} <span id="clock">${MODE==='view'?fmt(W.mins*60):'00:00'}</span></div>${RO?'<span style="width:30px"></span>':`<button id="menuBtn" aria-label="Меню">${I.dots}</button>`}</div>
  <div class="dayt">Фаза ${W.phase} · ${W.phaseName.split(' (')[0]} · неделя ${W.week} из 4</div><div class="dayh">${W.title}</div>
  ${banner}${RO?'':`<div class="hint">${I.swap} Впиши кг и повторы, галочка загорится зелёным. «Замена» подберёт похожее</div>`}
  <div id="list">${list}</div>
  ${RO?'':fin?`<div class="pb">${I.check} Тренировка сохранена · ${fin.ton} кг · оценка ${fin.rating}/10</div>`:`<button class="ghost finish" id="finishBtn">Завершить тренировку</button>`}
  <div class="note">${RO?'Выполненная тренировка из истории':'Прототип: всё нажимается, данные хранятся в этом телефоне'}</div>`;
  if(S.rest&&S.rest.end>Date.now()){const e=EX.find(x=>x.id===S.rest.ex);const last=e.sup?EX.filter(x=>x.sup===e.sup).slice(-1)[0]:e;const anchor=document.getElementById('ex-'+last.id);const box=anchor.closest('.super')||anchor;const sel=S.restSel[e.id]||e.rest[0];
    box.insertAdjacentHTML('afterend',`<div class="rest">${I.stop}<span class="lbl">Отдых</span><span class="chip on" style="padding:5px 10px">${e.rest[0]} с по программе</span><button class="chip" data-rest="${e.id}:${e.rest[1]}" style="padding:5px 10px">+30 с</button><span class="cnt" id="restCnt">${fmt((S.rest.end-Date.now())/1000)}</span><button class="skip" data-skiprest>${I.skip}</button></div><div class="restbar"><i id="restBar" style="width:${100*(S.rest.end-Date.now())/1000/S.rest.total}%"></i></div>`)}
  if(!RO){const m=document.getElementById('menuBtn');if(m)m.onclick=menu;const f=document.getElementById('finishBtn');if(f)f.onclick=finish}}
function startRest(e){const sel=S.restSel[e.id]||e.rest[0];S.rest={ex:e.id,end:Date.now()+sel*1000,total:sel};save();render()}
function volUpdate(e){const sets=setsOf(e);const v=sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);const el=document.getElementById('vol-'+e.id);if(el)el.textContent=v.toLocaleString('ru')+' кг'}
const root=document.getElementById('root');
root.addEventListener('click',ev=>{const t=ev.target.closest('[data-open],[data-swap],[data-tech],[data-ok],[data-rest],[data-skiprest],[data-video]');if(!t)return;
  if(t.dataset.video){ev.stopPropagation();U.openSheet(`<h3>Видео техники</h3><p>Здесь играет твоё видео упражнения</p><div class="video">${I.play}</div><div class="row2"><button class="ghost" data-close>Закрыть</button></div>`);return}
  if(t.dataset.open){S.open=S.open===t.dataset.open?null:t.dataset.open;save();render();return}
  if(t.dataset.swap){sheetSwap(EX.find(x=>x.id===t.dataset.swap));return}
  if(t.dataset.tech){sheetTech(EX.find(x=>x.id===t.dataset.tech));return}
  if(t.dataset.ok){if(RO)return;const [id,i]=t.dataset.ok.split(':');const e=EX.find(x=>x.id===id);const s=setsOf(e)[+i];
    if(s.done){s.done=false;save();render();return}
    const kg=root.querySelector(`[data-kg="${id}:${i}"]`).value.trim(),reps=root.querySelector(`[data-reps="${id}:${i}"]`).value.trim();if(!kg||!reps){U.toast('Впиши кг и повторения');return}
    markDone(e,+i,kg,reps);return}
  if(t.dataset.rest){const [id,rr]=t.dataset.rest.split(':');S.restSel[id]=+rr;S.rest={ex:id,end:Date.now()+rr*1000,total:+rr};save();render();return}
  if(t.hasAttribute('data-skiprest')){S.rest=null;save();render()}});
function markDone(e,i,kg,reps){const s=setsOf(e)[i];s.kg=kg.replace(',','.');s.reps=reps;s.done=true;save();
  const pair=e.sup?EX.filter(x=>x.sup===e.sup):null;
  if(pair&&pair[pair.length-1].id!==e.id){startRest(e);U.toast('Короткий отдых '+e.rest[0]+' с, потом '+pair[pair.indexOf(e)+1].id);return}
  if(i===e.sets-1){const nx=EX[EX.indexOf(e)+1];if(nx)S.open=nx.id}
  const nowBest=isPb(e,s);startRest(e);if(nowBest)U.toast('Рекорд в '+e.id+' на '+D.pl(+s.reps,'повторение','повторения','повторений')+'!')}
root.addEventListener('input',ev=>{const t=ev.target;const k=t.dataset.kg||t.dataset.reps;if(!k||RO)return;const [id,i]=k.split(':');const e=EX.find(x=>x.id===id);const s=setsOf(e)[+i];if(t.dataset.kg)s.kg=t.value;else s.reps=t.value;
  const el=document.getElementById(`set-${id}-${i}`);const full=s.kg.trim()&&s.reps.trim();
  if(full&&!s.done){s.done=true;el.classList.add('fill')}else if(!full&&s.done){s.done=false;el.classList.remove('fill')}
  const pbNow=isPb(e,s);el.classList.toggle('pb',pbNow);const gb=el.querySelector('.goal b');const has=gb.querySelector('svg');if(pbNow&&!has)gb.insertAdjacentHTML('beforeend',' '+I.trophy);if(!pbNow&&has)has.remove();
  save();volUpdate(e)});
root.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.vfile){S.video[t.dataset.vfile]=true;save();render();U.toast('Видео сохранено, тренер увидит его в отчёте');return}
  const k=t.dataset.kg||t.dataset.reps;if(!k||RO)return;const [id,i]=k.split(':');const e=EX.find(x=>x.id===id);const s=setsOf(e)[+i];
  if(s.done&&!s.rested){s.rested=true;save();const pair=e.sup?EX.filter(x=>x.sup===e.sup):null;if(pair&&pair[pair.length-1].id!==e.id){startRest(e);U.toast('Короткий отдых '+e.rest[0]+' с, потом '+pair[pair.indexOf(e)+1].id);return}if(+i===e.sets-1){const nx=EX[EX.indexOf(e)+1];if(nx)S.open=nx.id}const nowBest=isPb(e,s);startRest(e);if(nowBest)U.toast('Рекорд в '+e.id+' на '+D.pl(+s.reps,'повторение','повторения','повторений')+'!')}});
function sheetSwap(e){let sel=null,scope='today';const alts=D.ALTS[e.muscle]||D.ALTS['Другое'];
  const draw=()=>{const s=U.openSheet(`<h3>Замена: ${e.id}</h3><p>Похожие упражнения на ${e.muscle.toLowerCase()}, из базы тренера</p>${alts.map((a,i)=>`<div class="opt ${sel===i?'sel':''}" data-alt="${i}"><div class="thumb" style="width:44px;height:44px">${I.play}</div><div class="t"><b>${a}</b><span>${i===0?'история: есть прошлые веса':'история: первый раз'}</span></div></div>`).join('')}
   <div class="seg"><button class="${scope==='today'?'on':''}" data-scope="today">Только сегодня</button><button class="${scope==='phase'?'on':''}" data-scope="phase">До конца фазы</button></div><div class="row2"><button class="ghost" data-close>Отмена</button><button class="btn" data-apply>Заменить</button></div>`);
   s.onclick=ev=>{const a=ev.target.closest('[data-alt]'),sc=ev.target.closest('[data-scope]'),ap=ev.target.closest('[data-apply]');if(a){sel=+a.dataset.alt;draw()}if(sc){scope=sc.dataset.scope;draw()}
     if(ap){if(sel==null){U.toast('Выбери упражнение');return}S.swap[e.id]={name:alts[sel],scope};save();U.closeSheet();render();U.toast(scope==='today'?'Заменено на сегодня. Тренер увидит в сводке':'Заменено до конца фазы. Тренер увидит в сводке');s.onclick=null}
     if(ev.target.closest('[data-close]'))s.onclick=null}};draw()}
function sheetTech(e){U.openSheet(`<h3>Техника: ${nameOf(e)}</h3><p>Кадры тренера с углами и моменты, на что смотреть</p><div class="stills"><div class="still">${I.photo}<span>скрин тренера: старт</span><div class="ang" data-a="угол"></div></div><div class="still">${I.photo}<span>скрин тренера: нижняя точка</span><div class="ang" data-a="угол"></div></div></div>
  <ul class="pts"><li><b>1</b><span>Момент техники, текст тренера</span></li><li><b>2</b><span>Момент техники, текст тренера</span></li><li><b>3</b><span>Момент техники, текст тренера</span></li></ul>
  <h4>Моя заметка</h4><p>Клиент пишет своё: высота сиденья, номер рукояти, что мешало</p><textarea class="note-in" id="noteIn" placeholder="Например: сиденье 5, хват на ширину меток">${S.notes[e.id]||''}</textarea><div class="row2"><button class="ghost" data-close>Закрыть</button><button class="btn" id="noteSave">Сохранить</button></div>`,s=>{s.querySelector('#noteSave').onclick=()=>{S.notes[e.id]=s.querySelector('#noteIn').value;save();U.closeSheet();U.toast('Заметка сохранена')}})}
function menu(){const s=U.openSheet(`<h3>Тренировка</h3><p>Если сегодня не получается</p><div class="opt" id="mMove"><div class="ico">${I.cal}</div><div class="t"><b>Перенести на другой день</b><span>программа сдвинется, тренер увидит</span></div></div><div class="opt" id="mSkip"><div class="ico">${I.x}</div><div class="t"><b>Пропустить тренировку</b><span>одной строкой: почему</span></div></div><div class="opt" id="mPause"><div class="ico">${I.cal}</div><div class="t"><b>Пауза на неделю</b><span>отпуск, болезнь: программа сдвинется целиком</span></div></div><div class="opt" id="mReset"><div class="ico">${I.skip}</div><div class="t"><b>Сбросить прототип</b><span>очистить всё, что нажато на этом экране</span></div></div><div class="row2"><button class="ghost" data-close>Закрыть</button></div>`);
  s.querySelector('#mMove').onclick=()=>{const s2=U.openSheet(`<h3>Перенести на</h3><p>Эта тренировка переедет, остальные сдвинутся</p><div class="days">${['вс 4','пн 5','вт 6','ср 7'].map(d=>`<button class="chip" data-day="${d}">${d}</button>`).join('')}</div><div class="row2"><button class="ghost" data-close>Отмена</button></div>`);s2.onclick=ev=>{const d=ev.target.closest('[data-day]');if(d){U.closeSheet();U.toast('Перенесено на '+d.dataset.day+'. Тренер увидит в сводке');s2.onclick=null}if(ev.target.closest('[data-close]'))s2.onclick=null}};
  s.querySelector('#mSkip').onclick=()=>{U.openSheet(`<h3>Пропустить</h3><p>Причина одной строкой, тренеру в сводку</p><textarea class="note-in" id="skipWhy" placeholder="Например: заболел, командировка"></textarea><div class="row2"><button class="ghost" data-close>Отмена</button><button class="btn" id="skipGo">Пропустить</button></div>`,s3=>{s3.querySelector('#skipGo').onclick=()=>{U.closeSheet();U.toast('Пропуск записан, тренер увидит причину');setTimeout(()=>location.href='tren.html',900)}})};
  s.querySelector('#mPause').onclick=()=>{U.openSheet(`<h3>Пауза на неделю</h3><p>Все тренировки сдвинутся на 7 дней, норма питания останется. Тренер увидит</p><textarea class="note-in" id="pauseWhy" placeholder="Причина одной строкой"></textarea><div class="row2"><button class="ghost" data-close>Отмена</button><button class="btn" id="pauseGo">Поставить паузу</button></div>`,s4=>{s4.querySelector('#pauseGo').onclick=()=>{U.closeSheet();U.toast('Пауза до 11 октября. Тренер увидит причину');setTimeout(()=>location.href='tren.html',900)}})};
  s.querySelector('#mReset').onclick=()=>{D.store.del(KEY);D.store.del('done:'+W.date);location.reload()}}
function finish(){const all=EX.flatMap(e=>setsOf(e).map(s=>({e,s})));const done=all.filter(x=>x.s.done);const ton=Math.round(done.reduce((a,x)=>a+(+x.s.kg||0)*(+x.s.reps||0),0));
  const pbs=EX.filter(e=>setsOf(e).some(s=>isPb(e,s)));let rating=S.rating||null;
  const draw=()=>{const s=U.openSheet(`<h3>Тренировка завершена</h3><p>${W.title}</p><div class="stats"><div class="stat"><b>${fmt((Date.now()-S.start)/1000)}</b><span>время</span></div><div class="stat"><b>${ton.toLocaleString('ru')}</b><span>кг тоннаж</span></div><div class="stat"><b>${done.length}/${all.length}</b><span>подходов</span></div></div>
   ${pbs.map(e=>{const s=setsOf(e).filter(x=>isPb(e,x)).sort((a,b)=>+b.kg-+a.kg)[0];return `<div class="pb">${I.trophy} Рекорд: ${e.id} · ${nameOf(e)} · ${s.kg} кг × ${s.reps}</div>`}).join('')}<h4>Как прошла тренировка?</h4><p>из 10, это пойдёт в недельный отчёт само</p><div class="rate">${Array.from({length:10},(_,i)=>`<button class="${rating===i+1?'on':''}" data-r="${i+1}">${i+1}</button>`).join('')}</div><div class="row2"><button class="ghost" data-close>Назад</button><button class="btn" id="fin">Сохранить</button></div>`);
   s.querySelector('#fin').onclick=()=>{if(!rating){U.toast('Поставь оценку из 10');return}S.rating=rating;save();D.store.set('done:'+W.date,{rating,ton,mins:Math.max(1,Math.round((Date.now()-S.start)/60000)),pbs:pbs.length});U.closeSheet();U.toast('Сохранено. Тренер получит тренировку в сводке');setTimeout(()=>location.href='tren.html',900)};
   s.onclick=ev=>{const r=ev.target.closest('[data-r]');if(r){rating=+r.dataset.r;draw()}if(ev.target.closest('[data-close]'))s.onclick=null}};draw()}
if(MODE!=='view')setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=fmt((Date.now()-S.start)/1000);
  if(S.rest){const left=(S.rest.end-Date.now())/1000;const cc=document.getElementById('restCnt'),b=document.getElementById('restBar');if(left<=0){S.rest=null;save();render();U.toast('Отдых закончился, следующий подход')}else{if(cc)cc.textContent=fmt(left);if(b)b.style.width=(100*left/S.rest.total)+'%'}}},1000);
render();
</script>
</body></html>
